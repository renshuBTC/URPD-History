<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to SOPD...</title>
<script>
// SOPD is now merged into the main page — redirect with view=flow
(function() {
  var p = new URLSearchParams(window.location.search);
  var url = "../?view=flow";
  var params = [];
  if (p.get("mode")) params.push("mode=" + p.get("mode"));
  if (p.get("split")) params.push("split=" + p.get("split"));
  if (p.get("date")) params.push("date=" + p.get("date"));
  if (p.get("iv")) params.push("iv=" + p.get("iv"));
  if (p.get("rw")) params.push("rw=" + p.get("rw"));
  if (p.get("lang")) params.push("lang=" + p.get("lang"));
  if (params.length > 0) url += "&" + params.join("&");
  window.location.replace(url);
})();
</script>
</head>
<body style="background:#000;color:#ff8c00;font-family:monospace;text-align:center;padding-top:40vh;">
<p>Redirecting to merged chart...</p>
<p><a href="../?view=flow" style="color:#ff8c00;">Click here if not redirected</a></p>
</body>
</html>
