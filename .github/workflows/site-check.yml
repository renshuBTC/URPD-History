name: Site check

# Checks, four times a day, that visitors get exactly what this repository publishes, so tampering anywhere in between
# (the domain or GitHub Pages) turns this workflow red and GitHub emails the owner:
#   - https://bitcoinsupplychart.com/ serves this repository's index.html, byte for byte, and plain http redirects there
#   - so are the two pages it links to (privacy.html, terms.html) and the data it loads from this site:
#     data/youtube.json, which says where its video buttons go, and data/scales.json, the axis history
# The page links to no file to download (tests/security.test.cjs), so a live page that is index.html links to none either.
on:
  schedule:
    - cron: "41 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SITE: https://bitcoinsupplychart.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The live site is this repository's files
        run: |
          # A merge takes a few minutes to go live, so only a difference that lasts counts. Each try compares with the
          # latest main, fetched again: the daily axis history and the weekly videos commit to it while this runs.
          files="index.html privacy.html terms.html data/youtube.json data/scales.json"
          for _ in $(seq 1 8); do
            git fetch -q --depth=1 origin main
            differ=""
            for f in $files; do
              url="$SITE$([ "$f" = index.html ] || echo "$f")?check=$(date +%s)"
              if ! curl -fsS --proto '=https' --tlsv1.2 --max-time 60 -o "$RUNNER_TEMP/live" "$url" || ! git show "FETCH_HEAD:$f" | cmp -s - "$RUNNER_TEMP/live"; then
                differ="$differ $f"
              fi
            done
            if [ -z "$differ" ]; then echo "The live site is $files as of $(git rev-parse --short FETCH_HEAD)."; exit 0; fi
            sleep 90
          done
          echo "::error::$SITE is not serving this repository's$differ"
          for f in $differ; do
            curl -sS --max-time 60 "$SITE$([ "$f" = index.html ] || echo "$f")" | diff <(git show "FETCH_HEAD:$f") - | head -20 || true
          done
          exit 1

      - name: Plain http is sent to https
        run: |
          # Over plain http anyone on the network path could rewrite the page.
          loc=$(curl -sS --retry 3 --retry-all-errors --max-time 30 -o /dev/null -w '%{redirect_url}' http://bitcoinsupplychart.com/ || true)
          if [ "$loc" = "$SITE" ]; then echo "http redirects to https."
          else echo "::error::http://bitcoinsupplychart.com/ is served without a redirect to https: tick Enforce HTTPS in Settings -> Pages"; exit 1; fi
