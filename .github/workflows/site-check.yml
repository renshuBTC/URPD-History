name: Site check

# Checks, four times a day, that visitors get exactly what this repository publishes, so tampering anywhere in between
# (the domain, GitHub Pages or the video release) turns this workflow red and GitHub emails the owner:
#   - https://bitcoinsupplychart.com/ serves this repository's index.html, byte for byte, and only over HTTPS
#   - the file behind the ▶ link carries a valid build attestation from this repository's Daily video workflow on main,
#     and is the one whose SHA-256 the release notes give
# The times fall after the daily video is normally out (about 03:00 UTC, or 07:00 after the catch-up run).
on:
  schedule:
    - cron: "41 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SITE: https://bitcoinsupplychart.com/
      VIDEO_URL: https://github.com/renshuBTC/URPD-History/releases/download/video/URPD_daily_full_history_4K60.mp4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The live page is this repository's index.html
        run: |
          # A merge takes a few minutes to go live, so only a difference that lasts counts.
          for _ in $(seq 1 8); do
            if curl -fsS --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/live.html" "${SITE}?check=$(date +%s)" && cmp -s "$RUNNER_TEMP/live.html" index.html; then
              echo "The live page is index.html as of $(git rev-parse --short HEAD)."; exit 0
            fi
            sleep 90
          done
          echo "::error::$SITE is not serving this repository's index.html"
          diff index.html "$RUNNER_TEMP/live.html" | head -40 || true
          exit 1

      - name: Plain http is sent to https
        run: |
          # Over plain http anyone on the network path could rewrite the page. Only a warning until "Enforce HTTPS" is
          # ticked in Settings -> Pages, which only the owner can do.
          loc=$(curl -sS -o /dev/null -w '%{redirect_url}' http://bitcoinsupplychart.com/)
          if [ "$loc" = "$SITE" ]; then echo "http redirects to https."
          else echo "::warning::http://bitcoinsupplychart.com/ is served without a redirect to https: tick Enforce HTTPS in Settings -> Pages"; fi

      - name: The live page links to the official video
        run: grep -qF "id=\"videoBtn\" href=\"$VIDEO_URL\"" "$RUNNER_TEMP/live.html"

      - name: The video is the one the Daily video workflow built
        run: |
          # A new video takes a moment to swap in, so a mismatch is checked twice more before it counts.
          for k in 1 2 3; do
            curl -fsSL --proto '=https' -o "$RUNNER_TEMP/video.mp4" "$VIDEO_URL"
            SHA=$(sha256sum "$RUNNER_TEMP/video.mp4" | cut -d' ' -f1)
            if gh release view video --json body --jq .body | grep -qF "SHA-256: $SHA"; then echo "SHA-256 $SHA, as in the release notes."; break; fi
            if [ "$k" = 3 ]; then echo "::error::The video's SHA-256 ($SHA) is not the one in the release notes"; exit 1; fi
            sleep 120
          done
          gh attestation verify "$RUNNER_TEMP/video.mp4" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/video.yml" --source-ref refs/heads/main --deny-self-hosted-runners
