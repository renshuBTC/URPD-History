name: YouTube credentials check

# Run by hand (Actions -> YouTube credentials check -> Run workflow) after setting or changing the three YOUTUBE_*
# secrets: asks Google for an access token with them, as the Weekly videos workflow's youtube job does before it
# uploads, and says whether that worked. It uploads nothing. The secrets are seen only by the one step that uses them,
# which runs this repository's own code (tools/video/youtube.mjs --check) and nothing installed.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Ask Google for an access token
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node tools/video/youtube.mjs --check
