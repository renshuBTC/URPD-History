name: Axis history

# Extends data/scales.json by each finished day, so the chart's axes stay a function of the date
# alone (see tools/build-scales.cjs). About 23 requests to bitview.space per new day. It commits
# only when a day was added, and catches up on any days a failed run missed.
on:
  schedule:
    - cron: "40 1 * * *"   # 01:40 UTC, after the previous day has closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: axis-history
  cancel-in-progress: false

jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node tools/build-scales.cjs --seconds 1500
      - run: node --test tests/*.test.cjs
      - name: Commit the new days
        run: |
          if git diff --quiet -- data/scales.json; then echo "No new days."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scales.json
          git commit -m "Axis history through $(node -p "require('./data/scales.json').end")"
          git push
