name: Daily video

# Every day, for the site's ▶ button and for scrubbing through history:
#   1. adds the day that just ended to the axis history (data/scales.json) and commits it to main
#   2. adds it to the video's store (the files on the "video-data" release)
#   3. renders the full-history 4K video with tools/video and publishes it on the "video" release,
#      which is the file the ▶ button downloads
# New release files replace the old ones only once they are fully uploaded (tools/video/replace-asset.sh), so the
# button never meets a missing file. Standard GitHub-hosted runners are free for public repositories; the whole job
# takes about an hour and a half.
on:
  schedule:
    # 01:23 UTC, well after yesterday closed and off the top of the hour, when GitHub delays or drops the most
    # scheduled runs; the new video is out by about 04:00 UTC. The second run only catches up if the first did not
    # happen or found no new day, and otherwise stops after a minute.
    - cron: "23 1 * * *"
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write   # the axis-history commit and the release files
  pages: write      # asking Pages to rebuild after that commit

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      VIDEO: URPD_daily_full_history_4K60.mp4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Add the finished days to the axis history
        run: node tools/build-scales.cjs --cache "$RUNNER_TEMP/raw" --seconds 1800

      - name: Test the site
        run: node --test tests/*.test.cjs

      - name: Commit the axis history
        run: |
          if git diff --quiet -- data/scales.json; then echo "No new days."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scales.json
          git commit -m "Axis history through $(node -p "require('./data/scales.json').end")"
          git pull --rebase --quiet
          git push
          # A push made with this workflow's own token does not start the Pages build by itself.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null || echo "Could not request a Pages build; the next push publishes it."

      - name: Add the finished days to the video's store
        id: store
        run: |
          mkdir -p "$RUNNER_TEMP/store"
          gh release download video-data --dir "$RUNNER_TEMP/store"
          node tools/video/store.mjs "$RUNNER_TEMP/store" --cache "$RUNNER_TEMP/raw" > "$RUNNER_TEMP/changed.txt"
          # The year files first and meta.json last (store.mjs lists them in that order), so a run stopped part way
          # leaves a store the next run can still read.
          [ ! -s "$RUNNER_TEMP/changed.txt" ] || bash tools/video/replace-asset.sh video-data $(cat "$RUNNER_TEMP/changed.txt")
          END=$(node -p "require(process.env.RUNNER_TEMP + '/store/meta.json').days.at(-1)[0]")
          echo "end=$END" >> "$GITHUB_OUTPUT"
          # The published video's last day, from its release notes (none before the first video).
          SHOWN=$(gh release view video --json body --jq .body 2> /dev/null | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | tail -n 1 || true)
          if [ "$SHOWN" != "$END" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "render=yes" >> "$GITHUB_OUTPUT"
          else
            echo "The published video already runs to $END."
          fi

      - name: Install the renderer
        if: steps.store.outputs.render == 'yes'
        working-directory: tools/video
        run: |
          npm ci
          npx playwright install --with-deps chromium
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }

      - name: Render the video
        if: steps.store.outputs.render == 'yes'
        run: node tools/video/render.mjs "$RUNNER_TEMP/store" "$RUNNER_TEMP/$VIDEO"

      - name: Publish the video
        if: steps.store.outputs.render == 'yes'
        env:
          END: ${{ steps.store.outputs.end }}
        run: |
          # The last date in these notes is how the next run knows which day the published video reaches.
          NOTES="Every day from 2009-01-03 to $END, 5 minutes at 60 fps, 3840x2160, H.264. Rebuilt every day by the Daily video workflow; the ▶ button on https://bitcoinsupplychart.com downloads it."
          gh release view video > /dev/null 2>&1 || gh release create video --title "Full-history video (4K)" --notes "$NOTES"
          bash tools/video/replace-asset.sh video "$RUNNER_TEMP/$VIDEO"
          gh release edit video --notes "$NOTES"
