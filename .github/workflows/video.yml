  record:
    # Names the new videos in data/youtube.json for the site's four video buttons. A video that others cannot watch yet
    # (a private upload, or none because its post failed) is not recorded: its button keeps the last one they could, or
    # opens the channel. Runs when any post was viewable, also when others failed.
    needs: [update, youtube-usd, youtube-btc, youtube-pctusd, youtube-pctbtc]
    if: >-
      ${{ !cancelled() && (
        needs.youtube-usd.outputs.privacy == 'unlisted' || needs.youtube-usd.outputs.privacy == 'public' ||
        needs.youtube-btc.outputs.privacy == 'unlisted' || needs.youtube-btc.outputs.privacy == 'public' ||
        needs.youtube-pctusd.outputs.privacy == 'unlisted' || needs.youtube-pctusd.outputs.privacy == 'public' ||
        needs.youtube-pctbtc.outputs.privacy == 'unlisted' || needs.youtube-pctbtc.outputs.privacy == 'public') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the commit
    steps:
      # The latest main, not the commit this run started from: data/youtube.json may have changed since (a merge
      # during the render), and the file written here starts from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Record the latest videos
        env:
          USD_ID: ${{ needs.youtube-usd.outputs.id }}
          USD_PRIVACY: ${{ needs.youtube-usd.outputs.privacy }}
          BTC_ID: ${{ needs.youtube-btc.outputs.id }}
          BTC_PRIVACY: ${{ needs.youtube-btc.outputs.privacy }}
          PCTUSD_ID: ${{ needs.youtube-pctusd.outputs.id }}
          PCTUSD_PRIVACY: ${{ needs.youtube-pctusd.outputs.privacy }}
          PCTBTC_ID: ${{ needs.youtube-pctbtc.outputs.id }}
          PCTBTC_PRIVACY: ${{ needs.youtube-pctbtc.outputs.privacy }}
          END: ${{ needs.update.outputs.end }}
        run: |
          [[ "$END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "end: '$END'" >&2; exit 1; }
          # Each video: today's upload if others can watch it, else whatever was recorded for it before. ("end" is
          # quoted in jq, where a bare end is a keyword.)
          viewable() { [[ ( "$2" = unlisted || "$2" = public ) && "$1" =~ ^[A-Za-z0-9_-]{11}$ ]]; }
          entry() {   # entry KEY ID PRIVACY
            if viewable "$2" "$3"; then jq -n --arg id "$2" --arg day "$END" '{id: $id, "end": $day}'
            else jq --arg k "$1" '.[$k] // null' data/youtube.json; fi
          }
          USD=$(entry usd "$USD_ID" "$USD_PRIVACY")
          BTC=$(entry btc "$BTC_ID" "$BTC_PRIVACY")
          PCTUSD=$(entry pctusd "$PCTUSD_ID" "$PCTUSD_PRIVACY")
          PCTBTC=$(entry pctbtc "$PCTBTC_ID" "$PCTBTC_PRIVACY")
          ABOUT="The latest videos on YouTube for the site's four video buttons, one for each view: usd, the bars in dollars (HISTORY (USD VALUE)), btc, in coins (HISTORY (BTC)), pctusd, every bar as its percent of the day's realized cap (HISTORY (% USD VALUE)), and pctbtc, of the day's supply (HISTORY (% BTC)). Written by .github/workflows/video.yml once an upload is viewable (unlisted or public); null until then."
          jq -n --arg about "$ABOUT" --argjson usd "$USD" --argjson btc "$BTC" --argjson pctusd "$PCTUSD" --argjson pctbtc "$PCTBTC" \
            '{about: $about, usd: $usd, btc: $btc, pctusd: $pctusd, pctbtc: $pctbtc}' > "$RUNNER_TEMP/youtube.json"
          mv "$RUNNER_TEMP/youtube.json" data/youtube.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          if git diff --cached --quiet; then echo "Already recorded."; exit 0; fi
          git commit -m "Latest videos on YouTube, through $END"
          git pull --rebase --quiet
          git push   # Pages rebuilds the site from this push by itself
