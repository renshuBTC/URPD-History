name: Weekly videos

# Once a week, three videos of the whole history for YouTube, one for each way the site draws its bars
# (tools/video/looks.mjs): by age band (AGE), split at 150 days (<150D/>150D), and as recorded, unsmoothed and black
# on a light chart (RAW). The workflow runs every day all the same, because its first job also keeps the site's axis
# history current:
#   1. update:  adds the day that just ended to the axis history (data/scales.json, committed to main) and to the
#               videos' store (the files on the "video-data" release), and decides whether new videos are due: once
#               the store reaches seven days past the published ones, or on a run started by hand
#   2. render:  draws each 4K video with tools/video, each on a runner of its own
#   3. vet:     accepts each file only if it is exactly the expected video, and rewrites its container keeping only
#               the picture
#   4. publish: attests where the videos were built and keeps them on the "video" release, whose notes tell the next
#               run which day they reach (the site does not link to them)
#   5. youtube-age, youtube-lthsth, youtube-raw: post each to YouTube, unlisted (tools/video/youtube.mjs), once the
#               channel's credentials are set up, each from a job of its own
#   6. record:  names them in data/youtube.json for the site's three video buttons, once YouTube lets others watch them
#
# The jobs are split by trust. Only this repository's own code runs with a token that can write (update, publish,
# record), and none of them ever parses a video. The YouTube credentials are seen only by the two steps of each
# youtube job that need them, which run this repository's own code and nothing installed. The renderer runs
# third-party code (Playwright, Chromium, ffmpeg and their npm packages), and the vet job parses the rendered files with
# ffmpeg, so both get only a read-only token and no credentials. Each hands its file on as a workflow artifact, and
# the jobs after vet take the vetted files by their exact names only (any other artifact of the run, which the render
# job could have made, is never read). The publish job signs a build attestation for the vetted files, which anyone
# can check with `gh attestation verify` (see SECURITY.md). New release files replace the old ones only once fully
# uploaded (tools/video/replace-asset.sh), so the release never holds half a file. Actions are pinned to full commit
# hashes. Standard GitHub-hosted runners are free for public repositories; a run that draws the videos takes about an
# hour and a half, any other a minute.
on:
  schedule:
    # 01:23 UTC, well after yesterday closed and off the top of the hour, when GitHub delays or drops the most
    # scheduled runs (it can still start them hours late); on the day new videos are due they are out about an hour
    # and a half after the run starts. The second run only catches up if the first did not happen or found no new
    # day, and otherwise stops after a minute.
    - cron: "23 1 * * *"
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}   # each job asks for exactly what it needs

# One run on main at a time, the next waiting for it. A run started by hand on another branch does nothing (every job
# is main-only) and gets a group of its own, so it can never take the place of a waiting run on main.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'daily-video' || format('video-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  # The videos' file names on the release, each naming its look: the bars coloured by age band (AGE), split at 150
  # days (<150D/>150D), written Under-Over-150D as in its YouTube title, since a file name can hold no < or > (Windows
  # refuses them) nor / (a folder), and unsmoothed (RAW). Each ends in .mp4: a file ending in .com is a program on
  # Windows. The render and vet jobs name them again, in their matrix.
  VIDEO: BitcoinSupplyChart.com-AGE.mp4
  VIDEO_LTHSTH: BitcoinSupplyChart.com-Under-Over-150D.mp4
  VIDEO_RAW: BitcoinSupplyChart.com-RAW.mp4

jobs:
  update:
    # Only on main: a run started by hand on another branch would commit there and publish a video that the site
    # check (which wants main) then flags as not genuine.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # the axis-history commit and the release files
    outputs:
      render: ${{ steps.store.outputs.render }}
      start: ${{ steps.store.outputs.start }}
      end: ${{ steps.store.outputs.end }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Add the finished days to the axis history
        run: node tools/build-scales.cjs --cache "$RUNNER_TEMP/raw" --seconds 1800

      - name: Test the site
        run: node --test tests/*.test.cjs

      - name: Commit the axis history
        run: |
          if git diff --quiet -- data/scales.json; then echo "No new days."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scales.json
          git commit -m "Axis history through $(node -p "require('./data/scales.json').end")"
          git pull --rebase --quiet
          git push   # Pages rebuilds the site from this push by itself

      - name: Add the finished days to the video's store
        id: store
        run: |
          mkdir -p "$RUNNER_TEMP/store"
          # An empty release (the store lost) is a store to rebuild, not an error, though gh refuses to download
          # nothing; a missing release still stops the run.
          gh release download video-data --dir "$RUNNER_TEMP/store" || [ "$(gh release view video-data --json assets --jq '.assets | length')" = 0 ]
          # A run stopped between the two halves of a swap (replace-asset.sh) can leave a file only under its
          # temporary name. Take it back under its real name rather than stall every run after it; a year file that
          # has run ahead of meta.json is read only as far as meta.json goes (store.mjs).
          for part in "$RUNNER_TEMP"/store/*.part.*; do
            [ -e "$part" ] || continue
            final="${part/.part./.}"
            if [ -e "$final" ]; then rm -f "$part"; else mv "$part" "$final"; fi
          done
          # --seconds: a lost store rebuilds over several runs, keeping what each one adds.
          node tools/video/store.mjs "$RUNNER_TEMP/store" --cache "$RUNNER_TEMP/raw" --seconds 1500 > "$RUNNER_TEMP/changed.txt"
          # The year files first and meta.json last (store.mjs lists them in that order), so a run stopped part way
          # leaves a store the next run can still read.
          mapfile -t CHANGED < "$RUNNER_TEMP/changed.txt"
          [ "${#CHANGED[@]}" = 0 ] || bash tools/video/replace-asset.sh video-data "${CHANGED[@]}"
          END=$(node -p "require(process.env.RUNNER_TEMP + '/store/meta.json').days.at(-1)[0]")
          echo "end=$END" >> "$GITHUB_OUTPUT"
          # The video's first day: the first with anything on the chart (tools/video/store.mjs firstShownIndex).
          START=$(node --input-type=module -e "import { readStore, firstShownIndex } from './tools/video/store.mjs';
            const s = readStore(process.env.RUNNER_TEMP + '/store'); console.log(s.meta.days[firstShownIndex(s.meta, s.bars)][0]);")
          echo "start=$START" >> "$GITHUB_OUTPUT"
          # The published videos' last day: the last date in their release notes (see publish), none before the first
          # videos. Only a 404, no such release, means none: any other failure to read them, after a few tries, stops
          # the run rather than pass for "no videos yet" and draw new ones at once. (gh release view is not asked: it
          # reports some failed lookups as "release not found".)
          SHOWN=""
          for k in 1 2 3 4 5; do
            if NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/video" --jq .body 2> "$RUNNER_TEMP/notes.err"); then
              SHOWN=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' <<< "$NOTES" | tail -n 1 || true); break
            fi
            if grep -q 'HTTP 404' "$RUNNER_TEMP/notes.err"; then break; fi
            [ "$k" = 5 ] && { cat "$RUNNER_TEMP/notes.err" >&2; exit 1; }
            sleep $((k * 5))
          done
          # New videos once a week: when the store reaches seven days past the published ones. With none published,
          # once the store has every day the axis history has: a lost store is rebuilt over several runs, and a short
          # video must not go out meanwhile. While it is rebuilt it stays behind the published videos, and shorter
          # videos must not replace the full ones. A run started by hand draws new videos whenever the store is not
          # behind.
          SCALES_END=$(node -p "require('./data/scales.json').end")
          DUE=$([ -n "$SHOWN" ] && date -u -d "$SHOWN + 7 days" +%F || true)
          if [ -z "$SHOWN" ] && [ "$END" != "$SCALES_END" ]; then
            echo "No videos are published yet, and the store runs to $END of $SCALES_END: it catches up first."
          elif [ -z "$SHOWN" ] || [[ ! "$END" < "$DUE" ]] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [[ ! "$END" < "$SHOWN" ]]; }; then
            echo "render=yes" >> "$GITHUB_OUTPUT"
          elif [[ "$END" < "$SHOWN" ]]; then
            echo "The store runs to $END, behind the published videos ($SHOWN): it keeps catching up."
          else
            echo "The published videos run to $SHOWN; the next are drawn once the store reaches $DUE."
          fi

      - name: Hand the store to the renderer
        if: steps.store.outputs.render == 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store
          path: ${{ runner.temp }}/store
          if-no-files-found: error
          retention-days: 1
          compression-level: 0   # already gzipped

  render:
    needs: update
    if: needs.update.outputs.render == 'yes'
    # A fixed image, not ubuntu-latest: Playwright installs Chromium's system packages by the release's name, and
    # ffmpeg's output is checked exactly, so moving to a new Ubuntu is done on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # One runner for each video: its look (tools/video/looks.mjs) and its file name (VIDEO, VIDEO_LTHSTH, VIDEO_RAW).
    # One that fails does not cancel the other, so Re-run failed jobs draws only the failed one again.
    strategy:
      fail-fast: false
      matrix:
        include:
          - look: age
            file: BitcoinSupplyChart.com-AGE.mp4
          - look: lthsth
            file: BitcoinSupplyChart.com-Under-Over-150D.mp4
          - look: raw
            file: BitcoinSupplyChart.com-RAW.mp4
    env:
      LOOK: ${{ matrix.look }}
      FILE: ${{ matrix.file }}
    permissions:
      contents: read    # nothing else: this job runs third-party code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: store
          path: ${{ runner.temp }}/store

      - name: Install the renderer
        working-directory: tools/video
        run: |
          # Exactly the versions in package-lock.json, checked against its hashes, and no install scripts run.
          npm ci --ignore-scripts
          node_modules/.bin/playwright install --with-deps chromium
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }

      - name: Render the video
        run: node tools/video/render.mjs "$RUNNER_TEMP/store" "$RUNNER_TEMP/$FILE"

      - name: Check the video
        run: bash tools/video/check-video.sh "$RUNNER_TEMP/$FILE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: video-${{ matrix.look }}
          path: ${{ runner.temp }}/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0   # already compressed

  vet:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - look: age
            file: BitcoinSupplyChart.com-AGE.mp4
          - look: lthsth
            file: BitcoinSupplyChart.com-Under-Over-150D.mp4
          - look: raw
            file: BitcoinSupplyChart.com-RAW.mp4
    env:
      FILE: ${{ matrix.file }}
    permissions:
      contents: read    # nothing else: this job parses a file that third-party code produced
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: video-${{ matrix.look }}
          path: ${{ runner.temp }}/rendered

      - name: Accept only the expected video, rewritten by Ubuntu's ffmpeg
        run: |
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          bash tools/video/check-video.sh "$RUNNER_TEMP/rendered/$FILE"
          # A fresh container holding only the picture: no metadata, chapters or other boxes, and of the H.264 stream
          # only the units a picture needs (slices 1-5, SPS, PPS and delimiters 7-9), so no SEI or filler, where
          # free-form data could ride along. Then every frame is decoded.
          mkdir -p "$RUNNER_TEMP/vetted"
          ffmpeg -nostdin -v error -i "$RUNNER_TEMP/rendered/$FILE" -map 0:v:0 -c copy -bsf:v 'filter_units=pass_types=1-5|7-9' \
            -map_metadata -1 -map_chapters -1 -movflags +faststart -f mp4 "$RUNNER_TEMP/vetted/$FILE"
          bash tools/video/check-video.sh "$RUNNER_TEMP/vetted/$FILE" --decode

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: video-vetted-${{ matrix.look }}
          path: ${{ runner.temp }}/vetted/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7   # a week, so a failed publish or post can be run again
          compression-level: 0

  publish:
    needs: [update, vet]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write           # the video release
      id-token: write           # signing the build attestation (Sigstore)
      attestations: write       # storing it
      artifact-metadata: write  # its storage record
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each vetted video by its exact name. A pattern would also take in any other artifact of this run whose name
      # matched, and one made by the render job (third-party code) could then have replaced a vetted file.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: video-vetted-age
          path: ${{ runner.temp }}/vetted
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: video-vetted-lthsth
          path: ${{ runner.temp }}/vetted
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: video-vetted-raw
          path: ${{ runner.temp }}/vetted

      - name: Look at the files without parsing them
        run: |
          # The vet job did the real checks. Here only the bytes are looked at, never decoded: each video begins with
          # an MP4's ftyp box and is under GitHub's 2 GiB limit for a release file, and nothing else came with them.
          for f in "$RUNNER_TEMP/vetted/$VIDEO" "$RUNNER_TEMP/vetted/$VIDEO_LTHSTH" "$RUNNER_TEMP/vetted/$VIDEO_RAW"; do
            [ "$(head -c 8 "$f" | tail -c 4)" = ftyp ] || { echo "$f: not an MP4" >&2; exit 1; }
            size=$(stat -c %s "$f"); [ "$size" -gt 18000000 ] && [ "$size" -lt 2000000000 ] || { echo "$f: $size bytes" >&2; exit 1; }
          done
          [ "$(find "$RUNNER_TEMP/vetted" -type f | wc -l)" = 3 ] || { find "$RUNNER_TEMP/vetted" >&2; exit 1; }

      - name: Attest where the videos were built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/vetted/${{ env.VIDEO }}
            ${{ runner.temp }}/vetted/${{ env.VIDEO_LTHSTH }}
            ${{ runner.temp }}/vetted/${{ env.VIDEO_RAW }}

      - name: Publish the videos
        env:
          START: ${{ needs.update.outputs.start }}
          END: ${{ needs.update.outputs.end }}
        run: |
          [[ "$START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "days: '$START' '$END'" >&2; exit 1; }
          SHA=$(sha256sum "$RUNNER_TEMP/vetted/$VIDEO" | cut -d' ' -f1)
          SHA_LTHSTH=$(sha256sum "$RUNNER_TEMP/vetted/$VIDEO_LTHSTH" | cut -d' ' -f1)
          SHA_RAW=$(sha256sum "$RUNNER_TEMP/vetted/$VIDEO_RAW" | cut -d' ' -f1)
          # The last date in these notes is how the next run knows which day the published videos reach.
          NOTES="Every day from $START (the first with anything on the chart) to $END, 5 minutes at 60 fps, 3840x2160, H.264, in three videos: $VIDEO with the bars coloured by age band, $VIDEO_LTHSTH split at 150 days (<150D and >150D), and $VIDEO_RAW as recorded, unsmoothed, black on a light chart. Drawn again once a week by the Weekly videos workflow, which posts them to YouTube; the site does not link to these files.

          SHA-256 of $VIDEO: $SHA
          SHA-256 of $VIDEO_LTHSTH: $SHA_LTHSTH
          SHA-256 of $VIDEO_RAW: $SHA_RAW
          Check any: gh attestation verify FILE --repo $GITHUB_REPOSITORY (see SECURITY.md)"
          gh release view video > /dev/null 2>&1 || gh release create video --title "Full-history videos (4K)" --notes "$NOTES"
          bash tools/video/replace-asset.sh video "$RUNNER_TEMP/vetted/$VIDEO" "$RUNNER_TEMP/vetted/$VIDEO_LTHSTH" "$RUNNER_TEMP/vetted/$VIDEO_RAW"
          # Retried: notes left behind would name the old files' SHA-256.
          for k in 1 2 3 4 5; do gh release edit video --notes "$NOTES" && break; [ "$k" = 5 ] && exit 1; sleep $((k * 5)); done

  youtube-age:
    # Posts the AGE video to YouTube, unlisted: anyone with the link can watch it (the site's video button links it),
    # but it is shown neither on the channel nor in search. Its title is the chart's own title on its last day, which
    # names its look. The channel's OAuth credentials are three repository secrets (see README), seen only by the two
    # steps that use them. Without them the job does nothing, so the videos are published the same before YouTube is
    # set up. A job of its own, as are the <150D/>150D and RAW ones: one video's trouble does not keep the others off
    # YouTube, and a failed post can be run again (Re-run failed jobs) without posting the others twice.
    needs: [update, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      id: ${{ steps.post.outputs.id }}
      privacy: ${{ steps.post.outputs.privacy }}
    steps:
      - name: Look for the YouTube credentials
        id: creds
        env:
          ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -n "$ID" ] && [ -n "$SECRET" ] && [ -n "$REFRESH" ]; then echo "found=yes" >> "$GITHUB_OUTPUT"
          else echo "No YouTube credentials in this repository's secrets (see README): not posting."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.found == 'yes'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.creds.outputs.found == 'yes'
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.creds.outputs.found == 'yes'
        with:
          name: video-vetted-age
          path: ${{ runner.temp }}/vetted

      - name: Post the AGE video to YouTube
        id: post
        if: steps.creds.outputs.found == 'yes'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          START: ${{ needs.update.outputs.start }}
          END: ${{ needs.update.outputs.end }}
        run: node tools/video/youtube.mjs "$RUNNER_TEMP/vetted/$VIDEO" "$START" "$END" age >> "$GITHUB_OUTPUT"

  youtube-lthsth:
    # Posts the <150D/>150D video to YouTube, as youtube-age posts the AGE one (see there), under the title the chart
    # has in that view, with <150D/>150D written Under/Over 150D: YouTube takes no < or > in a title.
    needs: [update, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      id: ${{ steps.post.outputs.id }}
      privacy: ${{ steps.post.outputs.privacy }}
    steps:
      - name: Look for the YouTube credentials
        id: creds
        env:
          ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -n "$ID" ] && [ -n "$SECRET" ] && [ -n "$REFRESH" ]; then echo "found=yes" >> "$GITHUB_OUTPUT"
          else echo "No YouTube credentials in this repository's secrets (see README): not posting."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.found == 'yes'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.creds.outputs.found == 'yes'
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.creds.outputs.found == 'yes'
        with:
          name: video-vetted-lthsth
          path: ${{ runner.temp }}/vetted

      - name: Post the <150D/>150D video to YouTube
        id: post
        if: steps.creds.outputs.found == 'yes'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          START: ${{ needs.update.outputs.start }}
          END: ${{ needs.update.outputs.end }}
        run: node tools/video/youtube.mjs "$RUNNER_TEMP/vetted/$VIDEO_LTHSTH" "$START" "$END" lthsth >> "$GITHUB_OUTPUT"

  youtube-raw:
    # Posts the RAW video to YouTube, as youtube-age posts the AGE one (see there), under the title the chart has in
    # that view.
    needs: [update, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      id: ${{ steps.post.outputs.id }}
      privacy: ${{ steps.post.outputs.privacy }}
    steps:
      - name: Look for the YouTube credentials
        id: creds
        env:
          ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -n "$ID" ] && [ -n "$SECRET" ] && [ -n "$REFRESH" ]; then echo "found=yes" >> "$GITHUB_OUTPUT"
          else echo "No YouTube credentials in this repository's secrets (see README): not posting."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.found == 'yes'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.creds.outputs.found == 'yes'
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.creds.outputs.found == 'yes'
        with:
          name: video-vetted-raw
          path: ${{ runner.temp }}/vetted

      - name: Post the RAW video to YouTube
        id: post
        if: steps.creds.outputs.found == 'yes'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          START: ${{ needs.update.outputs.start }}
          END: ${{ needs.update.outputs.end }}
        run: node tools/video/youtube.mjs "$RUNNER_TEMP/vetted/$VIDEO_RAW" "$START" "$END" raw >> "$GITHUB_OUTPUT"

  record:
    # Names the new videos in data/youtube.json for the site's three video buttons. A video that others cannot watch
    # yet (a private upload, or none because its post failed) is not recorded: its button keeps the last one they
    # could, or opens the channel. Runs when any post was viewable, also when the others failed.
    needs: [update, youtube-age, youtube-lthsth, youtube-raw]
    if: >-
      ${{ !cancelled() && (
        needs.youtube-age.outputs.privacy == 'unlisted' || needs.youtube-age.outputs.privacy == 'public' ||
        needs.youtube-lthsth.outputs.privacy == 'unlisted' || needs.youtube-lthsth.outputs.privacy == 'public' ||
        needs.youtube-raw.outputs.privacy == 'unlisted' || needs.youtube-raw.outputs.privacy == 'public') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the commit
    steps:
      # The latest main, not the commit this run started from: data/youtube.json may have changed since (a merge
      # during the render), and the file written here starts from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Record the latest videos
        env:
          AGE_ID: ${{ needs.youtube-age.outputs.id }}
          AGE_PRIVACY: ${{ needs.youtube-age.outputs.privacy }}
          LTHSTH_ID: ${{ needs.youtube-lthsth.outputs.id }}
          LTHSTH_PRIVACY: ${{ needs.youtube-lthsth.outputs.privacy }}
          RAW_ID: ${{ needs.youtube-raw.outputs.id }}
          RAW_PRIVACY: ${{ needs.youtube-raw.outputs.privacy }}
          END: ${{ needs.update.outputs.end }}
        run: |
          [[ "$END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "end: '$END'" >&2; exit 1; }
          # Each video: today's upload if others can watch it, else whatever was recorded for it before. ("end" is
          # quoted in jq, where a bare end is a keyword.)
          viewable() { [[ ( "$2" = unlisted || "$2" = public ) && "$1" =~ ^[A-Za-z0-9_-]{11}$ ]]; }
          if viewable "$AGE_ID" "$AGE_PRIVACY"; then AGE=$(jq -n --arg id "$AGE_ID" --arg day "$END" '{id: $id, "end": $day}')
          else AGE=$(jq '.age // null' data/youtube.json); fi
          if viewable "$LTHSTH_ID" "$LTHSTH_PRIVACY"; then LTHSTH=$(jq -n --arg id "$LTHSTH_ID" --arg day "$END" '{id: $id, "end": $day}')
          else LTHSTH=$(jq '.lthsth // null' data/youtube.json); fi
          if viewable "$RAW_ID" "$RAW_PRIVACY"; then RAW=$(jq -n --arg id "$RAW_ID" --arg day "$END" '{id: $id, "end": $day}')
          else RAW=$(jq '.raw // null' data/youtube.json); fi
          ABOUT="The latest videos on YouTube for the site's three video buttons: age, the bars coloured by age band, lthsth, split at 150 days (<150D/>150D), and raw, unsmoothed in black on a light chart. Written by .github/workflows/video.yml once an upload is viewable (unlisted or public); null until then."
          jq -n --arg about "$ABOUT" --argjson age "$AGE" --argjson lthsth "$LTHSTH" --argjson raw "$RAW" '{about: $about, age: $age, lthsth: $lthsth, raw: $raw}' > "$RUNNER_TEMP/youtube.json"
          mv "$RUNNER_TEMP/youtube.json" data/youtube.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          if git diff --cached --quiet; then echo "Already recorded."; exit 0; fi
          git commit -m "Latest videos on YouTube, through $END"
          git pull --rebase --quiet
          git push   # Pages rebuilds the site from this push by itself
