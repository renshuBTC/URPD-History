  record:
    # Names the new videos in data/youtube.json for the site's four video buttons. A video that others cannot watch yet
    # (a private upload, or none because its post failed) is not recorded: its button keeps the last one they could, or
    # opens the channel. Runs when any post was viewable, also when others failed.
    needs: [update, youtube-usd-age, youtube-btc-age, youtube-usd-lthsth, youtube-btc-lthsth]
    if: >-
      ${{ !cancelled() && (
        needs.youtube-usd-age.outputs.privacy == 'unlisted' || needs.youtube-usd-age.outputs.privacy == 'public' ||
        needs.youtube-btc-age.outputs.privacy == 'unlisted' || needs.youtube-btc-age.outputs.privacy == 'public' ||
        needs.youtube-usd-lthsth.outputs.privacy == 'unlisted' || needs.youtube-usd-lthsth.outputs.privacy == 'public' ||
        needs.youtube-btc-lthsth.outputs.privacy == 'unlisted' || needs.youtube-btc-lthsth.outputs.privacy == 'public') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the commit
    steps:
      # The latest main, not the commit this run started from: data/youtube.json may have changed since (a merge
      # during the render), and the file written here starts from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Record the latest videos
        env:
          USD_AGE_ID: ${{ needs.youtube-usd-age.outputs.id }}
          USD_AGE_PRIVACY: ${{ needs.youtube-usd-age.outputs.privacy }}
          BTC_AGE_ID: ${{ needs.youtube-btc-age.outputs.id }}
          BTC_AGE_PRIVACY: ${{ needs.youtube-btc-age.outputs.privacy }}
          USD_LTHSTH_ID: ${{ needs.youtube-usd-lthsth.outputs.id }}
          USD_LTHSTH_PRIVACY: ${{ needs.youtube-usd-lthsth.outputs.privacy }}
          BTC_LTHSTH_ID: ${{ needs.youtube-btc-lthsth.outputs.id }}
          BTC_LTHSTH_PRIVACY: ${{ needs.youtube-btc-lthsth.outputs.privacy }}
          END: ${{ needs.update.outputs.end }}
        run: |
          [[ "$END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "end: '$END'" >&2; exit 1; }
          # Each video: today's upload if others can watch it, else whatever was recorded for it before. ("end" is
          # quoted in jq, where a bare end is a keyword.)
          viewable() { [[ ( "$2" = unlisted || "$2" = public ) && "$1" =~ ^[A-Za-z0-9_-]{11}$ ]]; }
          entry() {   # entry KEY ID PRIVACY
            if viewable "$2" "$3"; then jq -n --arg id "$2" --arg day "$END" '{id: $id, "end": $day}'
            else jq --arg k "$1" '.[$k] // null' data/youtube.json; fi
          }
          UA=$(entry usd-age "$USD_AGE_ID" "$USD_AGE_PRIVACY")
          BA=$(entry btc-age "$BTC_AGE_ID" "$BTC_AGE_PRIVACY")
          UL=$(entry usd-lthsth "$USD_LTHSTH_ID" "$USD_LTHSTH_PRIVACY")
          BL=$(entry btc-lthsth "$BTC_LTHSTH_ID" "$BTC_LTHSTH_PRIVACY")
          ABOUT="The latest videos on YouTube for the site's four video buttons, one for each weighting and colouring: usd-age and btc-age, the bars in dollars and in coins stacked in age bands (VIDEO (USD-AGE), VIDEO (BTC-AGE)), and usd-lthsth and btc-lthsth, split into short- and long-term holders (VIDEO (USD-LTH/STH), VIDEO (BTC-LTH/STH)). Written by .github/workflows/video.yml once an upload is viewable (unlisted or public); null until then."
          jq -n --arg about "$ABOUT" --argjson ua "$UA" --argjson ba "$BA" --argjson ul "$UL" --argjson bl "$BL" \
            '{about: $about, "usd-age": $ua, "btc-age": $ba, "usd-lthsth": $ul, "btc-lthsth": $bl}' > "$RUNNER_TEMP/youtube.json"
          mv "$RUNNER_TEMP/youtube.json" data/youtube.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          if git diff --cached --quiet; then echo "Already recorded."; exit 0; fi
          git commit -m "Latest videos on YouTube, through $END"
          git pull --rebase --quiet
          git push   # Pages rebuilds the site from this push by itself
