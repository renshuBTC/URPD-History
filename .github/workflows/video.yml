name: Weekly videos

# Once a week, four videos of the whole history for YouTube, one for each weighting and colouring the site draws, as it
# draws it by default (tools/video/looks.mjs): the bars in dollars (USD) with the left axis at each day's tallest bar,
# and in coins (BTC) with it at the 99.8th percentile of each day's bars, each stacked in the 23 age bands (AGE) and
# split into short- and long-term holders (LTH/STH).
# The workflow runs every day all the same, because its first job also keeps the site's axis history current:
#   1. update:  adds the day that just ended to the axis history (data/scales.json, committed to main) and to the
#               videos' store (the files on the "video-store-2" release), and decides whether new videos are due: once
#               the store reaches seven days past the published ones, or on a run started by hand
#   2. render:  draws each 4K video with tools/video, each on a runner of its own
#   3. vet:     accepts each file only if it is exactly the expected video, and rewrites its container keeping only
#               the picture
#   4. publish: attests where the videos were built and keeps them on the "video" release, whose notes tell the next
#               run which day they reach (the site does not link to them)
#   5. youtube-usd-age, youtube-btc-age, youtube-usd-lthsth, youtube-btc-lthsth: post each to YouTube, unlisted
#               (tools/video/youtube.mjs), once the channel's credentials are set up, each from a job of its own
#   6. record:  names them in data/youtube.json for the site's four video buttons, once YouTube lets others watch them
#
# A run started by hand draws all four at once, or with "only" just one of them, outside the weekly cycle: that one is
# vetted, attested, posted and named for its button as usual, but the release and its notes (which set the week) are
# left as they are, and the next weekly run draws both together again.
#
# The jobs are split by trust. Only this repository's own code runs with a token that can write (update, publish,
# record), and none of them ever parses a video. The YouTube credentials are seen only by the two steps of each
# youtube job that need them, which run this repository's own code and nothing installed. The renderer runs
# third-party code (Playwright, Chromium, ffmpeg and their npm packages), and the vet job parses the rendered files with
# ffmpeg, so both get only a read-only token and no credentials. Each hands its file on as a workflow artifact, and
# the jobs after vet take the vetted files by their exact names only (any other artifact of the run, which the render
# job could have made, is never read). The publish job signs a build attestation for the vetted files, which anyone
# can check with `gh attestation verify` (see SECURITY.md). New release files replace the old ones only once fully
# uploaded (tools/video/replace-asset.sh), so the release never holds half a file. Actions are pinned to full commit
# hashes. Standard GitHub-hosted runners are free for public repositories; a run that draws the videos takes about two
# hours (each video on a runner of its own), any other a minute.
on:
  schedule:
    # 01:23 UTC, well after yesterday closed and off the top of the hour, when GitHub delays or drops the most
    # scheduled runs (it can still start them hours late); on the day new videos are due they are out about two hours
    # after the run starts. The second run only catches up if the first did not happen or found no new
    # day, and otherwise stops after a minute.
    - cron: "23 1 * * *"
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Draw and post all four videos, or only one of them now, outside the weekly cycle (the release and its week stay as they are)"
        type: choice
        options: [all, usd-age, btc-age, usd-lthsth, btc-lthsth]
        default: all

permissions: {}   # each job asks for exactly what it needs

# One run on main at a time, the next waiting for it. A run started by hand on another branch does nothing (every job
# is main-only) and gets a group of its own, so it can never take the place of a waiting run on main.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'daily-video' || format('video-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  # The videos' file names on the release, each naming its weighting. Each ends in .mp4: a file ending in .com is a
  # program on Windows. The update job hands the render and vet jobs the ones a run draws, as their matrix. (The videos
  # drawn before them, BitcoinSupplyChart.com-*.mp4, stay on the release under their own names: nothing here replaces
  # them.)
  VIDEO_USD_AGE: BitcoinURPD.com-USD-AGE.mp4
  VIDEO_BTC_AGE: BitcoinURPD.com-BTC-AGE.mp4
  VIDEO_USD_LTHSTH: BitcoinURPD.com-USD-LTH-STH.mp4
  VIDEO_BTC_LTHSTH: BitcoinURPD.com-BTC-LTH-STH.mp4

jobs:
  update:
    # Only on main: a run started by hand on another branch would commit there and publish a video that the site
    # check (which wants main) then flags as not genuine.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # the axis-history commit and the release files
    outputs:
      render: ${{ steps.store.outputs.render }}
      start: ${{ steps.store.outputs.start }}           # the BTC videos' first day
      start_usd: ${{ steps.store.outputs.start_usd }}   # the USD videos'
      end: ${{ steps.store.outputs.end }}
      only: ${{ steps.store.outputs.only }}         # all, or the one look a run by hand draws
      looks: ${{ steps.store.outputs.looks }}       # the looks this run draws, as a JSON list
      include: ${{ steps.store.outputs.include }}   # the render and vet jobs' matrix: each look and its file name
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Add the finished days to the axis history
        run: node tools/build-scales.cjs --cache "$RUNNER_TEMP/raw" --seconds 1800

      - name: Test the site
        run: node --test tests/*.test.cjs

      - name: Commit the axis history
        run: |
          if git diff --quiet -- data/scales.json; then echo "No new days."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scales.json
          git commit -m "Axis history through $(node -p "require('./data/scales.json').end")"
          git pull --rebase --quiet
          git push   # Pages rebuilds the site from this push by itself

      - name: Add the finished days to the video's store
        id: store
        env:
          ONLY: ${{ inputs.only }}   # empty on a scheduled run: both
        run: |
          mkdir -p "$RUNNER_TEMP/store"
          # An empty release (the store lost) is a store to rebuild, not an error, though gh refuses to download
          # nothing; a missing release still stops the run.
          gh release download video-store-2 --dir "$RUNNER_TEMP/store" || [ "$(gh release view video-store-2 --json assets --jq '.assets | length')" = 0 ]
          # A run stopped between the two halves of a swap (replace-asset.sh) can leave a file only under its
          # temporary name. Take it back under its real name rather than stall every run after it; a year file that
          # has run ahead of meta.json is read only as far as meta.json goes (store.mjs).
          for part in "$RUNNER_TEMP"/store/*.part.*; do
            [ -e "$part" ] || continue
            final="${part/.part./.}"
            if [ -e "$final" ]; then rm -f "$part"; else mv "$part" "$final"; fi
          done
          # --seconds: a lost store rebuilds over several runs, keeping what each one adds.
          node tools/video/store.mjs "$RUNNER_TEMP/store" --cache "$RUNNER_TEMP/raw" --seconds 1500 > "$RUNNER_TEMP/changed.txt"
          # The year files first and meta.json last (store.mjs lists them in that order), so a run stopped part way
          # leaves a store the next run can still read.
          mapfile -t CHANGED < "$RUNNER_TEMP/changed.txt"
          [ "${#CHANGED[@]}" = 0 ] || bash tools/video/replace-asset.sh video-store-2 "${CHANGED[@]}"
          END=$(node -p "require(process.env.RUNNER_TEMP + '/store/meta.json').days.at(-1)[0]")
          echo "end=$END" >> "$GITHUB_OUTPUT"
          # Each video's first day (tools/video/store.mjs startIndex): in coins (BTC) the first with anything on
          # the chart, in dollars (USD) the first with a realized cap above zero.
          STARTS=$(node --input-type=module -e "import { readStore, startIndex } from './tools/video/store.mjs';
            const s = readStore(process.env.RUNNER_TEMP + '/store'); console.log(s.meta.days[startIndex(s, 'btc')][0], s.meta.days[startIndex(s, 'usd')][0]);")
          read -r START START_USD <<< "$STARTS"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "start_usd=$START_USD" >> "$GITHUB_OUTPUT"
          # The published videos' last day: the last date in their release notes (see publish), none before the first
          # videos. Only a 404, no such release, means none: any other failure to read them, after a few tries, stops
          # the run rather than pass for "no videos yet" and draw new ones at once. (gh release view is not asked: it
          # reports some failed lookups as "release not found".)
          SHOWN=""
          for k in 1 2 3 4 5; do
            if NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/video" --jq .body 2> "$RUNNER_TEMP/notes.err"); then
              SHOWN=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' <<< "$NOTES" | tail -n 1 || true); break
            fi
            if grep -q 'HTTP 404' "$RUNNER_TEMP/notes.err"; then break; fi
            [ "$k" = 5 ] && { cat "$RUNNER_TEMP/notes.err" >&2; exit 1; }
            sleep $((k * 5))
          done
          # New videos once a week: when the store reaches seven days past the published ones. With none published,
          # once the store has every day the axis history has: a lost store is rebuilt over several runs, and a short
          # video must not go out meanwhile. While it is rebuilt it stays behind the published videos, and shorter
          # videos must not replace the full ones. A run started by hand draws new videos whenever the store is not
          # behind.
          SCALES_END=$(node -p "require('./data/scales.json').end")
          DUE=$([ -n "$SHOWN" ] && date -u -d "$SHOWN + 7 days" +%F || true)
          if [ -z "$SHOWN" ] && [ "$END" != "$SCALES_END" ]; then
            echo "No videos are published yet, and the store runs to $END of $SCALES_END: it catches up first."
          elif [ -z "$SHOWN" ] || [[ ! "$END" < "$DUE" ]] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [[ ! "$END" < "$SHOWN" ]]; }; then
            echo "render=yes" >> "$GITHUB_OUTPUT"
          elif [[ "$END" < "$SHOWN" ]]; then
            echo "The store runs to $END, behind the published videos ($SHOWN): it keeps catching up."
          else
            echo "The published videos run to $SHOWN; the next are drawn once the store reaches $DUE."
          fi
          # Which videos: all four, or on a run by hand the one asked for, with their file names (env above).
          case "${ONLY:-all}" in
            all) LOOKS='["usd-age","btc-age","usd-lthsth","btc-lthsth"]' ;;
            usd-age|btc-age|usd-lthsth|btc-lthsth) LOOKS="[\"$ONLY\"]" ;;
            *) echo "only: '$ONLY'" >&2; exit 1 ;;
          esac
          {
            echo "only=${ONLY:-all}"
            echo "looks=$LOOKS"
            echo "include=$(jq -c --arg ua "$VIDEO_USD_AGE" --arg ba "$VIDEO_BTC_AGE" --arg ul "$VIDEO_USD_LTHSTH" --arg bl "$VIDEO_BTC_LTHSTH" \
              'map({look: ., file: {"usd-age": $ua, "btc-age": $ba, "usd-lthsth": $ul, "btc-lthsth": $bl}[.]})' <<< "$LOOKS")"
          } >> "$GITHUB_OUTPUT"

      - name: Hand the store to the renderer
        if: steps.store.outputs.render == 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store
          path: ${{ runner.temp }}/store
          if-no-files-found: error
          retention-days: 1
          compression-level: 0   # already gzipped

  render:
    needs: update
    if: needs.update.outputs.render == 'yes'
    # A fixed image, not ubuntu-latest: Playwright installs Chromium's system packages by the release's name, and
    # ffmpeg's output is checked exactly, so moving to a new Ubuntu is done on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # One runner for each video the run draws: its look (tools/video/looks.mjs) and its file name (VIDEO_USD_AGE and so on),
    # from the update job. One that fails does not cancel the others, so Re-run failed jobs draws only the
    # failed one again.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.update.outputs.include) }}
    env:
      LOOK: ${{ matrix.look }}
      FILE: ${{ matrix.file }}
    permissions:
      contents: read    # nothing else: this job runs third-party code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: store
          path: ${{ runner.temp }}/store

      - name: Install the renderer
        working-directory: tools/video
        run: |
          # Exactly the versions in package-lock.json, checked against its hashes, and no install scripts run.
          npm ci --ignore-scripts
          node_modules/.bin/playwright install --with-deps chromium
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }

      - name: Render the video
        run: node tools/video/render.mjs "$RUNNER_TEMP/store" "$RUNNER_TEMP/$FILE"

      - name: Check the video
        run: bash tools/video/check-video.sh "$RUNNER_TEMP/$FILE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: video-${{ matrix.look }}
          path: ${{ runner.temp }}/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0   # already compressed

  vet:
    needs: [update, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.update.outputs.include) }}
    env:
      FILE: ${{ matrix.file }}
    permissions:
      contents: read    # nothing else: this job parses a file that third-party code produced
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: video-${{ matrix.look }}
          path: ${{ runner.temp }}/rendered

      - name: Accept only the expected video, rewritten by Ubuntu's ffmpeg
        run: |
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          bash tools/video/check-video.sh "$RUNNER_TEMP/rendered/$FILE"
          # A fresh container holding only the picture: no metadata, chapters or other boxes, and of the H.264 stream
          # only the units a picture needs (slices 1-5, SPS, PPS and delimiters 7-9), so no SEI or filler, where
          # free-form data could ride along. Then every frame is decoded.
          mkdir -p "$RUNNER_TEMP/vetted"
          ffmpeg -nostdin -v error -i "$RUNNER_TEMP/rendered/$FILE" -map 0:v:0 -c copy -bsf:v 'filter_units=pass_types=1-5|7-9' \
            -map_metadata -1 -map_chapters -1 -movflags +faststart -f mp4 "$RUNNER_TEMP/vetted/$FILE"
          bash tools/video/check-video.sh "$RUNNER_TEMP/vetted/$FILE" --decode

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: video-vetted-${{ matrix.look }}
          path: ${{ runner.temp }}/vetted/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7   # a week, so a failed publish or post can be run again
          compression-level: 0

  publish:
    needs: [update, vet]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write           # the video release
      id-token: write           # signing the build attestation (Sigstore)
      attestations: write       # storing it
      artifact-metadata: write  # its storage record
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each vetted video the run drew, by its exact name. A pattern would also take in any other artifact of this run
      # whose name matched, and one made by the render job (third-party code) could then have replaced a vetted file.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: contains(fromJSON(needs.update.outputs.looks), 'usd-age')
        with:
          name: video-vetted-usd-age
          path: ${{ runner.temp }}/vetted
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: contains(fromJSON(needs.update.outputs.looks), 'btc-age')
        with:
          name: video-vetted-btc-age
          path: ${{ runner.temp }}/vetted
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: contains(fromJSON(needs.update.outputs.looks), 'usd-lthsth')
        with:
          name: video-vetted-usd-lthsth
          path: ${{ runner.temp }}/vetted
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: contains(fromJSON(needs.update.outputs.looks), 'btc-lthsth')
        with:
          name: video-vetted-btc-lthsth
          path: ${{ runner.temp }}/vetted

      - name: Look at the files without parsing them
        env:
          INCLUDE: ${{ needs.update.outputs.include }}
        run: |
          # The vet job did the real checks. Here only the bytes are looked at, never decoded: each video the run drew
          # begins with an MP4's ftyp box and is under GitHub's 2 GiB limit for a release file, and nothing else came
          # with them.
          mapfile -t FILES < <(jq -r '.[].file' <<< "$INCLUDE")
          [ "${#FILES[@]}" -ge 1 ] || { echo "no videos: '$INCLUDE'" >&2; exit 1; }
          for name in "${FILES[@]}"; do
            f="$RUNNER_TEMP/vetted/$name"
            [ "$(head -c 8 "$f" | tail -c 4)" = ftyp ] || { echo "$f: not an MP4" >&2; exit 1; }
            size=$(stat -c %s "$f"); [ "$size" -gt 18000000 ] && [ "$size" -lt 2000000000 ] || { echo "$f: $size bytes" >&2; exit 1; }
          done
          [ "$(find "$RUNNER_TEMP/vetted" -type f | wc -l)" = "${#FILES[@]}" ] || { find "$RUNNER_TEMP/vetted" >&2; exit 1; }

      # Every video the run drew, and only those: the step above found exactly them in the folder.
      - name: Attest where the videos were built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/vetted/*.mp4

      # The release holds the four videos of one week together, and its notes set the next week's date: a run by hand
      # for one video leaves them all as they are (its video is attested above and posted to YouTube below).
      - name: Publish the videos
        if: needs.update.outputs.only == 'all'
        env:
          START: ${{ needs.update.outputs.start }}
          START_USD: ${{ needs.update.outputs.start_usd }}
          END: ${{ needs.update.outputs.end }}
        run: |
          for d in "$START" "$START_USD" "$END"; do [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "day: '$d'" >&2; exit 1; }; done
          sha() { sha256sum "$RUNNER_TEMP/vetted/$1" | cut -d' ' -f1; }
          # The last date in these notes is how the next run knows which day the published videos reach: none may
          # follow $END.
          NOTES="Four videos, one for each of the site's weightings and colourings, as the site draws it by default: $VIDEO_USD_AGE and $VIDEO_USD_LTHSTH (the bars in dollars, the left axis at each day's tallest bar), every day from $START_USD (the first with a realized cap above zero), and $VIDEO_BTC_AGE and $VIDEO_BTC_LTHSTH (the bars in coins, the left axis at the 99.8th percentile of each day's bars, the first bar running off the top with its height printed there), every day from $START (the first with anything on the chart), the -AGE ones stacked in 23 age bands and the -LTH-STH ones split into short- and long-term holders at 150 days, all four to $END. 5 minutes at 60 fps, 3840x2160, H.264. Drawn again once a week by the Weekly videos workflow, which posts them to YouTube; the site does not link to these files. The videos drawn before them (BitcoinSupplyChart.com-*.mp4) are kept here as they were.

          SHA-256 of $VIDEO_USD_AGE: $(sha "$VIDEO_USD_AGE")
          SHA-256 of $VIDEO_BTC_AGE: $(sha "$VIDEO_BTC_AGE")
          SHA-256 of $VIDEO_USD_LTHSTH: $(sha "$VIDEO_USD_LTHSTH")
          SHA-256 of $VIDEO_BTC_LTHSTH: $(sha "$VIDEO_BTC_LTHSTH")
          Check any file here: gh attestation verify FILE --repo $GITHUB_REPOSITORY (see SECURITY.md)"
          gh release view video > /dev/null 2>&1 || gh release create video --title "Full-history videos (4K)" --notes "$NOTES"
          bash tools/video/replace-asset.sh video "$RUNNER_TEMP/vetted/$VIDEO_USD_AGE" "$RUNNER_TEMP/vetted/$VIDEO_BTC_AGE" \
            "$RUNNER_TEMP/vetted/$VIDEO_USD_LTHSTH" "$RUNNER_TEMP/vetted/$VIDEO_BTC_LTHSTH"
          # Retried: notes left behind would name the old files' SHA-256.
          for k in 1 2 3 4 5; do gh release edit video --notes "$NOTES" && break; [ "$k" = 5 ] && exit 1; sleep $((k * 5)); done

  youtube-usd-age:
    # Posts the USD-AGE video (the bars in dollars, in age bands) to YouTube, unlisted: anyone with the link can watch it (the site's video button links it),
    # but it is shown neither on the channel nor in search. Its title is the chart's own title on its last day, which
    # names its weighting and colouring. The channel's OAuth credentials are three repository secrets (see README), seen
    # only by the two steps that use them. Without them the job does nothing, so the videos are published the same
    # before YouTube is set up. A job of its own, as is each of the others: one video's trouble does not keep the others
    # off YouTube, and a failed post can be run again (Re-run failed jobs) without posting the others twice. Only when
    # the run drew this video.
    needs: [update, publish]
    if: contains(fromJSON(needs.update.outputs.looks), 'usd-age')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      id: ${{ steps.post.outputs.id }}
      privacy: ${{ steps.post.outputs.privacy }}
    steps:
      - name: Look for the YouTube credentials
        id: creds
        env:
          ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -n "$ID" ] && [ -n "$SECRET" ] && [ -n "$REFRESH" ]; then echo "found=yes" >> "$GITHUB_OUTPUT"
          else echo "No YouTube credentials in this repository's secrets (see README): not posting."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.found == 'yes'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.creds.outputs.found == 'yes'
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.creds.outputs.found == 'yes'
        with:
          name: video-vetted-usd-age
          path: ${{ runner.temp }}/vetted

      - name: Post the USD-AGE video to YouTube
        id: post
        if: steps.creds.outputs.found == 'yes'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          START: ${{ needs.update.outputs.start_usd }}
          END: ${{ needs.update.outputs.end }}
