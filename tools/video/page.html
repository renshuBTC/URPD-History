<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Source Code Pro'; font-weight: 400; src: url('FONT400') format('woff2'); }
  @font-face { font-family: 'Source Code Pro'; font-weight: 700; src: url('FONT700') format('woff2'); }
  html, body { margin: 0; padding: 0; background: #0a0a0a; overflow: hidden; }
  #chart { width: 1920px; height: 1080px; }
</style>
<script src="PLOTLY"></script>
</head><body><div id="chart"></div>
<script>
// The site's chart (index.html drawChart, USD view) for one frame of the video. Axes, labels, landmarks, colours and
// the title follow the site and come from render.mjs, with the bars coloured by age band (AGE) or split at 150 days
// (<150D/>150D): looks.mjs. Text for Plotly is escaped (esc), since Plotly reads <...> as markup. The one deliberate
// difference: each layer (an age band, or one side of 150 days) is one filled outline of all 626 bars, painted back to
// front, instead of up to 14,000 separate rectangles (the same picture, much faster), with the bar edges on whole
// device pixels.
var FONT = "'Source Code Pro', Consolas, monospace";
var GRID_COLOR = "#272727", WATERMARK_COLOR = "#1a1a1a";   // the site's (index.html, "Grid and watermark")
var PROFIT = "#00e676", LOSS = "#ff1744", PRICE_LINE = "#ffffff";
// The chart's colours, the site's own (index.html, CHART_THEMES): dark for AGE and <150D/>150D, light for RAW, whose
// bars are black, so the price line and the dashed line there get a white casing to show over them.
var THEMES = {
  dark: { bg: "#0a0a0a", ink: "#ffffff", grid: GRID_COLOR, watermark: WATERMARK_COLOR, credit: "rgba(255,255,255,0.55)",
    line: PRICE_LINE, casing: "rgba(10,10,10,0.8)", dash: "#ffffff", dashCasing: null, boxBg: "rgba(0,0,0,0.92)",
    boxBorder: "rgba(255,255,255,0.45)", labelBg: "rgba(10,10,10,0.75)", profit: PROFIT, loss: LOSS },
  light: { bg: "#ffffff", ink: "#000000", grid: "#dfdfdf", watermark: "#f0f0f0", credit: "rgba(0,0,0,0.55)",
    line: "#000000", casing: "rgba(255,255,255,0.9)", dash: "#000000", dashCasing: "rgba(255,255,255,0.9)", boxBg: "rgba(255,255,255,0.92)",
    boxBorder: "rgba(0,0,0,0.45)", labelBg: "rgba(255,255,255,0.8)", profit: "#00873c", loss: "#e0002b" }
};
function themeOf(sp) { return THEMES[sp.theme] || THEMES.dark; }
var TOP_MARGIN = null, ML = 88, MR = 24, PLOT_W = 1920 - ML - MR, BAR_EDGES = null;
// bar edges as fractions of the x-axis, snapped to device pixels, 2 px gap; computed from the real plot width
function barEdges(plotW) { var dpr = window.devicePixelRatio || 1, len = plotW * dpr, n = 626, e = [], out = [];
  for (var j = 0; j <= n; j++) e.push(Math.round(j * len / n));
  for (var k = 0; k < n; k++) { var gap = e[k + 1] - e[k] >= 4 ? 2 : 0; out.push([e[k] / len, (e[k + 1] - gap) / len]); }
  return out; }
BAR_EDGES = barEdges(PLOT_W);

function compactNumber(v) {
  var a = Math.abs(v), u = a >= 1e12 ? [1e12, "T"] : a >= 1e9 ? [1e9, "B"] : a >= 1e6 ? [1e6, "M"] : a >= 1e3 ? [1e3, "K"] : [1, ""];
  var s = v / u[0], t = Math.abs(s) >= 100 ? String(Math.round(s)) : s.toPrecision(3);
  if (t.indexOf(".") >= 0) t = t.replace(/0+$/, "").replace(/\.$/, "");
  return t + u[1];
}
function yLabel(v) { return v === 0 ? "$0" : "$" + compactNumber(v); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
// The price box and the day's dot for a frame: the box's text and where it sits, beside the dashed line (on its left
// where it would run past the plot's right edge), and the dot on the price line; plot fractions across, pixels down
// from the plot's top. drawFrame draws them, and boxNeeds tells render.mjs where the dot runs under the box.
var DOT_R = 9;
function priceBox(sp) {
  if (!(sp.spot > 0)) return null;
  var xSpan = sp.nb * sp.w, loss = sp.redPct, profit = loss === null ? null : 100 - loss, TH = themeOf(sp);
  var txt = "Price: $" + sp.spot.toLocaleString("en-US", { maximumFractionDigits: sp.spot < 10 ? 2 : 0 }) +
    "<br><span style='color:" + TH.profit + "'>USD Value Last Moved In Profit: " + (profit === null ? "N/A" : profit.toFixed(1) + "%") + "</span>" +
    "<br><span style='color:" + TH.loss + "'>USD Value Last Moved In Loss: " + (loss === null ? "N/A" : loss.toFixed(1) + "%") + "</span>";
  var chars = txt.split("<br>").reduce(function(m, s) { return Math.max(m, s.replace(/<[^>]+>/g, "").length); }, 0);
  var boxF = (chars * 7.9 + 24) / PLOT_W, flip = sp.spot / xSpan + boxF > 0.99, boxAt = sp.spot / xSpan + (flip ? -6 : 6) / PLOT_W;
  var wl = Date.parse(sp.win[0].replace(" ", "T") + "Z"), wr = Date.parse(sp.win[1].replace(" ", "T") + "Z"), top3 = sp.pr ? sp.pr[1] : 0;
  var plotH = 1080 - (TOP_MARGIN === null ? 68 : TOP_MARGIN) - 44;
  var dot = top3 > 0 ? { f: (Date.parse((sp.tx || sp.date).replace(" ", "T") + (sp.tx ? "Z" : "T00:00:00Z")) - wl) / (wr - wl), y: (1 - sp.spot / top3) * plotH } : null;
  return { txt: txt, flip: flip, box: { x0: flip ? boxAt - boxF : boxAt, x1: flip ? boxAt : boxAt + boxF, y0: 0, h: txt.split("<br>").length * 17 + 12 }, dot: dot };
}
function dotUnderBox(pb) {
  var b = pb.box, d = pb.dot;
  return !!d && d.f + DOT_R / PLOT_W > b.x0 && d.f - DOT_R / PLOT_W < b.x1 && d.y - DOT_R < b.y0 + b.h && d.y + DOT_R > b.y0;
}
// For each frame (only its figures: spot, redPct, nb, w, win, tx or date, pr), how far down the price box must go for
// the dot to be clear of it, just below the dot as on the site; 0 where the dot is clear. render.mjs eases these.
window.boxNeeds = function(frames) {
  return frames.map(function(sp) { var pb = priceBox(sp); return pb && dotUnderBox(pb) ? Math.ceil(pb.dot.y + DOT_R + 4) : 0; });
};
window.drawFrame = function(sp) {
  var n = sp.nb, w = sp.w, xSpan = n * w, A = sp.cum.length, TH = themeOf(sp);
  document.body.style.background = TH.bg;
  var traces = [];
  // legend entries: bar swatches from the youngest coins to the oldest, exactly as the site lists them (RAW: none)
  for (var a = 0; a < sp.labels.length; a++) traces.push({ x: [null], y: [null], type: "bar", name: esc(sp.labels[a]), marker: { color: sp.colors[a], line: { width: 0 } }, hoverinfo: "skip" });
  // bars: one filled outline per cumulative layer (RAW: the one), oldest (top of the stack) first, each painted from zero, so
  // every layer's visible band is exactly its own share of the bar. Bar edges sit on whole device pixels with a 2 px gap
  // (1 px at 1080p), the site's "one pixel narrower than the pitch"; the grid never moves because the bars
  // always span the whole axis, so the gaps stay crisp while the axis grows.
  var xs = [], edges = BAR_EDGES;
  for (var j = 0; j < n; j++) { var x0 = edges[j][0] * xSpan, x1 = edges[j][1] * xSpan; xs.push(x0, x0, x1, x1); }
  var cum = sp.cum;                                   // cum[a] = layers 0..a added up, per bin
  for (var a2 = A - 1; a2 >= 0; a2--) {
    var ys = new Array(4 * n), c = cum[a2];
    for (var k = 0; k < n; k++) { ys[4 * k] = 0; ys[4 * k + 1] = c[k]; ys[4 * k + 2] = c[k]; ys[4 * k + 3] = 0; }
    traces.push({ x: xs, y: ys, type: "scatter", mode: "lines", line: { width: 0, color: sp.colors[a2] }, fill: "tozeroy", fillcolor: sp.colors[a2], showlegend: false, hoverinfo: "skip" });
  }
  // the watermark under the grid and the bars, as on the site
  var shapes = [{ type: "rect", xref: "paper", yref: "paper", x0: 0, x1: 1, y0: 0, y1: 1, layer: "below", line: { width: 0 }, fillcolor: "rgba(0,0,0,0)",
    label: { text: "<b>@RenshuBTC</b>", textposition: "middle center", font: { family: FONT, size: 50, color: TH.watermark } } }], ann = [
    { xref: "paper", yref: "paper", x: 0, y: 0, yanchor: "bottom", yshift: -38, text: "Powered by Bitview.space & Bitcoin Core. Credits: Antoine Le Calvez, Renato Shirakashi, James Check, @_nym21_", showarrow: false, font: { size: 11, color: TH.credit, family: FONT }, xanchor: "left" }
  ];
  ann.push({ xref: "paper", yref: "paper", x: 0, y: 0.5, xanchor: "center", yanchor: "middle", xshift: -(ML - 16), textangle: -90, showarrow: false,
    text: "Value When Last Moved [USD]", font: { family: FONT, size: 13, color: TH.ink } });
  // The price box, beside the dashed line at the day's price. Near a high the day's dot runs under it (the box is drawn
  // over the dot); the site then moves the box down to just below the dot, and here render.mjs does the same, eased
  // over a few frames and held through short gaps (sp.drop), so the box slides rather than jumps at 60 fps.
  var pb = priceBox(sp), dot = pb && pb.dot, spotBox = null;
  if (pb) {
    // A casing under the dashed line where the bars are black (RAW), so it still shows over them.
    if (TH.dashCasing) shapes.push({ type: "line", x0: sp.spot, x1: sp.spot, y0: 0, y1: 1, xref: "x", yref: "paper", line: { color: TH.dashCasing, width: 3 }, layer: "above" });
    shapes.push({ type: "line", x0: sp.spot, x1: sp.spot, y0: 0, y1: 1, xref: "x", yref: "paper", line: { color: TH.dash, width: 1, dash: "dash" }, layer: "above" });
    var drop = sp.drop > 0 ? sp.drop : 0;
    spotBox = { x0: pb.box.x0, x1: pb.box.x1, y0: drop, h: pb.box.h };
    ann.push({ x: sp.spot, y: 1, xref: "x", yref: "paper", text: pb.txt, showarrow: false, xanchor: pb.flip ? "right" : "left", xshift: pb.flip ? -6 : 6, yshift: -drop, yanchor: "top", align: "left",
      font: { color: TH.ink, size: 13, family: FONT }, bgcolor: TH.boxBg, bordercolor: TH.boxBorder, borderwidth: 1, borderpad: 5 });
  }
  var layout = {
    title: { text: "<b>" + esc(sp.title) + new Date(sp.date + "T00:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) + "</b>",
      xref: "paper", x: 0.5, xanchor: "center", y: 1, yanchor: "top", pad: { t: 13 }, font: { size: 20, family: FONT, color: TH.ink } },
    font: { family: FONT, color: TH.ink }, paper_bgcolor: TH.bg, plot_bgcolor: TH.bg, barmode: "stack", bargap: 0, showlegend: true,
    legend: { orientation: "h", yanchor: "bottom", y: 1, xanchor: "center", x: 0.5, bgcolor: "rgba(0,0,0,0)", font: { family: FONT, size: sp.legendSize, color: TH.ink }, traceorder: "normal" },
    xaxis: { title: { text: "Price When Last Moved [USD]", font: { family: FONT, size: 13, color: TH.ink }, standoff: 10 }, range: [0, xSpan], autorange: false,
      tickvals: sp.xt.v, ticktext: sp.xt.t, tickangle: 0, showgrid: true, gridcolor: TH.grid, tickfont: { family: FONT, size: 11, color: TH.ink }, zeroline: false },
    yaxis: { title: { text: "" }, automargin: false, side: "left",
      tickvals: sp.yt, ticktext: sp.ytt || sp.yt.map(yLabel), range: [0, sp.ymax], autorange: false, showgrid: true, gridcolor: TH.grid, zeroline: false, tickfont: { family: FONT, size: 11, color: TH.ink } },
    annotations: ann, shapes: shapes, margin: { l: ML, r: MR, t: TOP_MARGIN === null ? 68 : TOP_MARGIN, b: 44, autoexpand: false }, hovermode: false
  };
  // BTC/USD line over a one-year window, on its own hidden date axis, linear from $0 to the highest close so far
  traces.push({ x: sp.pd, y: sp.pp, type: "scatter", mode: "lines", xaxis: "x2", yaxis: "y3", line: { color: TH.casing, width: 4 }, showlegend: false, hoverinfo: "skip" });
  traces.push({ x: sp.pd, y: sp.pp, type: "scatter", mode: "lines", xaxis: "x2", yaxis: "y3", line: { color: TH.line, width: 1.5 }, name: "BTC/USD", showlegend: true, hoverinfo: "skip" });
  if (sp.spot && sp.spot > 0) traces.push({ x: [sp.tx || sp.date], y: [sp.spot], type: "scatter", mode: "markers", xaxis: "x2", yaxis: "y3", marker: { color: "#ff8c00", size: 9, line: { color: "rgba(255,140,0,0.7)", width: 1.5 } }, showlegend: false, hoverinfo: "skip" });
  // Landmarks as on the site: each marker on the line's own highest (lowest) close within a week of its date (found in
  // render.mjs), each label inside the plot on a dark backing, beside a top and under a bottom, taking the other side,
  // or dropping below, whenever the price box or the day's dot is in the way.
  var lms = sp.lm || [];
  if (lms.length) {
    traces.push({ x: lms.map(function(l) { return l.d; }), y: lms.map(function(l) { return l.p; }), type: "scatter", mode: "markers", xaxis: "x2", yaxis: "y3",
      marker: { color: TH.line, size: 10, symbol: lms.map(function(l) { return l.top ? "triangle-down" : "triangle-up"; }), line: { color: TH.line, width: 1 } }, cliponaxis: false, showlegend: false, hoverinfo: "skip" });
    var wl = Date.parse(sp.win[0].replace(" ", "T") + "Z"), wr = Date.parse(sp.win[1].replace(" ", "T") + "Z"), top3 = sp.pr ? sp.pr[1] : 0;
    var plotH = 1080 - (TOP_MARGIN === null ? 68 : TOP_MARGIN) - 44, blocks = [];
    if (spotBox) blocks.push({ x0: spotBox.x0, x1: spotBox.x1, y0: spotBox.y0, y1: spotBox.y0 + spotBox.h });
    if (dot) blocks.push({ x0: dot.f - 8 / PLOT_W, x1: dot.f + 8 / PLOT_W, y0: dot.y - 8, y1: dot.y + 8 });
    lms.forEach(function(l) {
      var f = (Date.parse(l.d + "T00:00:00Z") - wl) / (wr - wl), wF = (l.l.length * 6.6 + 8) / PLOT_W, gF = 8 / PLOT_W;
      var yPx = top3 > 0 ? (1 - l.p / top3) * plotH : 0, yTop = l.top ? yPx : yPx + 8;
      var span = function(a) { var x0 = a === "left" ? f + gF : a === "right" ? f - gF - wF : f - wF / 2; return [x0, x0 + wF]; };
      var inside = function(a) { var s2 = span(a); return s2[0] >= 0 && s2[1] <= 1; };
      var blockedBy = function(a, y) { var s2 = span(a); return blocks.filter(function(b) { return s2[1] > b.x0 && s2[0] < b.x1 && y < b.y1 && y + 17 > b.y0; }); };
      var order = l.top ? (f < 0.2 ? ["left", "right"] : ["right", "left"]) : ["center", "left", "right"];
      var fits = order.filter(inside); if (!fits.length) fits = [order[0]];
      var free = fits.filter(function(a) { return !blockedBy(a, yTop).length; }), side = free.length ? free[0] : fits[0], y = yTop;
      // Below whatever is in the way, and again below anything that move ran into (up to ten times, as on the site),
      // so a label that drops clear of the box does not land on the dot.
      if (!free.length) for (var hit, guard = 0; (hit = blockedBy(side, y)).length && guard < 10; guard++) hit.forEach(function(b) { y = Math.max(y, b.y1 + 4); });
      ann.unshift({ x: l.d, y: l.p, xref: "x2", yref: "y3", text: l.l, showarrow: false, xanchor: side, yanchor: "top",
        xshift: side === "left" ? 8 : side === "right" ? -8 : 0, yshift: -(y - yPx), font: { color: TH.line, size: 11, family: FONT }, bgcolor: TH.labelBg, borderpad: 2 });
    });
  }
  layout.xaxis2 = { overlaying: "x", showticklabels: false, showgrid: false, type: "date", visible: false, autorange: false, range: sp.win };
  layout.yaxis3 = { overlaying: "y", showticklabels: false, showgrid: false, type: "linear", visible: false, autorange: false, range: sp.pr || [0, 1] };
  return Plotly.react("chart", traces, layout, { staticPlot: true, displayModeBar: false }).then(function() {
    var fl = document.getElementById("chart")._fullLayout;
    return { legendH: fl.legend && fl.legend._height, plotW: fl.xaxis._length, plotH: fl.yaxis._length, top: fl.margin.t };
  });
};
window.setTopMargin = function(t) { TOP_MARGIN = t; };
window.fixBars = function() { var fl = document.getElementById("chart")._fullLayout; PLOT_W = fl.xaxis._length; BAR_EDGES = barEdges(PLOT_W);
  return { offset: fl.xaxis._offset, length: fl.xaxis._length, dpr: window.devicePixelRatio }; };
</script></body></html>
