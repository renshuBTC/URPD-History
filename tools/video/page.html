<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Source Code Pro'; font-weight: 400; src: url('FONT400') format('woff2'); }
  @font-face { font-family: 'Source Code Pro'; font-weight: 700; src: url('FONT700') format('woff2'); }
  html, body { margin: 0; padding: 0; background: #0a0a0a; overflow: hidden; }
  #chart { width: 1920px; height: 1080px; }
</style>
<script src="PLOTLY"></script>
</head><body><div id="chart"></div>
<script>
// The site's chart (index.html drawChart, USD view, age colours), drawn for one day. Differences, all
// deliberate: each cohort layer is one filled outline of all 626 bars painted back to front instead of
// 14,000 separate rectangles (same picture, much faster), bar edges on whole device pixels, axes that only
// change when the data need it (causal, selective, eased, never down), nice-number ticks, a one-day spike
// marked instead of rescaling for it, the optimised age palette, and a thin dark casing under the price line.
var FONT = "'Source Code Pro', Consolas, monospace";
var PROFIT = "#00e676", LOSS = "#ff1744", GLOW = "#FFE600", CUMUL = "#00e5ff", PRICE_LINE = "#ffffff";
var LABELS = ["<1h","1h-1d","1d-1w","1w-1m","1m-2m","2m-3m","3m-4m","4m-5m","5m-6m","6m-9m","9m-1y","1y-18m","18m-2y","2y-3y","3y-4y","4y-5y","5y-6y","6y-7y","7y-8y","8y-10y","10y-12y","12y-15y",">15y"];
var LANDMARKS = [
  {d:"2011-06-08",p:32,l:"Cycle 1 Top",top:true}, {d:"2011-11-18",p:2,l:"Cycle 1 Bottom",top:false},
  {d:"2013-11-29",p:1163,l:"Cycle 2 Top",top:true}, {d:"2015-01-14",p:152,l:"Cycle 2 Bottom",top:false},
  {d:"2017-12-17",p:19783,l:"Cycle 3 Top",top:true}, {d:"2018-12-15",p:3122,l:"Cycle 3 Bottom",top:false},
  {d:"2021-11-10",p:69000,l:"Cycle 4 Top",top:true}, {d:"2022-11-21",p:15476,l:"Cycle 4 Bottom",top:false},
  {d:"2025-10-06",p:126198,l:"Cycle 5 Top",top:true}
];
var TOP_MARGIN = null, ML = 88, MR = 24, PLOT_W = 1920 - ML - MR, BAR_EDGES = null;
// bar edges as fractions of the x-axis, snapped to device pixels, 2 px gap; computed from the real plot width
function barEdges(plotW) { var dpr = window.devicePixelRatio || 1, len = plotW * dpr, n = 626, e = [], out = [];
  for (var j = 0; j <= n; j++) e.push(Math.round(j * len / n));
  for (var k = 0; k < n; k++) { var gap = e[k + 1] - e[k] >= 4 ? 2 : 0; out.push([e[k] / len, (e[k + 1] - gap) / len]); }
  return out; }
BAR_EDGES = barEdges(PLOT_W);

function niceStep(span, maxTicks) {
  var mag = Math.pow(10, Math.floor(Math.log10(span / maxTicks))), steps = [1, 2, 2.5, 5, 10];
  for (var i = 0; i < steps.length; i++) if (span / (steps[i] * mag) <= maxTicks) return steps[i] * mag;
  return 10 * mag;
}
function compactUSD(v) {
  var s, u = "";
  if (v >= 1e6) { s = v / 1e6; u = "M"; } else if (v >= 1e3) { s = v / 1e3; u = "K"; } else s = v;
  var t = s >= 100 ? String(Math.round(s)) : s >= 10 ? s.toFixed(1) : s.toFixed(2);
  if (t.indexOf(".") >= 0) t = t.replace(/0+$/, "").replace(/\.$/, "");
  return "$" + t + u;
}

function compactNumber(v) {
  var a = Math.abs(v), u = a >= 1e12 ? [1e12, "T"] : a >= 1e9 ? [1e9, "B"] : a >= 1e6 ? [1e6, "M"] : a >= 1e3 ? [1e3, "K"] : [1, ""];
  var s = v / u[0], t = Math.abs(s) >= 100 ? String(Math.round(s)) : s.toPrecision(3);
  if (t.indexOf(".") >= 0) t = t.replace(/0+$/, "").replace(/\.$/, "");
  return t + u[1];
}
function yLabel(v) { return v === 0 ? "$0" : "$" + compactNumber(v); }
window.drawFrame = function(sp) {
  var n = sp.nb, w = sp.w, xSpan = n * w, A = LABELS.length;
  var traces = [];
  // legend entries: bar swatches in age order, exactly as the site lists them
  for (var a = 0; a < A; a++) traces.push({ x: [null], y: [null], type: "bar", name: LABELS[a], marker: { color: sp.colors[a], line: { width: 0 } }, hoverinfo: "skip" });
  // bars: one filled outline per cumulative layer, oldest (top of the stack) first, each painted from zero, so
  // every layer's visible band is exactly its own cohort. Bar edges sit on whole device pixels with a 2 px gap
  // (1 px at 1080p), the site's "one pixel narrower than the pitch"; the grid never moves because the bars
  // always span the whole axis, so the gaps stay crisp while the axis grows.
  var xs = [], edges = BAR_EDGES;
  for (var j = 0; j < n; j++) { var x0 = edges[j][0] * xSpan, x1 = edges[j][1] * xSpan; xs.push(x0, x0, x1, x1); }
  var cum = sp.cum;                                   // cum[a] = sum of cohorts 0..a, per bin
  for (var a2 = A - 1; a2 >= 0; a2--) {
    var ys = new Array(4 * n), c = cum[a2];
    for (var k = 0; k < n; k++) { ys[4 * k] = 0; ys[4 * k + 1] = c[k]; ys[4 * k + 2] = c[k]; ys[4 * k + 3] = 0; }
    traces.push({ x: xs, y: ys, type: "scatter", mode: "lines", line: { width: 0, color: sp.colors[a2] }, fill: "tozeroy", fillcolor: sp.colors[a2], showlegend: false, hoverinfo: "skip" });
  }
  var shapes = [], ann = [
    { xref: "paper", yref: "paper", x: 0.5, y: 0.5, text: "<span style='color:rgba(255,255,255,0.15);font-size:50px;font-weight:bold'>@RenshuBTC</span>", showarrow: false, font: { family: FONT } },
    { xref: "paper", yref: "paper", x: 0, y: 0, yanchor: "bottom", yshift: -38, text: "Powered by Bitview.space & Bitcoin Core. Credits: Antoine Le Calvez, Renato Shirakashi, James Check, @_nym21_", showarrow: false, font: { size: 11, color: "rgba(255,255,255,0.55)", family: FONT }, xanchor: "left" }
  ];
  ann.push({ xref: "paper", yref: "paper", x: 0, y: 0.5, xanchor: "center", yanchor: "middle", xshift: -(ML - 16), textangle: -90, showarrow: false,
    text: "USD Value of BTC Supply Last Moved", font: { family: FONT, size: 13, color: "#ffffff" } });
  // a bar taller than the axis (a one-day spike the axis deliberately does not rescale for) is marked, not hidden
  (sp.clip || []).forEach(function(c, k) {
    ann.push({ x: c.x, y: 1, xref: "x", yref: "paper", yanchor: "top", yshift: -1, showarrow: false, text: "\u25b2",
      font: { family: FONT, size: 12, color: "#ffffff" } });
  });
  var isBottom = sp.redPct !== null && sp.redPct >= 80, spotBox = null;
  if (sp.spot && sp.spot > 0) {
    shapes.push({ type: "line", x0: sp.spot, x1: sp.spot, y0: 0, y1: 1, xref: "x", yref: "paper", line: { color: isBottom ? GLOW : "#ffffff", width: 1, dash: "dash" }, layer: "above" });
    var loss = sp.redPct, profit = loss === null ? null : 100 - loss;
    var txt = "Price: $" + sp.spot.toLocaleString("en-US", { maximumFractionDigits: sp.spot < 10 ? 2 : 0 }) +
      "<br><span style='color:" + PROFIT + "'>USD Value Last Moved In Profit: " + (profit === null ? "N/A" : profit.toFixed(1) + "%") + "</span>" +
      "<br><span style='color:" + LOSS + "'>USD Value Last Moved In Loss: " + (loss === null ? "N/A" : loss.toFixed(1) + "%") + "</span>";
    if (isBottom) txt += "<br><span style='color:" + GLOW + "'>BOTTOM SIGNAL — " + loss.toFixed(1) + "% of USD Value Last Moved In Loss</span>";
    var chars = txt.split("<br>").reduce(function(m, s) { return Math.max(m, s.replace(/<[^>]+>/g, "").length); }, 0);
    var flip = sp.spot / xSpan + (chars * 7.9 + 24) / PLOT_W > 0.99;
    var boxF = (chars * 7.9 + 24) / PLOT_W, boxAt = sp.spot / xSpan + (flip ? -6 : 6) / PLOT_W;
    spotBox = { x0: flip ? boxAt - boxF : boxAt, x1: flip ? boxAt : boxAt + boxF, h: txt.split("<br>").length * 17 + 12 };
    ann.push({ x: sp.spot, y: 1, xref: "x", yref: "paper", text: txt, showarrow: false, xanchor: flip ? "right" : "left", xshift: flip ? -6 : 6, yanchor: "top", align: "left",
      font: { color: "#ffffff", size: 13, family: FONT }, bgcolor: "rgba(0,0,0,0.92)", bordercolor: isBottom ? GLOW : "rgba(255,255,255,0.45)", borderwidth: 1, borderpad: 5 });
  }
  var layout = {
    title: { text: "<b>Bitcoin Supply Distribution (in USD Value Last Moved) as of " + new Date(sp.date + "T00:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) + "</b>",
      xref: "paper", x: 0.5, xanchor: "center", y: 1, yanchor: "top", pad: { t: 13 }, font: { size: 20, family: FONT, color: "#ffffff" } },
    font: { family: FONT, color: "#ffffff" }, paper_bgcolor: "#0a0a0a", plot_bgcolor: "#0a0a0a", barmode: "stack", bargap: 0, showlegend: true,
    legend: { orientation: "h", yanchor: "bottom", y: 1, xanchor: "center", x: 0.5, xref: "container", bgcolor: "rgba(0,0,0,0)", font: { family: FONT, size: 9, color: "#ffffff" }, traceorder: "normal" },
    xaxis: { title: { text: "Price [USD]", font: { family: FONT, size: 13, color: "#ffffff" }, standoff: 10 }, range: [0, xSpan], autorange: false,
      tickvals: sp.xt.v, ticktext: sp.xt.t, tickangle: 0, showgrid: true, gridcolor: "rgba(255,255,255,0.08)", tickfont: { family: FONT, size: 11, color: "#ffffff" }, zeroline: false },
    yaxis: { title: { text: "" }, automargin: false, side: "left",
      tickvals: sp.yt, ticktext: sp.ytt || sp.yt.map(yLabel), range: [0, sp.ymax], autorange: false, showgrid: true, gridcolor: "rgba(255,255,255,0.08)", zeroline: false, tickfont: { family: FONT, size: 11, color: "#ffffff" } },
    annotations: ann, shapes: shapes, margin: { l: ML, r: MR, t: TOP_MARGIN === null ? 68 : TOP_MARGIN, b: 44, autoexpand: false }, hovermode: false
  };
  // BTC/USD line over a one-year window, on its own hidden date axis and log axis (range eased per frame)
  traces.push({ x: sp.pd, y: sp.pp, type: "scatter", mode: "lines", xaxis: "x2", yaxis: "y3", line: { color: "rgba(10,10,10,0.8)", width: 4 }, showlegend: false, hoverinfo: "skip" });
  traces.push({ x: sp.pd, y: sp.pp, type: "scatter", mode: "lines", xaxis: "x2", yaxis: "y3", line: { color: PRICE_LINE, width: 1.5 }, name: "BTC/USD", showlegend: true, hoverinfo: "skip" });
  if (sp.spot && sp.spot > 0) traces.push({ x: [sp.tx || sp.date], y: [sp.spot], type: "scatter", mode: "markers", xaxis: "x2", yaxis: "y3", marker: { color: "#ff8c00", size: 9, line: { color: "rgba(255,140,0,0.7)", width: 1.5 } }, showlegend: false, hoverinfo: "skip" });
  // Landmarks exactly as on the site: each marker on the line's own highest (lowest) close within a week of its
  // date (found in render5), each label inside the plot on a dark backing, beside a top and under a bottom,
  // taking the other side, or dropping below, whenever the price box or the day's dot is in the way.
  var lms = sp.lm || [];
  if (lms.length) {
    traces.push({ x: lms.map(function(l) { return l.d; }), y: lms.map(function(l) { return l.p; }), type: "scatter", mode: "markers", xaxis: "x2", yaxis: "y3",
      marker: { color: PRICE_LINE, size: 10, symbol: lms.map(function(l) { return l.top ? "triangle-down" : "triangle-up"; }), line: { color: PRICE_LINE, width: 1 } }, cliponaxis: false, showlegend: false, hoverinfo: "skip" });
    var wl = Date.parse(sp.win[0].replace(" ", "T") + "Z"), wr = Date.parse(sp.win[1].replace(" ", "T") + "Z"), top3 = sp.pr ? sp.pr[1] : 0;
    var plotH = 1080 - (TOP_MARGIN === null ? 68 : TOP_MARGIN) - 44, blocks = [];
    if (spotBox) blocks.push({ x0: spotBox.x0, x1: spotBox.x1, y0: 0, y1: spotBox.h });
    if (sp.spot > 0 && top3 > 0) { var dF = (Date.parse((sp.tx || sp.date).replace(" ", "T") + (sp.tx ? "Z" : "T00:00:00Z")) - wl) / (wr - wl), dY = (1 - sp.spot / top3) * plotH;
      blocks.push({ x0: dF - 8 / PLOT_W, x1: dF + 8 / PLOT_W, y0: dY - 8, y1: dY + 8 }); }
    lms.forEach(function(l) {
      var f = (Date.parse(l.d + "T00:00:00Z") - wl) / (wr - wl), wF = (l.l.length * 6.6 + 8) / PLOT_W, gF = 8 / PLOT_W;
      var yPx = top3 > 0 ? (1 - l.p / top3) * plotH : 0, yTop = l.top ? yPx : yPx + 8;
      var span = function(a) { var x0 = a === "left" ? f + gF : a === "right" ? f - gF - wF : f - wF / 2; return [x0, x0 + wF]; };
      var inside = function(a) { var s2 = span(a); return s2[0] >= 0 && s2[1] <= 1; };
      var blockedBy = function(a, y) { var s2 = span(a); return blocks.filter(function(b) { return s2[1] > b.x0 && s2[0] < b.x1 && y < b.y1 && y + 17 > b.y0; }); };
      var order = l.top ? (f < 0.2 ? ["left", "right"] : ["right", "left"]) : ["center", "left", "right"];
      var fits = order.filter(inside); if (!fits.length) fits = [order[0]];
      var free = fits.filter(function(a) { return !blockedBy(a, yTop).length; }), side = free.length ? free[0] : fits[0], y = yTop;
      if (!free.length) blockedBy(side, yTop).forEach(function(b) { y = Math.max(y, b.y1 + 4); });
      ann.unshift({ x: l.d, y: l.p, xref: "x2", yref: "y3", text: l.l, showarrow: false, xanchor: side, yanchor: "top",
        xshift: side === "left" ? 8 : side === "right" ? -8 : 0, yshift: -(y - yPx), font: { color: PRICE_LINE, size: 11, family: FONT }, bgcolor: "rgba(10,10,10,0.75)", borderpad: 2 });
    });
  }
  layout.xaxis2 = { overlaying: "x", showticklabels: false, showgrid: false, type: "date", visible: false, autorange: false, range: sp.win };
  layout.yaxis3 = { overlaying: "y", showticklabels: false, showgrid: false, type: "linear", visible: false, autorange: false, range: sp.pr || [0, 1] };
  return Plotly.react("chart", traces, layout, { staticPlot: true, displayModeBar: false }).then(function() {
    var fl = document.getElementById("chart")._fullLayout;
    return { legendH: fl.legend && fl.legend._height, plotW: fl.xaxis._length, plotH: fl.yaxis._length, top: fl.margin.t };
  });
};
window.setTopMargin = function(t) { TOP_MARGIN = t; };
window.fixBars = function() { var fl = document.getElementById("chart")._fullLayout; PLOT_W = fl.xaxis._length; BAR_EDGES = barEdges(PLOT_W);
  return { offset: fl.xaxis._offset, length: fl.xaxis._length, dpr: window.devicePixelRatio }; };
</script></body></html>
