// ---- Draggable tracer: grab the dot on the BTC price line and drag it; the URPD follows the date ----
// The dot is a fixed-position element laid over Plotly's marker (Plotly's own drag layer would otherwise
// turn the gesture into a zoom box). While dragging, the overlay window is frozen so the line stays put
// under the cursor; on release it re-centres as usual.
window.tracerDragWindow = null;
(function(){
  var el = document.getElementById("tracer");
  var gd = document.getElementById("chart");
  function axes() { var fl = gd._fullLayout; return fl && fl.xaxis2 && fl.yaxis3 && fl.xaxis2._length ? fl : null; }
  window.placeTracer = function() {
    var fl = axes();
    var data = lastRenderedData; // the dot marks the date the chart is showing
    var spot = data && data.spot;
    if (!fl || !showPriceOverlay || !(spot > 0)) { el.classList.remove("show"); return; }
    var xa = fl.xaxis2, ya = fl.yaxis3;
    var x = xa._offset + xa.d2p(data.dateStr);
    var y = ya._offset + ya.d2p(spot);
    if (!isFinite(x) || !isFinite(y) || x < xa._offset - 8 || x > xa._offset + xa._length + 8) { el.classList.remove("show"); return; }
    var r = gd.getBoundingClientRect();
    // getBoundingClientRect is post-transform, while x and y are in Plotly layout pixels, which
    // on a phone is a 2000px space drawn through scale(var(--fit)). Absent on desktop, so
    // parseFloat("") is NaN and the factor is exactly 1.
    var fit = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fit")) || 1;
    el.style.left = (r.left + x * fit) + "px";
    el.style.top = (r.top + y * fit) + "px";
    el.classList.add("show");
  };
  window.addEventListener("resize", function(){ setTimeout(window.placeTracer, 80); });
  function nearestDateIndex(ds) {
    var lo = 0, hi = allDates.length - 1;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (allDates[mid] < ds) lo = mid + 1; else hi = mid; }
    if (lo > 0) {
      var t = new Date(ds + "T00:00:00Z").getTime();
      if (Math.abs(new Date(allDates[lo - 1] + "T00:00:00Z").getTime() - t) < Math.abs(new Date(allDates[lo] + "T00:00:00Z").getTime() - t)) lo--;
    }
    return lo;
  }
  function indexAtClientX(cx) {
    var fl = axes(); if (!fl) return -1;
    var xa = fl.xaxis2, r = gd.getBoundingClientRect();
    // Convert to layout pixels before subtracting the axis offset, which is not in client space.
    var fit = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fit")) || 1;
    var px = Math.max(0, Math.min(xa._length, (cx - r.left) / fit - xa._offset));
    var ds = String(xa.p2d(px)).slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return -1;
    return nearestDateIndex(ds);
  }
  var dragging = false;
  el.addEventListener("pointerdown", function(e){
    if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault(); e.stopPropagation();
    dragging = true;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    el.classList.add("dragging"); document.body.classList.add("tracer-dragging");
    var rng = gd.layout && gd.layout.xaxis2 && gd.layout.xaxis2.range;
    window.tracerDragWindow = rng ? [new Date(String(rng[0]).slice(0, 10) + "T00:00:00Z").getTime(), new Date(String(rng[1]).slice(0, 10) + "T00:00:00Z").getTime()] : null;
  });
  el.addEventListener("pointermove", function(e){
    if (!dragging) return;
    e.preventDefault();
    var idx = indexAtClientX(e.clientX);
    if (idx >= 0 && idx < allDates.length) goTo(idx);
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    el.classList.remove("dragging"); document.body.classList.remove("tracer-dragging");
    window.tracerDragWindow = null;
    // Flush the last target and redraw even when its date is already displayed: its
    // previous render used the frozen drag window, which must now re-centre.
    goTo(currentIdx, true);
  }
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);
  // If setPointerCapture threw, the release never reaches the 14px dot and the drag state,
  // the grabbing cursor and the frozen window would stay set for good.
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  el.addEventListener("dblclick", function(e){ e.preventDefault(); });
})();
var EXPLAINER = {
  en: {"title": "How to read this chart", "sections": [["Start here", "Ask every bitcoin in existence one question: what was bitcoin worth the last time you moved? Sort the answers into price buckets and add up the supply in each. That is this chart. A tall bar is a price where a lot of supply last changed position. A gap is a price where almost none did. The formal name for it is URPD, the UTXO Realised Price Distribution."], ["What a UTXO is", "Bitcoin has no account balances. It works like cash in a pocket: you hold separate notes, and to pay 12 dollars with a 20 you hand over the whole note and take 8 back as change. Each note is a UTXO, an Unspent Transaction Output. Your wallet balance is only the sum of the notes you happen to hold, and every bar on this chart is built out of them."], ["Why every coin carries a price", "A UTXO is created inside a block, that block has a timestamp, and that moment has a bitcoin price. So every coin alive today has a price attached to it: the price on the day it last moved. Nothing is surveyed or estimated, the chain records it. That attached price is the coin's realised price, also called its cost basis. It is the closest thing on-chain to what the current holder paid."], ["Reading the axes", "Along the bottom is that attached price in dollars, not today's price. Up the left is each price bucket's share of the day, in percent: of the realized cap (every coin's value when it last moved, added up) in % USD mode, of all the coins in % BTC mode. The bars add up to 100% on every day, so the same height is the same share on any day. Both axes are marked at twenty equal steps from zero to their very end, with the labels rounded to two significant figures. The price axis is not refitted to each day: it ends at the highest price the data had reached by the day you are viewing, grows only when the data goes past it, and never shrinks. The left axis ends at the day's own tallest bar, so every day's distribution fills the same frame; the Y-max field and PIN Y-AXIS are the only things that change that (see Y-max and Pin Y-axis). In % BTC mode Y-max starts at 99.8: the first bar holds every coin last moved for less than one bar's width, about 1.85M BTC of it from before bitcoin traded above 50 cents, around ten times any other bar, so at 99.8 it runs off the top with its height printed there (▲). Type 100 to see it whole."], ["The colours: how old the coins are", "With AGE on, every bar is stacked out of 23 age bands, set by how long the coin has sat unmoved: under an hour at one end, over fifteen years at the other. Yellow is fresh, deep blue is ancient, and the steps between are logarithmic, so equal colour distance is equal multiples of age. The colours follow one path through a perceptual colour space (OKLCH), spaced so that every step looks the same size, with brightness falling steadily from young to old, so the order still reads in greyscale, and every band keeps at least 3:1 contrast against the dark background. A tall bar in one colour is a single cohort. A tall bar in many colours is a price that generations of holders share."], ["LTH/STH or AGE", "The second pair of switches picks how the bars are coloured. LTH/STH, the default, adds up the 23 age bands above into two at 150 days: short-term holders (STH), in amber, are the coins that moved within the last 150 days (every band up to 4m-5m), and long-term holders (LTH), in blue, the coins that have not moved for 150 days or more (5m-6m and older). 150 days is Bitcoin Research Kit's line between the two (Glassnode draws it at 155); the usual reasoning is that coins which have sat still for about five months become much less likely to move. AGE stacks each bar out of the 23 age bands themselves. The bars, the axes and a pinned Y-axis are the same either way; only the colours change. Short- and long-term holders together are the whole supply.", "STH = { utxo | age(utxo) < 150 days }\nLTH = { utxo | age(utxo) ≥ 150 days }"], ["The white line: bitcoin's price", "Bitcoin's own price, as daily closes. It has its own hidden axes: left to right is time here rather than price, a year running from 275 days before the selected day to 90 days after it (near the latest day it ends a week past that day and starts further back instead), and the height runs linearly from $0 to the highest close shown so far, so the line fills the chart and the same dollar move is always the same height. That scale grows only when the price makes a new high. The orange dot sits on the selected day and past cycle tops and bottoms are marked. Drag the dot to move through history. Click BTC/USD in the legend to hide the line."], ["Hovering a bar", "Hover over a bar to read its price, what its age band (or holder group, in LTH/STH) holds there, the whole bar's share with the amount behind it (Total Value When Last Moved, or Total Supply in % BTC mode) and Percent of Total. That last one is a running share: of all the day's supply, or value in % USD mode, the part that last moved at or below this price. It is counted from the recorded prices themselves, not the smoothed bars, so at the dashed line it meets the box's In Profit share. Where it climbs quickly from bar to bar, supply is dense.", "Percent of Total(P) = Σ W(p ≤ P) / Σ W × 100"], ["Marking a price range", "Click and drag across the chart to mark a range of prices. The columns you pass over stay marked between two thin white lines as you move through the days and switch modes, until you double-click the chart or press Escape. A box inside the top of the mark, as wide as the mark, gives the share of the day that last moved inside it (a mark too narrow for the words shows the share alone), of the value in % USD mode and of the coins in % BTC mode, counted from the recorded prices like Percent of Total, and breaks that share down as the bars are coloured, each part of the whole day like the share itself, so the parts add up to it: in AGE by age band, from under an hour to over fifteen years, in each band's colour; in LTH/STH between long- and short-term holders. A tall box drops to shorter lines, then to the range and its share alone. In LTH/STH it also gives the most days until every coin there is a long-term holder, and the date that falls on: 150 days after the youngest of them last moved. None can be younger than the youngest age band holding coins there, nor than the last day the price was inside the range, since a coin carries the price the market traded at when it moved; it reads Already All Long-Term Holders when no short-term holder is there.", "Share(a, b) = Σ W(a ≤ P < b) / Σ W × 100\nAll LTH within = 150 − max(youngest band's lowest age, days since the price was last in [a, b))"], ["The dashed line: today's price", "The spot price on the selected day. Supply to its left last moved below this price, so it is in profit; supply to its right last moved above it, so it is in loss. The box gives the price and both shares. Profit and loss are counted from the price when last moved, which is what someone paid only if that move was a purchase (see What this chart cannot tell you).", "Profit % = Σ W(P) for P ≤ Spot / Σ W(P) × 100"], ["What people look for", "A thick cluster of bars marks a price where a lot of supply settled. Above today's price such a cluster is often read as overhead resistance, on the reasoning that holders who last moved coins there may sell near break-even. Below today's price the same cluster is read as support. A wide gap is a stretch with little supply to slow a move through it. Treat all of it as a map of where supply sits, not a forecast of where price goes."], ["What this chart cannot tell you", "A coin moving on-chain is not always a sale. Exchanges shuffle their own coins, people consolidate their own UTXOs, custodians rotate wallets, and each of those restamps coins at that day's price with no buyer and no seller. The reverse is also true: a trade matched inside an exchange never touches the chain, so both sides keep their old stamp. Coins whose keys are lost keep theirs forever. Read a bar as supply that last moved here, not as proof that someone paid this."], ["Moving through time", "Published versions of this chart usually show only today. This one steps through the whole history, day by day, back to 2009-01-03. 1D/1W/1M/1Y sets the step size and the arrow buttons move one step; Left and Right or A and D do the same from the keyboard. 1 to 4 pick the step size, and Up and Down or W and S move it one size up or down (1D, 1W, 1M, 1Y, and round again); Home and End jump to the first and last day. You can also pick a cycle top or bottom from CYCLE TOP/BTM. Wherever you go, the left axis ends at that day's own bars (see Y-max), unless you have pinned it (see Pin Y-axis). If the keys stop responding, click the chart once to take focus off a toolbar field."], ["% USD and % BTC", "% BTC counts each coin by how much bitcoin it is. % USD counts it by what it was worth in dollars at the moment it last moved, so one coin last moved at 100,000 dollars outweighs the same coin last moved at 100. % BTC shows where the coins are; % USD shows where the money went in. Either way each bar is drawn as its share of the day: of all the coins in % BTC, of the realized cap in % USD. The bars add up to 100% on every day, so the left axis means the same on any day, and the hover gives the amount behind each share.", "S(P) = Σ utxo.value where utxo.price ∈ [P, P + ΔP)\nValue When Last Moved(P) = P · S(P)\nShare(P) = W(P) / Σ W × 100   (W = S in % BTC, P · S in % USD)"], ["Time pockets", "TIME POCKETS, beside PIN Y-AXIS, works in LTH/STH only (in AGE it is off). It marks the short-term holders' prices, from the first bar holding any of their coins on the left to the last on the right, and cuts that span into pockets, each labelled LTH IN XX DAYS: the most days until every coin last moved inside it is a long-term holder, worked out bar by bar as for a marked range (150 days less the youngest age any coin there can have: the youngest age band holding coins there, or the days since the price was last inside it, whichever is older). A pocket's bars all turn long-term within a day of one another, so its label is exact to the day; a bar with no short-term holders goes with the pocket on its left. The shading says how soon: the brighter a pocket, the sooner its coins turn long-term, with a faint line between two pockets and a white line at each end of the span. The labels sit in one row below the price box, each over its own pocket: flat where the pocket is wide enough, upright where only that fits; a pocket too narrow even for that gives its days in its bars' hover. The pockets come from the day alone, the same at any window size, and follow the day as you step or scrub. While it is on, the chart cannot be marked; press it again to turn it off.", "LTH IN XX DAYS = the largest, over the pocket's bars, of 150 − max(youngest band's lowest age, days since the price was last in the bar); the smallest is at most 1 day less"], ["Pin Y-axis", "The left axis follows each day's own bars, so it changes as you move. PIN Y-AXIS freezes it where it is on the day you are viewing, marked with a dashed line, so every other day is drawn against that one height, the same share of the day on any date, and taller bars run off the top (▲) instead of moving the axis. While it is pinned the Y-max field is off, since the pin decides where the axis ends. Press it again to release. Pins are kept separately for each weighting, bin count and smoothing (AGE and LTH/STH share them, since their bars are the same), because a height only means the same thing under the same settings, and they survive a reload."], ["Bins", "BINS sets how many equal-width bars the price axis is cut into, from 50 to 1000; 625 by default, the same as the videos. They run from zero up to exactly the highest cost basis so far (see Reading the axes), with one more past it that takes in what the smoothing spreads beyond that price (anything reaching further is folded back in, so no supply is lost). With 625, a bar is exactly 1/625 of the way from zero to the highest cost basis so far, whatever the smoothing: across the 125,650 dollar axis of late 2025, 201.04 dollars. The BINS field shows that width after the count, in dollars for the day in view ($201 there). Fewer bins give wider bars that each hold more; more give finer detail. Bar widths change only when the axis grows or you change BINS. Bars are drawn on whole pixels with a one-pixel gap so neighbours stay distinct, and are drawn solid once they would be thinner than two pixels.", "ΔP = highest cost basis so far / bins"], ["Smoothing", "The source data is rounded: every coin carries its block's price to the nearest dollar below 100,000 dollars and the nearest ten dollars above, so each recorded price really stands for a small range, and a single large transfer can pile onto one exact figure and throw up a spike that is an artefact of the rounding. Smoothing spreads each recorded price evenly back over the range it was rounded from, then blurs it with a bell curve, the Gaussian, the one blur that never invents a peak or a gap. Its width is a percentage of the price and never less than about four tenths of a bar, and each bar receives exactly its share. 0.24, the default, is how far bitcoin's price typically moves in the few minutes a recorded price can hide, measured over the whole history. 0 gives the raw buckets. Total supply and total value are preserved exactly.", "σ = √((S% × price)² + ΔP²/6)   (S = 0: raw)\nbar = the part of [stamp ± step/2] ∗ N(0, σ) inside the bar"], ["Y-max", "Where the left axis ends, as a percentile of the day's bar heights: at 100 the day's tallest bar reaches the top; below 100 the axis ends at that percentile, and the bars above it run off the top. The ▲ figure at the top left gives the tallest of them and, in brackets, how many more there are, so no bar is ever cut without you seeing it. It starts at 100 in % USD mode and at 99.8 in % BTC mode, where the first bar would otherwise flatten everything else (see Reading the axes); each mode keeps the value you type. While the Y-axis is pinned the field is off.", "y-max = percentileₙ(this day's bars)   (100 = the tallest bar)"], ["Bottom signal", "When the share of the day in loss reaches the threshold set in the toolbar, the dashed line and the border of the price box turn yellow, and the box adds a fourth line naming the threshold. In % USD mode the share is of the value that last moved above the day's price, 80 percent by default; in % BTC mode it is of the coins, 50 percent by default. Each mode keeps the value you type. Readings that extreme have historically clustered near cycle lows. That is a pattern in the past, not a rule about the future.", "Signal when In Loss % ≥ Threshold"], ["Watch the videos", "FULL HISTORY VIDEOS in the toolbar opens a menu of the four, VIDEO (% USD-LTH/STH), VIDEO (% USD-AGE), VIDEO (% BTC-LTH/STH) and VIDEO (% BTC-AGE), each of which opens the whole history as one video on YouTube, drawn as this page draws that choice by default, the bottom signal included: % USD with the left axis at each day's tallest bar, from 31 January 2011, the first day with any value on the chart, and % BTC with Y-max at 99.8, from 18 May 2010, when the first bitcoin price comes onto the chart, the bars coloured by short- and long-term holders (LTH/STH) or by age band (AGE). All four run to the latest day, with neighbouring days blended so they run smoothly, 5 minutes at 60 frames a second in 4K (3840 × 2160). A GitHub workflow draws them again once a week, taking in the week just ended, and posts them to the renshuBTC channel. Until YouTube lets others watch a video, its entry in the menu opens the renshuBTC channel instead. This site offers no file to download (the camera icon on the chart only saves a PNG picture of it, made in your own browser), and never asks you to install anything, connect a wallet or type a seed phrase. Anything that does is not this site."], ["Where the data comes from", "Distributions and prices come from the Bitcoin Research Kit, which derives them from a full Bitcoin Core node, served through bitview.space. URPD was introduced by Renato Shirakashi in April 2020. This version adds the daily history and the age colouring."]]},
  zh: {"title": "如何看懂这张图", "sections": [["先看这里", "向现存的每一枚比特币问同一个问题：你上一次移动时，比特币值多少钱？把答案按价格区间归类，再把各区间的供应量加总，就得到这张图。柱子越高，说明有越多供应最后一次移动发生在那个价位；出现空档，说明几乎没有。它的正式名称是 URPD，即 UTXO 已实现价格分布。"], ["什么是 UTXO", "比特币没有账户余额，它更像口袋里的现金：你手上是一张张钞票，用 20 元付 12 元时，要把整张递出去，再收回 8 元找零。每一张这样的钞票就是一个 UTXO，即未花费交易输出。钱包余额只是你手上这些钞票的总和，而这张图里的每一根柱子都由它们堆叠而成。"], ["为什么每枚币都带着一个价格", "UTXO 诞生在某个区块里，区块带有时间戳，那一刻又对应一个比特币价格。所以今天存在的每一枚币身上都贴着一个价格：它最后一次移动那天的价格。这不是问卷调查，也不是估算，而是链上如实记录的。这个价格就是该币的已实现价格，也叫成本基础，是链上最接近“当前持有者付出了多少”的量。"], ["坐标轴怎么读", "横轴是上面那个贴在币上的价格（美元），不是今天的价格。纵轴是每个价格区间占当天总量的百分比：% USD 模式下占已实现市值（每枚币最后移动时的价值之和），% BTC 模式下占全部币数。每一天的柱子加起来都是 100%，所以同样的高度在任何一天都代表同样的占比。两条轴都从零到末端分成二十等份标注，标签取两位有效数字。价格轴不会按每一天重新缩放：它停在截至所看那天、数据到达过的最高价格；只有数据越过时才会扩大，而且永远不会缩小。左轴停在当天自己最高的柱子，所以每一天的分布都填满同一个画框；能改变这一点的只有“Y 轴上限”输入框和“固定 Y 轴”按钮（见“Y 轴上限”与“固定 Y 轴”）。% BTC 模式下 Y 轴上限默认为 99.8：第一根柱子装着所有最后移动价格低于一根柱宽的币，其中约 185 万枚来自比特币价格还不到 0.5 美元的年代，大约是其他任何柱子的十倍，因此在 99.8 时它会冲出顶部，并在顶端以 ▲ 标出它的高度。输入 100 即可看到它的全貌。"], ["颜色：币有多老", "选择“年龄”时，每根柱子由 23 个币龄分层堆成，依据是这枚币静止了多久，一端不到一小时，另一端超过十五年。黄色最新，深蓝最老，中间按对数分级，所以相同的颜色距离对应相同的年龄倍数。颜色沿感知均匀色彩空间（OKLCH）中的一条路径排列，每一级看起来一样大，亮度从新到旧稳定下降，因此在灰度下也能读出顺序；每个分层与深色背景的对比度都不低于 3:1。整根柱子只有一种颜色，说明是单一群体；颜色斑驳，说明这个价位上聚集着好几代持有者。"], ["长/短期或年龄", "第二组切换决定柱子如何着色。默认的“长/短期”以 150 天为界，把上面的 23 个币龄分层加总成两组：琥珀色的短期持有者（STH），是过去 150 天内移动过的币（4m-5m 及更年轻的各层）；蓝色的长期持有者（LTH），是 150 天或更久没有移动的币（5m-6m 及更老的各层）。150 天是 Bitcoin Research Kit 对两者的分界（Glassnode 用 155 天），通常的理由是：静止约五个月之后，币再次移动的可能性会大大降低。“年龄”则按这 23 个币龄分层堆叠每根柱子。无论选哪种，柱子、坐标轴和已固定的 Y 轴都完全相同，变的只是颜色。短期与长期持有者合起来就是全部供应。", "STH = { utxo | age(utxo) < 150 days }\nLTH = { utxo | age(utxo) ≥ 150 days }"], ["白线：比特币价格", "比特币自身的价格，按日收盘价绘制。它用的是另一套隐藏坐标：这里的左右方向是时间而不是价格，范围是一年：从所选日期之前 275 天到之后 90 天（接近最新一天时，窗口止于最新一天之后一周，起点相应提前）；高度按线性刻度从 0 美元到迄今显示过的最高收盘价，所以这条线填满图表，同样的美元涨跌始终是同样的高度。只有价格创新高时，这个刻度才会扩大。橙色圆点标出所选当天，历史上的周期顶部与底部也已标注。拖动圆点即可在历史中移动。点击图例中的 BTC/USD 可以隐藏这条线。"], ["悬停查看柱子", "把鼠标停在柱子上，可以看到它的价格、该币龄层（长/短期模式下为该持有者群体）在那里的数量、整根柱子的占比及其对应的数量（最后移动时的总价值；% BTC 模式下为总供应量），以及占总量百分比。最后这一项是累计占比：当天全部供应（% USD 模式下为全部价值）中，最后一次在该价格或更低价格移动的部分。它按记录的价格本身计算，而不是按平滑后的柱子，因此在虚线处与方框中的盈利占比一致。相邻柱子之间它上升得越快，那里的供应越密集。", "Percent of Total(P) = Σ W(p ≤ P) / Σ W × 100"], ["标记价格区间", "在图表上按住并横向拖动，即可标记一段价格区间。拖过的整列会以两条白色细线为界一直保持标记，切换日期和模式时也不会消失，直到你双击图表或按 Esc 键。标记内顶端、与标记同宽的方框给出当天最后在此区间内移动的占比（标记太窄、放不下文字时只显示占比）：% USD 模式下按价值，% BTC 模式下按币数，与“占总量百分比”一样按记录的价格计算，并按柱子的着色方式拆分这一占比（各部分同样以当天总量为基准，相加即为该占比）：年龄模式下按币龄层，从不到一小时到超过十五年，各用其币龄层的颜色；长/短期模式下拆分为长期与短期持有者。方框太高时改用简短写法，再不行则只显示区间及其占比。在长/短期模式下，它还给出此处所有币都成为长期持有者最多还需多少天及对应的日期：即其中最年轻的币最后一次移动后的第 150 天。最年轻的币不会比在此持有币的最年轻币龄层更年轻，也不会比价格最后一次处于该区间的那天更年轻，因为币带着它移动时市场成交的价格；若此处没有短期持有者，则显示“已全部为长期持有者”。", "Share(a, b) = Σ W(a ≤ P < b) / Σ W × 100\nAll LTH within = 150 − max(youngest band's lowest age, days since the price was last in [a, b))"], ["虚线：当天价格", "所选当天的现价。它左边的供应最后一次移动时的价格低于此价格，因此处于盈利；右边的高于此价格，处于亏损。方框中给出价格以及这两个比例。这里的盈亏以最后一次移动时的价格为基准，只有当那次移动是一次买入时，它才是买入价（见“这张图不能告诉你什么”）。", "Profit % = Σ W(P) for P ≤ Spot / Σ W(P) × 100"], ["大家在看什么", "密集成团的柱子代表大量供应沉淀在那个价位。若它位于今天价格之上，常被解读为上方阻力，理由是当初在那里移动过币的持有者可能在回本附近卖出；若位于下方，同一团柱子则被解读为支撑。宽阔的空档意味着这一段几乎没有供应去减缓价格穿越。这些都应当视为供应分布的地图，而不是价格走向的预测。"], ["这张图不能告诉你什么", "链上的一次移动并不等于一次成交。交易所在内部调拨自有币，用户合并自己的 UTXO，托管方轮换钱包，这些都会以当天价格重新打上标记，却没有买方也没有卖方。反过来同样成立：在交易所内部撮合的成交根本不上链，买卖双方身上的旧标记原封不动。私钥丢失的币则会永远保留它们的标记。请把一根柱子读作“供应最后一次在此移动”，而不是“有人以此价成交”。"], ["在历史中移动", "公开发布的同类图表通常只显示当天。这张图可以逐日回溯整段历史，一直回到 2009-01-03。1D/1W/1M/1Y 设定步长，箭头按钮移动一步，键盘上的左右方向键或 A/D 同样可用。1 到 4 选择步长，上下方向键或 W/S 把步长加大或减小一级（1D、1W、1M、1Y 循环）；Home/End 跳到最早与最新一天。你也可以从“周期顶部/底部”中选择某个周期顶部或底部。无论走到哪里，左轴都停在当天自己的柱子上（见“Y 轴上限”），除非你固定了它（见“固定 Y 轴”）。若按键失灵，在图表上点一下，把焦点从工具栏输入框移开即可。"], ["% USD 与 % BTC", "% BTC 按币的数量计量。% USD 按它最后一次移动那一刻的美元价值计量，因此一枚在 10 万美元处最后移动的币，远重于同样一枚在 100 美元处移动的币。% BTC 显示币在哪里，% USD 显示钱投在哪里。无论哪种，每根柱子都画成它占当天总量的比例：% BTC 下占全部币数，% USD 下占已实现市值。每一天的柱子加起来都是 100%，所以左轴在任何一天含义相同，悬停时会给出每个占比对应的数量。", "S(P) = Σ utxo.value where utxo.price ∈ [P, P + ΔP)\nValue When Last Moved(P) = P · S(P)\nShare(P) = W(P) / Σ W × 100   (W = S in % BTC, P · S in % USD)"], ["时间口袋 (TIME POCKETS)", "“时间口袋”位于“固定 Y 轴”旁边，只在长/短期模式下可用（年龄模式下不可用）。它标出短期持有者所在的价格范围：从左边第一根含有其币的柱子到右边最后一根，再把这段范围切成若干口袋，每个口袋标着“XX 天内成为 LTH”，即其中最后移动的每一枚币全部成为长期持有者最多还需的天数，逐根柱子按标记价格区间的方法计算（150 天减去其中任何一枚币可能的最小币龄：取其中含币的最年轻币龄层的下限与价格最后一次落在该处以来的天数中较大者）。同一口袋中的柱子彼此相差不超过一天就全部成为长期持有者，所以标签精确到天；没有短期持有者的柱子归入其左边的口袋。阴影表示还有多久：口袋越亮，其中的币越早成为长期持有者；相邻两个口袋之间有一条淡线，整段两端各有一条白线。标签排成一行，位于价格框下方，各自位于其口袋上方：口袋够宽时横排，只放得下竖排时竖排；连竖排都放不下的窄口袋，其天数显示在柱子的悬停信息中。口袋只由当天的数据决定，与窗口大小无关，并随你逐日查看或拖动而更新。开启时无法在图表上标记区间；再按一次即可关闭。", "XX 天内成为 LTH = 口袋中各柱子的 150 − max(最年轻币龄层的下限, 价格最后一次落在该柱以来的天数) 的最大值；最小值至多少 1 天"], ["固定 Y 轴 (PIN Y-AXIS)", "左轴随每一天自己的柱子变化，所以移动时刻度会变。“固定 Y 轴”把它锁定在你正在看的这一天的位置，并用虚线标出，之后其他日期都按这一高度（在任何一天都是当天同样的占比）绘制，更高的柱子会冲出顶部（▲），而不会改变刻度。固定期间“Y 轴上限”输入框不可用，因为轴的终点由固定值决定。再按一次即可解除。固定值按加权方式、分箱数和平滑度分别保存（年龄与长/短期共用，因为两者的柱子相同），因为只有在相同设置下柱高才具有相同含义；刷新页面后依然保留。"], ["分箱", "“分箱”设定价格轴被切成多少根等宽的柱子，从 50 到 1000；默认 625，与视频相同。它们从 0 一直到恰好迄今最高的成本基础（见“坐标轴怎么读”），另有一根在它之外，接住平滑越过这个价格的部分（更远的部分会按比例折回，供应量一点不少）。取 625 时，无论平滑度多少，每根柱子都恰好是从 0 到迄今最高成本基础的 1/625：在 2025 年底以来 125,650 美元的轴上，是 201.04 美元。“分箱”框在数字后面显示所看那天的这个宽度（那里是 $201）。分箱越少，柱子越宽，每根装得越多；越多则细节越细。只有轴扩大或你改变分箱时，柱宽才会改变。柱子对齐到整像素，相邻之间留出一像素间隙以便区分；当柱宽不足两像素时则实心绘制。", "ΔP = highest cost basis so far / bins"], ["平滑 (Smoothing)", "源数据经过取整：每枚币记录的是其区块的价格，10 万美元以下取整到 1 美元，以上取整到 10 美元，所以每个记录的价格其实代表一小段价格；一笔大额转账可能全部压在同一个精确数字上，形成一根由取整造成的假尖峰。平滑先把每个记录的价格均匀摊回它被取整之前的那一小段，再用钟形曲线加以模糊。这条曲线是高斯曲线，唯一不会凭空制造峰或缺口的模糊方式；它的宽度是价格的一个百分比，且不小于约十分之四根柱宽，每根柱子精确地分得属于自己的那一份。默认值 0.24，是在整段历史中，比特币价格在一个记录价格所能掩盖的几分钟内通常移动的幅度。设为 0 则显示原始分箱。总供应量与总价值完全保持不变。", "σ = √((S% × price)² + ΔP²/6)   (S = 0: raw)\nbar = the part of [stamp ± step/2] ∗ N(0, σ) inside the bar"], ["Y 轴上限 (Y-max)", "左轴的终点，按当天柱高的百分位计：100 时当天最高的柱子顶到图表顶部；低于 100 时轴停在该百分位，高出的柱子冲出顶部。左上角的 ▲ 数字给出其中最高那根的高度，括号里是另外还有几根，所以任何柱子被截断你都看得见。% USD 模式默认 100，% BTC 模式默认 99.8，否则第一根柱子会把其他一切压扁（见“坐标轴怎么读”）；每种模式都会记住你输入的值。固定 Y 轴期间此输入框不可用。", "y-max = percentileₙ(this day's bars)   (100 = the tallest bar)"], ["底部信号", "当天处于亏损的占比达到工具栏中设定的阈值时，虚线和价格方框的边框会变成黄色，方框中还会多出第四行，写明所达到的阈值。% USD 模式下按在高于当天价格时最后移动的价值计算，默认 80%；% BTC 模式下按币数计算，默认 50%。每种模式都会记住你输入的值。历史上如此极端的读数往往集中出现在周期低点附近。这是过去的规律，不是对未来的保证。", "Signal when In Loss % ≥ Threshold"], ["观看视频", "工具栏中的“完整历史视频”会打开一个菜单，内有“视频 (% USD-长/短期)”“视频 (% USD-年龄)”“视频 (% BTC-长/短期)”和“视频 (% BTC-年龄)”四项，各在 YouTube 上打开一段整段历史的视频，按本页该选择的默认设置绘制（包括底部信号）：% USD 的左轴停在每天最高的柱子，从 2011 年 1 月 31 日（图上第一次出现价值）开始；% BTC 的 Y 轴上限为 99.8，从 2010 年 5 月 18 日（第一个比特币价格出现在图上）开始；柱子按短期与长期持有者（长/短期）或按币龄层（年龄）着色。四段都到最新一天，相邻日期平滑过渡，时长 5 分钟，每秒 60 帧，4K（3840 × 2160）。它们由 GitHub 工作流每周重新生成一次（加入刚结束的一周），并发布到 renshuBTC 频道。在 YouTube 允许其他人观看某段视频之前，菜单中的这一项会打开 renshuBTC 频道。本站不提供任何文件下载（图表上的相机图标只是把图表存成一张 PNG 图片，由你自己的浏览器生成），也从不要求你安装软件、连接钱包或输入助记词；凡是这样做的，都不是本站。"], ["数据来源", "分布与价格数据来自 Bitcoin Research Kit，由完整的 Bitcoin Core 节点推导而来，经 bitview.space 提供。URPD 由 Renato Shirakashi 于 2020 年 4 月提出，本版本在其基础上加入了逐日历史与币龄着色。"]]},
  ja: {"title": "このチャートの読み方", "sections": [["まずはここから", "いま存在するすべてのビットコインに同じ質問をします。「最後に動いたとき、ビットコインはいくらでしたか」。その答えを価格帯ごとにまとめ、各帯の供給量を合計したものがこのチャートです。棒が高い価格帯は、多くの供給が最後に動いた場所。空白の価格帯は、ほとんど動かなかった場所です。正式には URPD（UTXO 実現価格分布）と呼ばれます。"], ["UTXO とは", "ビットコインに口座残高はありません。仕組みはポケットの中の現金に近く、手元にあるのは一枚ずつの紙幣です。20 ドル札で 12 ドル払うには札ごと渡し、8 ドルをお釣りとして受け取ります。この一枚一枚が UTXO、すなわち未使用トランザクションアウトプットです。ウォレットの残高は手元にある札の合計にすぎず、このチャートの棒はすべてそれを積み上げたものです。"], ["すべてのコインが価格を持つ理由", "UTXO はあるブロックの中で生まれ、そのブロックにはタイムスタンプがあり、その時点にはビットコイン価格があります。つまり今日存在するすべてのコインには価格が刻まれています。最後に動いた日の価格です。アンケートでも推計でもなく、チェーンがそのまま記録しています。この刻まれた価格がそのコインの実現価格、別名コストベーシスで、「現在の保有者がいくら払ったか」にオンチェーンで最も近い値です。"], ["軸の読み方", "横軸はいま説明した「コインに刻まれた価格」（ドル）で、今日の価格ではありません。縦軸は各価格帯がその日の全体に占める割合（%）です。% USD モードでは実現時価総額（各コインが最後に動いたときの価値の合計）に対する割合、% BTC モードではすべてのコインに対する割合です。どの日も棒の合計は 100% になるので、同じ高さはどの日でも同じ割合を表します。どちらの軸も 0 から端までを 20 等分して目盛りを付け、ラベルは有効数字 2 桁に丸めています。価格軸は日ごとに合わせ直すことはしません。表示中の日までにデータが到達した最高価格で止まり、データがそこを越えたときだけ広がり、決して縮みません。左軸はその日の最も高い棒で止まるので、毎日の分布が同じ枠いっぱいに描かれます。これを変えられるのは「Y軸上限」の入力欄と「Y 軸を固定」ボタンだけです（「Y軸上限」「Y 軸を固定」を参照）。% BTC モードでは Y軸上限の既定は 99.8 です。最初の棒には、最後に動いた価格が棒 1 本分の幅に満たないコインがすべて入っており、そのうち約 185 万 BTC はビットコインが 50 セントを超える前のもので、ほかのどの棒のおよそ 10 倍あります。99.8 ではこの棒が上端を突き抜け、その高さを上端に ▲ で表示します。100 と入力すれば全体が見えます。"], ["色：コインの古さ", "「年齢」では、どの棒も 23 段階の年齢帯を積み重ねたものです。基準はそのコインが動かずにいた期間で、片端は 1 時間未満、もう片端は 15 年超。黄色が新しく、濃い青が古く、その間は対数で刻まれているため、同じ色の隔たりは同じ年齢の倍率にあたります。色は知覚的に均等な色空間（OKLCH）の一本の経路に沿って並び、どの段差も同じ大きさに見えるよう配置され、明るさは新しいものから古いものへ一様に下がるので、グレースケールでも順序が読み取れます。どの帯も暗い背景に対して 3:1 以上のコントラストを保ちます。単色の高い棒は単一の層、色とりどりの高い棒は世代の異なる保有者が重なっている価格です。"], ["長期/短期か年齢か", "2 組目の切り替えで、棒の色分けを選びます。既定の「長期/短期」は、上の 23 の年齢帯を 150 日を境に二つに合計します。琥珀色の短期保有者（STH）は過去 150 日以内に動いたコイン（4m-5m までの各帯）、青の長期保有者（LTH）は 150 日以上動いていないコイン（5m-6m 以降の各帯）です。150 日は Bitcoin Research Kit による両者の境界で（Glassnode は 155 日）、約 5 か月動かなかったコインは再び動く可能性が大きく下がる、というのが一般的な根拠です。「年齢」は棒を 23 の年齢帯そのもので積み上げます。どちらを選んでも棒、軸、固定した Y 軸は同じで、変わるのは色だけです。短期保有者と長期保有者を合わせると供給全体になります。", "STH = { utxo | age(utxo) < 150 days }\nLTH = { utxo | age(utxo) ≥ 150 days }"], ["白い線：ビットコイン価格", "ビットコイン自身の価格を日足終値で描いたものです。この線だけは別の（非表示の）軸を使っており、左右方向は価格ではなく時間で、選択日の 275 日前から 90 日後までの 1 年間を表します（最新日に近いときは、最新日の 1 週間後で終わり、その分だけ前から始まります）。高さは 0 ドルからそれまでに表示された最高終値までの線形目盛りなので、線はチャートいっぱいに広がり、同じドル幅の値動きは常に同じ高さになります。この目盛りが広がるのは価格が高値を更新したときだけです。オレンジの点が選択日で、過去のサイクル天井と大底も示してあります。点をドラッグすれば履歴をたどれます。凡例の BTC/USD をクリックすると線を隠せます。"], ["棒にカーソルを合わせる", "棒にカーソルを合わせると、その価格、その年齢帯（長期/短期では保有者グループ）がそこに持つ量、棒全体の割合とその量（最終移動時の評価額の合計。% BTC モードでは供給量の合計）、そして全体に占める割合が表示されます。最後の値は累計の割合で、その日の供給全体（% USD モードでは価値全体）のうち、その価格以下で最後に動いた部分です。平滑化した棒ではなく記録された価格そのものから数えるので、破線の位置ではボックスの含み益の割合と一致します。棒から棒へ急に増えるところは供給が密集しています。", "Percent of Total(P) = Σ W(p ≤ P) / Σ W × 100"], ["価格の範囲に印を付ける", "チャート上でクリックしたまま横にドラッグすると、価格の範囲に印を付けられます。なぞった列は 2 本の白い細線に挟まれて印が付いたまま残り、日付やモードを切り替えても、チャートをダブルクリックするか Esc キーを押すまで消えません。印の内側の上端にある、印と同じ幅のボックスには（印が狭くて文字が入らないときは割合だけ）、その日のうちこの範囲で最後に動いた割合（% USD モードでは評価額、% BTC モードではコインの量）が、「全体に占める割合」と同じく記録された価格から数えて表示され、その割合を棒の色分けどおりに分けた値（どれもその日の全体に対する割合で、足すと元の割合になります）も表示されます。年齢では 1 時間未満から 15 年超までの年齢帯ごとにその帯の色で、長期/短期では長期保有者と短期保有者に分けます。ボックスが高くなりすぎるときは短い表記に、それでも収まらなければ範囲とその割合だけにします。長期/短期では、ここにあるコインがすべて長期保有者になるまでの最大日数とその日付も表示します。最も若いコインが最後に動いてから 150 日後です。最も若いコインは、ここにコインを持つ最も若い年齢帯よりも、価格が最後にこの範囲にあった日よりも若くはありません。コインは動いたときに市場で取引された価格を持つからです。短期保有者がいなければ「すでにすべて長期保有者」と表示します。", "Share(a, b) = Σ W(a ≤ P < b) / Σ W × 100\nAll LTH within = 150 − max(youngest band's lowest age, days since the price was last in [a, b))"], ["破線：その日の価格", "選択した日の現在値です。その左側の供給はこの価格より安く最後に動いたので含み益、右側は高く動いたので含み損です。ボックスに価格と両方の割合が出ます。ここでの損益は最後に動いたときの価格が基準で、その移動が購入だった場合にだけ購入価格と一致します（「このチャートで分からないこと」を参照）。", "Profit % = Σ W(P) for P ≤ Spot / Σ W(P) × 100"], ["何を読み取るのか", "棒が厚く固まっている価格は、多くの供給が滞留した場所です。今日の価格より上にあれば、そこで最後に動かした保有者が損益分岐付近で売るかもしれない、という理由から上値抵抗と読まれることが多く、下にあれば同じ塊が支持と読まれます。広い空白は、値動きを鈍らせる供給が乏しい区間です。いずれも供給の分布図であって、価格の予測ではありません。"], ["このチャートで分からないこと", "オンチェーンの移動が必ず売買とは限りません。取引所が自社のコインを動かし、利用者が自分の UTXO をまとめ、カストディアンがウォレットを入れ替える。そのたびにコインはその日の価格で刻み直されますが、買い手も売り手もいません。逆もまた同じで、取引所の内部で約定した取引はチェーンに触れないため、双方とも古い刻印のままです。鍵を失ったコインは永遠にその刻印を保ちます。棒は「供給が最後にここで動いた」ことを示すもので、「誰かがこの値段で買った」証拠ではありません。"], ["履歴をたどる", "公開されている同種のチャートは通常その日だけを表示します。これは 2009-01-03 まで一日ずつさかのぼれます。1D/1W/1M/1Y が刻み幅、矢印ボタンが 1 刻みの移動で、キーボードの左右または A/D でも同じ操作ができます。1〜4 で刻み幅を選び、上下または W/S で刻み幅を一段ずつ上げ下げし（1D・1W・1M・1Y を循環）、Home/End で最初と最後の日へ飛びます。天井/大底からサイクルの天井・大底を選ぶこともできます。どこへ移動しても、左軸はその日の棒に合わせて決まります（「Y軸上限」を参照）。固定している場合は別です（「Y 軸を固定」を参照）。キーが効かなくなったら、チャートを一度クリックしてツールバーの入力欄からフォーカスを外してください。"], ["% USD と % BTC", "% BTC はコインをビットコインの量で数えます。% USD は最後に動いた時点のドル価値で数えるため、10 万ドルで最後に動いた 1 枚は、同じ 1 枚でも 100 ドルで動いたものよりはるかに重くなります。% BTC はコインの在処を、% USD は資金の入った場所を示します。どちらでも、各棒はその日の全体に占める割合として描かれます。% BTC ではすべてのコインに対して、% USD では実現時価総額に対してです。どの日も棒の合計は 100% になるので、左軸はどの日でも同じ意味を持ち、カーソルを合わせると各割合の元になる量が表示されます。", "S(P) = Σ utxo.value where utxo.price ∈ [P, P + ΔP)\nValue When Last Moved(P) = P · S(P)\nShare(P) = W(P) / Σ W × 100   (W = S in % BTC, P · S in % USD)"], ["タイムポケット (TIME POCKETS)", "「タイムポケット」は「Y 軸を固定」の隣にあり、長期/短期でのみ使えます（年齢ではオフです）。短期保有者のいる価格を、左端でそのコインを含む最初の棒から右端の最後の棒まで示し、その範囲をいくつかのポケットに分けます。各ポケットには「XX 日以内に LTH」と表示され、その中で最後に動いたすべてのコインが長期保有者になるまでの最大日数を示します。計算は棒ごとに、価格範囲に印を付けたときと同じです（150 日から、そこにあるコインが取りうる最も若い年齢を引きます。その年齢は、そこにコインがある最も若い年齢帯の下限と、価格が最後にそこにあった日からの日数のうち大きいほうです）。同じポケットの棒は互いに 1 日以内に長期保有者になるので、ラベルは 1 日単位で正確です。短期保有者のいない棒は左隣のポケットに含めます。陰影は時期を表し、明るいポケットほど早く長期保有者になります。隣り合うポケットの間には薄い線、範囲の両端には白い線を引きます。ラベルは価格ボックスの下に 1 列に並び、それぞれ自分のポケットの上にあります。幅が足りれば横書き、縦書きしか入らなければ縦書きで、それも入らない細いポケットは棒のホバーに日数を表示します。ポケットはその日のデータだけで決まり、ウィンドウの大きさによって変わらず、日付を進めたりドラッグしたりすると追従します。オンの間はチャートに印を付けられません。もう一度押すとオフになります。", "XX 日以内に LTH = ポケット内の各棒の 150 − max(最も若い年齢帯の下限, 価格が最後にその棒にあった日からの日数) の最大値（最小値との差は 1 日以内）"], ["Y 軸を固定 (PIN Y-AXIS)", "左軸はその日の棒に合わせて決まるので、移動すると目盛りが変わります。「Y 軸を固定」は、表示中の日の位置で左軸を固定し、破線で示します。以後どの日もその高さ（どの日でもその日の同じ割合）を基準に描かれ、それより高い棒は軸を動かさずに上端を突き抜けます（▲）。固定中は軸の上端を固定値が決めるので、「Y軸上限」の入力欄は使えません。もう一度押せば解除されます。固定値は重み付け、ビン数、スムージングごとに別々に保存されます（年齢と長期/短期は棒が同じなので共通です）。高さが同じ意味を持つのは設定が同じときだけだからです。再読み込みしても残ります。"], ["ビン数", "「ビン数」は、価格軸を何本の等幅の棒に区切るかを決めます。50〜1000 で、既定は動画と同じ 625 です。棒は 0 からちょうどそれまでの最高コストベーシスまで並び（「軸の読み方」を参照）、その先にもう 1 本あって、スムージングがその価格を越えて広げた分を受け止めます（さらに先へ届く分は比例して戻すので、供給は失われません）。625 のとき、棒 1 本はスムージングにかかわらず、0 からそれまでの最高コストベーシスまでのちょうど 1/625 です。2025 年末以降の 125,650 ドルの軸では 201.04 ドルです。表示中の日のこの幅は、「ビン数」欄の数の後ろにドルで出ます（そこでは $201）。ビン数を減らすと棒は太くなり 1 本あたりの量が増え、増やすと細部が細かくなります。棒の幅が変わるのは軸が広がったときか、ビン数を変えたときだけです。棒はピクセル単位に揃え、隣とは 1 ピクセル空けて描き分けますが、幅が 2 ピクセルを切る場合は塗りつぶしで描きます。", "ΔP = highest cost basis so far / bins"], ["スムージング (Smoothing)", "元データは丸められています。各コインにはブロックの価格が、10 万ドル未満は 1 ドル単位、以上は 10 ドル単位で記録されているため、記録された一つの価格は実際には小さな価格幅を表します。大口の送金ひとつが同じ数字に集中すると、丸めが生んだだけの尖りが現れます。スムージングは記録された各価格を、丸められる前の幅に均等に戻したうえで、ベル型の曲線でぼかします。これはガウス曲線で、山や谷を新たに作り出さない唯一のぼかし方です。幅は価格に対する割合で、棒の幅のおよそ 10 分の 4 を下回らず、各棒には自分の取り分が正確に配分されます。既定値の 0.24 は、記録された一つの価格に隠れうる数分の間にビットコイン価格が通常動く幅を、全履歴にわたって測ったものです。0 にすると生のビンになります。総供給量と総額は厳密に保たれます。", "σ = √((S% × price)² + ΔP²/6)   (S = 0: raw)\nbar = the part of [stamp ± step/2] ∗ N(0, σ) inside the bar"], ["Y軸上限 (Y-max)", "左軸の上端を、その日の棒の高さのパーセンタイルで決めます。100 ではその日の最も高い棒が上端に届き、100 未満では軸がそのパーセンタイルで止まり、それより高い棒は上端を突き抜けます。左上の ▲ の数字がそのうち最も高い棒の高さを示し、括弧内はほかに何本あるかを示すので、棒が知らないうちに切り取られることはありません。既定は % USD モードで 100、% BTC モードで 99.8 です。BTC では最初の棒がほかのすべてを押しつぶしてしまうためです（「軸の読み方」を参照）。入力した値はモードごとに保たれます。Y 軸を固定している間は、この欄は使えません。", "y-max = percentileₙ(this day's bars)   (100 = the tallest bar)"], ["ボトムシグナル", "その日の含み損の割合がツールバーで設定したしきい値に達すると、破線と価格ボックスの枠が黄色に変わり、ボックスに達したしきい値を示す 4 行目が加わります。% USD モードではその日の価格より高く最後に動いた評価額の割合で既定は 80%、% BTC モードではコインの量の割合で既定は 50% です。入力した値はモードごとに保たれます。これほど極端な値は、歴史的にはサイクルの底の近くに集まってきました。過去の傾向であって、将来の法則ではありません。", "Signal when In Loss % ≥ Threshold"], ["動画を見る", "ツールバーの「全期間の動画」を押すと開くメニューの「動画 (% USD-長期/短期)」「動画 (% USD-年齢)」「動画 (% BTC-長期/短期)」「動画 (% BTC-年齢)」で、全期間を 1 本にまとめた動画をそれぞれ YouTube で見られます。本ページのその選択の既定どおり（ボトムシグナルを含む）に描かれ、% USD は左軸を毎日の最も高い棒に合わせ、価値が初めてチャートに現れる 2011 年 1 月 31 日から、% BTC は Y軸上限 99.8 で、最初のビットコイン価格がチャートに現れる 2010 年 5 月 18 日から、棒を短期保有者と長期保有者（長期/短期）または年齢帯（年齢）で色分けし、4 本とも最新日まで、隣り合う日をなめらかにつなぎ、5 分・毎秒 60 フレーム・4K（3840 × 2160）です。GitHub のワークフローが週に一度、終わったばかりの一週間を加えて作り直し、renshuBTC チャンネルに投稿します。YouTube で動画を他の人が見られるようになるまでは、メニューのその項目は renshuBTC チャンネルを開きます。このサイトはファイルのダウンロードを提供しません（チャート上のカメラアイコンは、チャートを PNG 画像として保存するだけで、画像はお使いのブラウザーの中で作られます）。ソフトのインストール、ウォレットの接続、シードフレーズの入力を求めることもありません。そうするものは、このサイトではありません。"], ["データの出所", "分布と価格は Bitcoin Research Kit によるもので、フルの Bitcoin Core ノードから導出され、bitview.space 経由で提供されています。URPD は 2020 年 4 月に Renato Shirakashi 氏が考案しました。本版はそこに日次の履歴と年齢による配色を加えたものです。"]]}
};
function updateExplainerLang() {
  var ex = EXPLAINER[lang] || EXPLAINER.en;
  var head = document.getElementById("explainTitle");
  if (head) head.textContent = ex.title;
  var privacy = document.getElementById("privacyLink");
  if (privacy) privacy.textContent = L3("Privacy", "隐私", "プライバシー");
  var terms = document.getElementById("termsLink");
  if (terms) terms.textContent = L3("Terms", "条款", "利用規約");
  var box = document.getElementById("explainBody");
  if (!box) return;
  box.textContent = "";
  for (var i = 0; i < ex.sections.length; i++) {
    var s = ex.sections[i];
    var h = document.createElement("h3"); h.textContent = s[0]; box.appendChild(h);
    var d = document.createElement("div"); d.className = "desc"; d.textContent = s[1]; box.appendChild(d);
    if (s[2]) { var f = document.createElement("div"); f.className = "formula"; f.textContent = s[2]; box.appendChild(f); }
  }
}
updateExplainerLang();

// The only interaction on a phone is a tap on the left or right quarter of the screen,
// which steps the date back or forward. Everything else is deliberately inert: the figure
// is meant to read as a picture, so pinch-zoom, panning, Plotly hover and the modebar are
// all switched off rather than left to compete with the tap for the same touch. Quarters
// rather than a thin strip because this has to be hittable with a thumb without looking,
// and the middle half stays dead so a stray tap never moves the date.
if (IS_MOBILE) (function () {
  var EDGE = 0.25;
  var x0 = null, y0 = null, moved = false;
  // Passive throughout: the viewport is already locked, so nothing here needs to cancel a
  // default, and the listeners stay off the scrolling critical path.
  document.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { x0 = null; return; }
    // The orange dot, the legend, the mode bar and the credit line's links have their own use for a tap; one of
    // them near an edge must not step the date as well.
    var on = e.target && e.target.closest ? e.target.closest("#tracer, .legend, .modebar, a") : null;
    if (on) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false;
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (x0 === null || !e.touches.length) return;
    // A drag is not a tap. Without this a smudged touch near an edge would still fire.
    var t = e.touches[0];
    if (Math.abs(t.clientX - x0) > 12 || Math.abs(t.clientY - y0) > 12) moved = true;
  }, { passive: true });
  document.addEventListener("touchend", function () {
    if (x0 === null || moved) { x0 = null; return; }
    var w = window.innerWidth;
    if (x0 < w * EDGE) goTo(currentIdx - 1);
    else if (x0 > w * (1 - EDGE)) goTo(currentIdx + 1);
    x0 = null;
  }, { passive: true });
  document.addEventListener("touchcancel", function () { x0 = null; }, { passive: true });
})();
</script>
