<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
// A phone gets the chart at desktop proportions rather than a reflowed one: the whole
// figure, legend and credits included, scaled down to fit exactly as a downloaded PNG
// would be. Portrait letterboxes it, which is the point, a landscape picture in a
// portrait window asks to be turned; the height is matched to this device's landscape
// aspect so that turning it fills the screen edge to edge.
(function () {
  // Either the device is phone-sized or the window is. The short edge matters because a
  // phone held in landscape is over 820px wide and would otherwise be handed the desktop
  // toolbar, and the answer must not flip when the user rotates; the window width is kept
  // as well so a narrowed desktop window still behaves as it did before.
  var lo = Math.min(screen.width, screen.height), hi = Math.max(screen.width, screen.height);
  // Device only. Keying off the window as well meant a desktop opened under 820px got the
  // phone treatment permanently, because the class is added once and nothing removes it:
  // widening the window afterwards left the toolbar gone for the rest of the session.
  // A screen of 0x0 (some WebViews) is unknown, not small, so it stays on the desktop path.
  // screen dimensions are CSS pixels, so a 1366x768 laptop reports a short edge of 768 and a
  // 1920x1080 panel at 150% scaling reports 720. Size alone put both in phone mode, which hides
  // the whole toolbar with nothing to bring it back. A coarse pointer is what actually
  // distinguishes the device.
  if (!(lo > 0) || lo > 820) return;
  if (!window.matchMedia("(pointer: coarse)").matches) return;
  var VW = 2000;
  var VH = Math.round(VW * (lo / hi));
  window.__PHONE = { w: VW, h: VH };
  var d = document.documentElement;
  d.classList.add("phone");
  d.style.setProperty("--chartH", VH + "px");
  // Nothing here is meant to be zoomed or panned: the figure is sized to fit and the only
  // gesture is the edge tap. Locking the viewport stops a stray pinch stranding the user
  // on a half-scrolled chart, since there is no toolbar on a phone to reset it with.
  document.querySelector('meta[name="viewport"]').setAttribute("content",
    "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover");
  // The figure is laid out at its full 2000px and then scaled as a whole, rather than being
  // given a narrow box to reflow into, so Plotly never learns it is on a phone and the
  // legend, both axis titles and the credit line survive intact. Contain, not fit-to-width:
  // whichever axis runs out first sets the scale, so the whole figure is always on screen.
  function fit() {
    var s = Math.min(window.innerWidth / VW, window.innerHeight / VH);
    if (!(s > 0)) s = 1;   // scale(NaN) is dropped at computed-value time, leaving it unscaled
    d.style.setProperty("--fit", s.toFixed(5));
  }
  fit();
  addEventListener("resize", fit);
  addEventListener("orientationchange", fit);
})();
</script>

// toolbar's Smoothing set above 0, the mass is instead spread with a Gaussian whose sigma is that percentage of
// the point's price (price noise is proportional to price). Bitcoin Research Kit prices coins at block-level
// prices, in $1 buckets below $100K and $10 buckets above, and one large transfer can land a huge mass on a
// single price, so raw bins show needles; smoothing trades that fidelity for readability (a one-bin kernel
// displaces about 23% of the mass at $200 bins). Mass and USD value are preserved exactly either way, and every
// bin is returned, so each date shows the same number of bars.

  currentIdx = idx;

      if (!mimeType) throw new Error(vt("No supported video format is available.", "没有可用的视频格式。", "対応する動画形式がありません。"));
      fileExt = mimeType.indexOf("mp4") > -1 ? ".mp4" : ".webm";
      recorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 8000000 });
      recorder.ondataavailable = function(e){ if (!finished && e.data.size > 0) chunks.push(e.data); };
      recorder.onerror = function(ev){
        fail(new Error((ev && ev.error && ev.error.name) || vt("Recording failed.", "录制失败。", "録画に失敗しました。")));
      };
      recorder.onstop = function(){
        if (finished) return;
        if (!readyToSave) { fail(new Error(vt("Recording stopped before completion.", "录制未完成即停止。", "録画が完了前に停止しました。"))); return; }
        try {
          var blob = new Blob(chunks, { type: mimeType });
          if (!blob.size) throw new Error(vt("The recording is empty.", "录制的视频为空。", "録画データが空です。"));
          var url = URL.createObjectURL(blob);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
          var a = document.createElement("a");
          a.href = url;
          a.download = "urpd_" + allDates[frameIndices[0]] + "_" + allDates[frameIndices[frameIndices.length - 1]] + "_" + (coinMode ? "btc" : "usd") + modeKey() + fileExt;
          document.body.appendChild(a);
          try { a.click(); } finally { document.body.removeChild(a); }
          setStatus(vt("Saved ", "\u5df2\u4fdd\u5b58 ", "保存しました：") + frameIndices.length + vt(" frames, ", " \u5e27\uff0c", " フレーム、") + (blob.size / 1048576).toFixed(1) + " MB");
          finish(true);
        } catch (e) { fail(e); }
      };
    }
    function encode() {
      if (finished) return;
      setStatus(vt("Encoding ", "\u7f16\u7801 ", "エンコード中：") + frames.length + vt(" frames at ", " \u5e27\uff0c", " フレーム、") + fps + " fps\u2026");
      // MediaRecorder stamps each pushed frame with the wall clock, so frames are pushed on a fixed
      // schedule (start + i / fps). MediaRecorder stamps every pushed frame with the wall clock,
      // so a frame that arrives late bakes that delay into the file as a visible pause. The loop
      // used to decode exactly one frame ahead, which left no slack at all: a blob Chrome had
      // spilled to disk, or a garbage collection, stalled the schedule and the stall was recorded.
      // Decoding now runs several frames ahead, and the buffer is filled before the clock starts,
      // so ordinary hiccups are absorbed instead of reaching the encoder.
      var total = frames.length;
      var i = 0, interval = 1000 / fps;
      var AHEAD = 8;            // decoded frames held ready
      var nextDecode = 0;
      function pump() {
        while (!finished && queue.length < AHEAD && nextDecode < total) {
          (function (k) {
            queue.push(Promise.resolve().then(function() {
              if (finished) return null;
              return createImageBitmap(frames[k]);
            }).then(function (bmp) {
              if (finished) { closeBitmap(bmp); return null; }
              frames[k] = null;   // decoded, so the blob can go now rather than at draw time
              bitmaps.add(bmp);
              return bmp;
            }).catch(function(e) { fail(e); return null; }));
          })(nextDecode++);
        }
      }
      pump();
      Promise.all(queue.slice()).then(function () {
        if (finished) return;
        wakeOn();
        recorder.start(4000);  // hand the encoder output over in pieces rather than one blob at the end
        var start = performance.now();
        function step() {
          if (finished) return;
          pump();
          queue.shift().then(function (im) {
            if (finished || !im) return;
            var wait = Math.max(0, start + i * interval - performance.now());
            later(function () {
              ctx.drawImage(im, 0, 0, W, H);
              requestFrame();
              i++;
              if (i < total) { closeBitmap(im); step(); return; }
              // Hold the final frame for a second, then let the encoder drain before stopping:
              // frames pushed right before stop() are dropped otherwise.
              // Every frame is captured by this point, so cancelling here would bin a finished
              // video rather than save time. Take the option away instead of ignoring it.
              cancelBtn.disabled = true;
              var holdEnd = performance.now() + 1000;
              (function hold() {
                ctx.drawImage(im, 0, 0, W, H);
                requestFrame();
                if (performance.now() < holdEnd) later(hold, interval);
                else later(function () { readyToSave = true; recorder.stop(); }, 1500);
              })();
            }, wait);
          }).catch(fail);
        }
        step();
      }).catch(fail);
    }
    try { prepareRecorder(); } catch (e) { fail(e); return; }
    started = true;
    videoRecording = true; videoCancel = false;
    if (typeof navTimer !== "undefined") { clearTimeout(navTimer); navTimer = null; }
    if (typeof viewRenderTimer !== "undefined") { clearTimeout(viewRenderTimer); viewRenderTimer = null; }
    if (typeof binsInputTimer !== "undefined") { clearTimeout(binsInputTimer); binsInputTimer = null; }
    if (typeof smoothInputTimer !== "undefined") { clearTimeout(smoothInputTimer); smoothInputTimer = null; }
    cancelCurrent = function() { videoCancel = true; finish(false); };
    recBtn.disabled = true; cancelBtn.disabled = false; btn.classList.add("rec"); document.body.classList.add("recording");
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    captureFrames();
  };
})();
// ---- Draggable tracer: grab the dot on the BTC price line and drag it; the URPD follows the date ----
// The dot is a fixed-position element laid over Plotly's marker (Plotly's own drag layer would otherwise
// turn the gesture into a zoom box). While dragging, the overlay window is frozen so the line stays put
// under the cursor; on release it re-centres as usual.
window.tracerDragWindow = null;
(function(){
  var el = document.getElementById("tracer");
  var gd = document.getElementById("chart");
  function axes() { var fl = gd._fullLayout; return fl && fl.xaxis2 && fl.yaxis3 && fl.xaxis2._length ? fl : null; }
  window.placeTracer = function() {
    var fl = axes();
    var data = lastRenderedData; // the dot marks the date the chart is showing
    var spot = data && data.spot;
    if (!fl || !showPriceOverlay || !(spot > 0)) { el.classList.remove("show"); return; }
    var xa = fl.xaxis2, ya = fl.yaxis3;
    var x = xa._offset + xa.d2p(data.dateStr);
    var y = ya._offset + ya.d2p(spot);
    if (!isFinite(x) || !isFinite(y) || x < xa._offset - 8 || x > xa._offset + xa._length + 8) { el.classList.remove("show"); return; }
    var r = gd.getBoundingClientRect();
    // getBoundingClientRect is post-transform, while x and y are in Plotly layout pixels, which
    // on a phone is a 2000px space drawn through scale(var(--fit)). Absent on desktop, so
    // parseFloat("") is NaN and the factor is exactly 1.
    var fit = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fit")) || 1;
    el.style.left = (r.left + x * fit) + "px";
    el.style.top = (r.top + y * fit) + "px";
    el.classList.add("show");
  };
  window.addEventListener("resize", function(){ setTimeout(window.placeTracer, 80); });
  function nearestDateIndex(ds) {
    var lo = 0, hi = allDates.length - 1;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (allDates[mid] < ds) lo = mid + 1; else hi = mid; }
    if (lo > 0) {
      var t = new Date(ds + "T00:00:00Z").getTime();
      if (Math.abs(new Date(allDates[lo - 1] + "T00:00:00Z").getTime() - t) < Math.abs(new Date(allDates[lo] + "T00:00:00Z").getTime() - t)) lo--;
    }
    return lo;
  }
  function indexAtClientX(cx) {
    var fl = axes(); if (!fl) return -1;
    var xa = fl.xaxis2, r = gd.getBoundingClientRect();
    // Convert to layout pixels before subtracting the axis offset, which is not in client space.
    var fit = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fit")) || 1;
    var px = Math.max(0, Math.min(xa._length, (cx - r.left) / fit - xa._offset));
    var ds = String(xa.p2d(px)).slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return -1;
    return nearestDateIndex(ds);
  }
  var dragging = false;
  el.addEventListener("pointerdown", function(e){
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (window.videoRecording) return;
    e.preventDefault(); e.stopPropagation();
    dragging = true;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    el.classList.add("dragging"); document.body.classList.add("tracer-dragging");
    var rng = gd.layout && gd.layout.xaxis2 && gd.layout.xaxis2.range;
    window.tracerDragWindow = rng ? [new Date(String(rng[0]).slice(0, 10) + "T00:00:00Z").getTime(), new Date(String(rng[1]).slice(0, 10) + "T00:00:00Z").getTime()] : null;
  });
  el.addEventListener("pointermove", function(e){
    if (!dragging) return;
    e.preventDefault();
    var idx = indexAtClientX(e.clientX);
    if (idx >= 0 && idx < allDates.length) goTo(idx);
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    el.classList.remove("dragging"); document.body.classList.remove("tracer-dragging");
    window.tracerDragWindow = null;
    // Flush the last target and redraw even when its date is already displayed: its
    // previous render used the frozen drag window, which must now re-centre.
    goTo(currentIdx, true);
  }
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);
  // If setPointerCapture threw, the release never reaches the 14px dot and the drag state,
  // the grabbing cursor and the frozen window would stay set for good.
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  el.addEventListener("dblclick", function(e){ e.preventDefault(); });
})();
var EXPLAINER = {
  en: { title: "How to read this chart", sections: [["Start here","Ask every bitcoin in existence one question: what was bitcoin worth the last time you moved? Sort the answers into price buckets and add up the supply in each. That is this chart. A tall bar is a price where a lot of supply last changed position. A gap is a price where almost none did. The formal name for it is URPD, the UTXO Realised Price Distribution."],["What a UTXO is","Bitcoin has no account balances. It works like cash in a pocket: you hold separate notes, and to pay 12 dollars with a 20 you hand over the whole note and take 8 back as change. Each note is a UTXO, an Unspent Transaction Output. Your wallet balance is only the sum of the notes you happen to hold, and every bar on this chart is built out of them."],["Why every coin carries a price","A UTXO is created inside a block, that block has a timestamp, and that moment has a bitcoin price. So every coin alive today has a price attached to it: the price on the day it last moved. Nothing is surveyed or estimated, the chain records it. That attached price is the coin's realised price, also called its cost basis. It is the closest thing on-chain to what the current holder paid."],["Reading the axes","Along the bottom is that attached price in dollars, not today's price. Up the left is how much supply sits in each price bucket. The right-hand axis, 0 to 100 percent, belongs to the cyan line alone."],["The colours: how old the coins are","Every bar is stacked out of 23 age bands, set by how long the coin has sat unmoved: under an hour at one end, over fifteen years at the other. Yellow is fresh, deep blue is ancient, and the steps between are logarithmic, so equal colour distance is equal multiples of age. Brightness alone carries the order, and the ramp never passes through green, so it still reads in greyscale and with red-green colour blindness. A tall bar in one colour is a single cohort. A tall bar in many colours is a price that generations of holders share."],["The white line: bitcoin's price","Bitcoin's own price, as daily closes on a log scale. It has its own hidden axes, so left to right is time here rather than price, running from 275 days before the selected day to 90 days after it. The orange dot sits on the selected day and past cycle tops and bottoms are marked. Drag the dot to move through history. Click BTC/USD in the legend to hide the line."],["The cyan line: running share","A running total, read on the right-hand axis. At any price it answers one question: what share of the day's supply has a cost basis at or below here? Where it climbs steeply, supply is dense. Where it is flat, there is almost none.","Cum %(P) = Σ W(p ≤ P) / Σ W × 100"],["The dashed line: today's price","The spot price on the selected day. Supply to its left last moved cheaper than today, so it is held at a paper profit. Supply to its right is held at a paper loss. The box gives the price and both shares.","Profit % = Σ W(P) for P ≤ Spot / Σ W(P) × 100"],["What people look for","A thick cluster of bars marks a price where a lot of supply settled. Above today's price such a cluster is often read as overhead resistance, on the reasoning that holders who last moved coins there may sell near break-even. Below today's price the same cluster is read as support. A wide gap is a stretch with little supply to slow a move through it. Treat all of it as a map of where supply sits, not a forecast of where price goes."],["What this chart cannot tell you","A coin moving on-chain is not always a sale. Exchanges shuffle their own coins, people consolidate their own UTXOs, custodians rotate wallets, and each of those restamps coins at that day's price with no buyer and no seller. The reverse is also true: a trade matched inside an exchange never touches the chain, so both sides keep their old stamp. Coins whose keys are lost keep theirs forever. Read a bar as supply that last moved here, not as proof that someone paid this."],["Moving through time","Published versions of this chart usually show only today. This one steps through the whole history, day by day, back to 2009-01-03. 1D/1W/1M/1Y sets the step size and the arrow buttons move one step; Left and Right or A and D do the same from the keyboard. 1 to 4 pick the step size, Home and End jump to the first and last day, and Up and Down or W and S switch between USD and BTC. You can also type a date, or pick a cycle top or bottom from CYCLE TOP/BTM. If the keys stop responding, click the chart once to take focus off a toolbar field."],["USD mode and BTC mode","BTC counts each coin by how much bitcoin it is. USD counts it by what it was worth in dollars at the moment it last moved, so one coin last moved at 100,000 dollars outweighs the same coin last moved at 100. BTC shows where the coins are. USD shows where the money went in.","S(P) = Σ utxo.value where utxo.price ∈ [P, P + ΔP)\nUSD Value at Last Move(P) = P · S(P)"],["Pin scale","Bar heights are rescaled for every day, so two days cannot be compared by eye. PIN SCALE freezes the axis on the day you are viewing and marks its tallest bar with a dashed line, so every other day is drawn against that same height. Press it again to release. Pins are kept separately for each weighting, bin count and smoothing, because a height only means the same thing under the same settings, and they survive a reload."],["Bottom signal","When the share of value held at a loss reaches the threshold set in the toolbar, 80 percent by default, a fourth line appears in the spot-price box and the spot line turns yellow. Readings that extreme have historically clustered near cycle lows. That is a pattern in the past, not a rule about the future.","Signal when Loss% ≥ Threshold"],["Bins","The price axis is cut into equal-width buckets from zero up to the day's highest cost basis. 625 buckets across a 125,000 dollar high is about 200 dollars each; the dollar width and the on-screen width in pixels are shown beside the field. Bars are drawn on whole pixels with a one-pixel gap so neighbours stay distinct, and are drawn solid once they would be thinner than two pixels.","ΔP = highest cost basis / bins"],["Smoothing","The source data is quantised, in one-dollar steps below 100,000 dollars and ten-dollar steps above. A single large transfer can pile onto one exact price and throw up a spike that is an artefact of that rounding. Smoothing spreads each point over a narrow bell curve whose width is a percentage of its own price. 0.3 is the default and a light touch; 0 gives the raw buckets. Total supply and total value are preserved exactly.","σ = S% × price (0 = raw)\nbar(P) = Σ mass · N(P, σ) over the bin"],["Y-max","One enormous bar flattens everything else. Y-max caps the left axis at a percentile of the bar heights: 100 is the tallest bar, and lower values zoom into the rest and clip what pokes above. An explicit Y-max overrides a pinned scale.","y-max = percentileₙ(bar heights)"],["Export a video","The play button records the chart stepping through a date range, one frame per step of the current interval, at 30 frames a second, and saves an MP4 file (WebM where a browser cannot record MP4). A very short range is slowed down so it still lasts a few seconds."],["Where the data comes from","Distributions and prices come from the Bitcoin Research Kit, which derives them from a full Bitcoin Core node, served through bitview.space. URPD was introduced by Renato Shirakashi in April 2020. This version adds the daily history and the age colouring."]] },
  zh: { title: "如何看懂这张图", sections: [["先看这里","向现存的每一枚比特币问同一个问题：你上一次移动时，比特币值多少钱？把答案按价格区间归类，再把各区间的供应量加总，就得到这张图。柱子越高，说明有越多供应最后一次移动发生在那个价位；出现空档，说明几乎没有。它的正式名称是 URPD，即 UTXO 已实现价格分布。"],["什么是 UTXO","比特币没有账户余额，它更像口袋里的现金：你手上是一张张钞票，用 20 元付 12 元时，要把整张递出去，再收回 8 元找零。每一张这样的钞票就是一个 UTXO，即未花费交易输出。钱包余额只是你手上这些钞票的总和，而这张图里的每一根柱子都由它们堆叠而成。"],["为什么每枚币都带着一个价格","UTXO 诞生在某个区块里，区块带有时间戳，那一刻又对应一个比特币价格。所以今天存在的每一枚币身上都贴着一个价格：它最后一次移动那天的价格。这不是问卷调查，也不是估算，而是链上如实记录的。这个价格就是该币的已实现价格，也叫成本基础，是链上最接近“当前持有者付出了多少”的量。"],["坐标轴怎么读","横轴是上面那个贴在币上的价格（美元），不是今天的价格。纵轴是每个价格区间里有多少供应量。右侧 0 到 100% 的轴只属于那条青色线。"],["颜色：币有多老","每根柱子由 23 个币龄分层堆成，依据是这枚币静止了多久，一端不到一小时，另一端超过十五年。黄色最新，深蓝最老，中间按对数分级，所以相同的颜色距离对应相同的年龄倍数。仅凭明暗就能读出先后顺序，而且色带不经过绿色，因此在灰度下以及红绿色盲情况下同样可读。整根柱子只有一种颜色，说明是单一群体；颜色斑驳，说明这个价位上聚集着好几代持有者。"],["白线：比特币价格","比特币自身的价格，按日收盘价、对数刻度绘制。它用的是另一套隐藏坐标：这里的左右方向是时间而不是价格，范围是所选日期之前 275 天到之后 90 天。橙色圆点标出所选当天，历史上的周期顶部与底部也已标注。拖动圆点即可在历史中移动。点击图例中的 BTC/USD 可以隐藏这条线。"],["青线：累计占比","一条累计曲线，读右侧的轴。它回答的问题是：成本基础低于或等于当前价位的供应，占当天总量的多少？曲线陡升处供应密集，走平处则几乎没有供应。","Cum %(P) = Σ W(p ≤ P) / Σ W × 100"],["虚线：当天价格","所选当天的现价。它左边的供应最后一次移动时比今天便宜，因此处于账面盈利；右边的供应处于账面亏损。方框中给出价格以及这两个比例。","Profit % = Σ W(P) for P ≤ Spot / Σ W(P) × 100"],["大家在看什么","密集成团的柱子代表大量供应沉淀在那个价位。若它位于今天价格之上，常被解读为上方阻力，理由是当初在那里移动过币的持有者可能在回本附近卖出；若位于下方，同一团柱子则被解读为支撑。宽阔的空档意味着这一段几乎没有供应去减缓价格穿越。这些都应当视为供应分布的地图，而不是价格走向的预测。"],["这张图不能告诉你什么","链上的一次移动并不等于一次成交。交易所在内部调拨自有币，用户合并自己的 UTXO，托管方轮换钱包，这些都会以当天价格重新打上标记，却没有买方也没有卖方。反过来同样成立：在交易所内部撮合的成交根本不上链，买卖双方身上的旧标记原封不动。私钥丢失的币则会永远保留它们的标记。请把一根柱子读作“供应最后一次在此移动”，而不是“有人以此价成交”。"],["在历史中移动","公开发布的同类图表通常只显示当天。这张图可以逐日回溯整段历史，一直回到 2009-01-03。1D/1W/1M/1Y 设定步长，箭头按钮移动一步，键盘上的左右方向键或 A/D 同样可用。1 到 4 选择步长，Home/End 跳到最早与最新一天，上下方向键或 W/S 在 USD 与 BTC 之间切换。你也可以直接输入日期，或从“周期顶部/底部”中选择某个周期顶部或底部。若按键失灵，在图表上点一下，把焦点从工具栏输入框移开即可。"],["美元模式与 BTC 模式","BTC 模式按币的数量计量。USD 模式按它最后一次移动那一刻的美元价值计量，因此一枚在 10 万美元处最后移动的币，远重于同样一枚在 100 美元处移动的币。BTC 模式显示币在哪里，USD 模式显示钱投在哪里。","S(P) = Σ utxo.value where utxo.price ∈ [P, P + ΔP)\nUSD Value at Last Move(P) = P · S(P)"],["固定刻度 (PIN SCALE)","柱高每天都会重新缩放，因此两天之间无法用肉眼直接比较。PIN SCALE 会把纵轴锁定在当前这一天，并用虚线标出它最高的那根柱子，之后其他日期都按同一高度绘制。再按一次即可解除。固定值按加权方式、分箱数与平滑度分别保存，因为只有在相同设置下柱高才具有相同含义；刷新页面后依然保留。"],["底部信号","当处于亏损的价值占比达到工具栏中设定的阈值（默认 80%）时，现价方框中会多出第四行，现价线也转为黄色。历史上如此极端的读数往往集中出现在周期低点附近。这是过去的规律，不是对未来的保证。","Signal when Loss% ≥ Threshold"],["分箱 (Bins)","价格轴被切成等宽区间，从 0 一直到当天最高的成本基础。在最高约 12.5 万美元时分成 625 个区间，每格约 200 美元；每格的美元宽度与屏幕像素宽度就显示在输入框旁边。柱子对齐到整像素，相邻之间留出一像素间隙以便区分；当柱宽不足两像素时则实心绘制。","ΔP = highest cost basis / bins"],["平滑 (Smoothing)","源数据是量化过的：10 万美元以下按 1 美元一档，以上按 10 美元一档。一笔大额转账可能全部压在同一个精确价位上，形成一根由取整造成的假尖峰。平滑会把每个点摊开成一条窄钟形曲线，其宽度是该点自身价格的一个百分比。默认 0.3，力度很轻；设为 0 则显示原始分箱。总供应量与总价值完全保持不变。","σ = S% × price (0 = raw)\nbar(P) = Σ mass · N(P, σ) over the bin"],["Y 轴上限 (Y-max)","一根特别高的柱子会把其余部分压扁。Y-max 按柱高的百分位数为左轴设定上限：100 即最高的那根柱子，调低则放大其余部分，超出的会被截断。显式设定的 Y-max 优先于已固定的刻度。","y-max = percentileₙ(bar heights)"],["导出视频","播放按钮会录制图表在某个日期区间内逐步推进的过程，按当前步长每步一帧，以每秒 30 帧录制，并保存为 MP4 文件（浏览器不支持时回退为 WebM）。区间很短时会自动放慢，让视频仍有几秒长度。"],["数据来源","分布与价格数据来自 Bitcoin Research Kit，由完整的 Bitcoin Core 节点推导而来，经 bitview.space 提供。URPD 由 Renato Shirakashi 于 2020 年 4 月提出，本版本在其基础上加入了逐日历史与币龄着色。"]] },
  ja: { title: "このチャートの読み方", sections: [["まずはここから","いま存在するすべてのビットコインに同じ質問をします。「最後に動いたとき、ビットコインはいくらでしたか」。その答えを価格帯ごとにまとめ、各帯の供給量を合計したものがこのチャートです。棒が高い価格帯は、多くの供給が最後に動いた場所。空白の価格帯は、ほとんど動かなかった場所です。正式には URPD（UTXO 実現価格分布）と呼ばれます。"],["UTXO とは","ビットコインに口座残高はありません。仕組みはポケットの中の現金に近く、手元にあるのは一枚ずつの紙幣です。20 ドル札で 12 ドル払うには札ごと渡し、8 ドルをお釣りとして受け取ります。この一枚一枚が UTXO、すなわち未使用トランザクションアウトプットです。ウォレットの残高は手元にある札の合計にすぎず、このチャートの棒はすべてそれを積み上げたものです。"],["すべてのコインが価格を持つ理由","UTXO はあるブロックの中で生まれ、そのブロックにはタイムスタンプがあり、その時点にはビットコイン価格があります。つまり今日存在するすべてのコインには価格が刻まれています。最後に動いた日の価格です。アンケートでも推計でもなく、チェーンがそのまま記録しています。この刻まれた価格がそのコインの実現価格、別名コストベーシスで、「現在の保有者がいくら払ったか」にオンチェーンで最も近い値です。"],["軸の読み方","横軸はいま説明した「コインに刻まれた価格」（ドル）で、今日の価格ではありません。縦軸は各価格帯にどれだけの供給があるか。右側の 0〜100% の軸は水色の線だけのものです。"],["色：コインの古さ","どの棒も 23 段階の年齢帯を積み重ねたものです。基準はそのコインが動かずにいた期間で、片端は 1 時間未満、もう片端は 15 年超。黄色が新しく、濃い青が古く、その間は対数で刻まれているため、同じ色の隔たりは同じ年齢の倍率にあたります。順序は明暗だけでも読み取れ、色の並びが緑を通らないので、グレースケールでも赤緑色覚特性でも判別できます。単色の高い棒は単一の層、色とりどりの高い棒は世代の異なる保有者が重なっている価格です。"],["白い線：ビットコイン価格","ビットコイン自身の価格を、日足終値・対数目盛で描いたものです。この線だけは別の（非表示の）軸を使っており、左右方向は価格ではなく時間で、選択日の 275 日前から 90 日後までを表します。オレンジの点が選択日で、過去のサイクル天井と大底も示してあります。点をドラッグすれば履歴をたどれます。凡例の BTC/USD をクリックすると線を隠せます。"],["水色の線：累計シェア","右軸で読む累計曲線です。ある価格において「コストベーシスがそこ以下の供給は、その日の全体の何割か」を答えます。急に立ち上がるところは供給が密集し、平らなところはほとんどありません。","Cum %(P) = Σ W(p ≤ P) / Σ W × 100"],["破線：その日の価格","選択した日の現在値です。その左側の供給は今日より安く最後に動いたので含み益、右側は含み損の状態です。ボックスに価格と両方の割合が出ます。","Profit % = Σ W(P) for P ≤ Spot / Σ W(P) × 100"],["何を読み取るのか","棒が厚く固まっている価格は、多くの供給が滞留した場所です。今日の価格より上にあれば、そこで最後に動かした保有者が損益分岐付近で売るかもしれない、という理由から上値抵抗と読まれることが多く、下にあれば同じ塊が支持と読まれます。広い空白は、値動きを鈍らせる供給が乏しい区間です。いずれも供給の分布図であって、価格の予測ではありません。"],["このチャートで分からないこと","オンチェーンの移動が必ず売買とは限りません。取引所が自社のコインを動かし、利用者が自分の UTXO をまとめ、カストディアンがウォレットを入れ替える。そのたびにコインはその日の価格で刻み直されますが、買い手も売り手もいません。逆もまた同じで、取引所の内部で約定した取引はチェーンに触れないため、双方とも古い刻印のままです。鍵を失ったコインは永遠にその刻印を保ちます。棒は「供給が最後にここで動いた」ことを示すもので、「誰かがこの値段で買った」証拠ではありません。"],["履歴をたどる","公開されている同種のチャートは通常その日だけを表示します。これは 2009-01-03 まで一日ずつさかのぼれます。1D/1W/1M/1Y が刻み幅、矢印ボタンが 1 刻みの移動で、キーボードの左右または A/D でも同じ操作ができます。1〜4 で刻み幅を選び、Home/End で最初と最後の日へ飛び、上下または W/S で USD と BTC を切り替えます。日付を直接入力するか、天井/大底からサイクルの天井・大底を選ぶこともできます。キーが効かなくなったら、チャートを一度クリックしてツールバーの入力欄からフォーカスを外してください。"],["USD モードと BTC モード","BTC はコインをビットコインの量で数えます。USD は最後に動いた時点のドル価値で数えるため、10 万ドルで最後に動いた 1 枚は、同じ 1 枚でも 100 ドルで動いたものよりはるかに重くなります。BTC はコインの在処を、USD は資金の入った場所を示します。","S(P) = Σ utxo.value where utxo.price ∈ [P, P + ΔP)\nUSD Value at Last Move(P) = P · S(P)"],["スケール固定 (PIN SCALE)","棒の高さは日ごとに再スケールされるため、二つの日を目で比べることはできません。PIN SCALE は表示中の日で軸を固定し、その日の最も高い棒を破線で示します。以後どの日も同じ高さを基準に描かれます。もう一度押せば解除されます。固定値は重み付け・ビン数・スムージングごとに別々に保存されます。高さが同じ意味を持つのは設定が同じときだけだからです。再読み込みしても残ります。"],["ボトムシグナル","含み損の価値の割合がツールバーで設定したしきい値（既定 80%）に達すると、現在値ボックスに 4 行目が現れ、現在値の線が黄色に変わります。これほど極端な値は、歴史的にはサイクルの底の近くに集まってきました。過去の傾向であって、将来の法則ではありません。","Signal when Loss% ≥ Threshold"],["ビン (Bins)","価格軸は 0 からその日の最高コストベーシスまで等幅に区切られます。最高値が 12.5 万ドルのときに 625 分割すれば 1 区間は約 200 ドル。ドル幅と画面上のピクセル幅は入力欄の横に表示されます。棒はピクセル単位に揃え、隣とは 1 ピクセル空けて描き分けますが、幅が 2 ピクセルを切る場合は塗りつぶしで描きます。","ΔP = highest cost basis / bins"],["スムージング (Smoothing)","元データは量子化されています。10 万ドル未満は 1 ドル刻み、以上は 10 ドル刻みです。大口の送金ひとつが同じ価格に集中すると、丸めが生んだだけの尖りが現れます。スムージングは各点を、その点自身の価格に対する割合を幅とする細いベル型に広げます。既定値は 0.3 でごく軽く、0 にすると生のビンになります。総供給量と総額は厳密に保たれます。","σ = S% × price (0 = raw)\nbar(P) = Σ mass · N(P, σ) over the bin"],["Y軸上限 (Y-max)","飛び抜けて高い棒が一本あると、ほかがすべて潰れて見えます。Y-max は棒の高さのパーセンタイルで左軸に上限を与えます。100 が最も高い棒で、下げるほど残りを拡大し、はみ出した分は切り取られます。明示した Y-max は固定スケールより優先されます。","y-max = percentileₙ(bar heights)"],["動画の書き出し","再生ボタンを押すと、指定した期間をチャートが進む様子を、現在の刻み幅で 1 ステップ 1 フレームずつ、毎秒 30 フレームで録画し、MP4 ファイルとして保存します（対応していないブラウザでは WebM）。期間がごく短い場合は自動的に遅くして、数秒の長さを保ちます。"],["データの出所","分布と価格は Bitcoin Research Kit によるもので、フルの Bitcoin Core ノードから導出され、bitview.space 経由で提供されています。URPD は 2020 年 4 月に Renato Shirakashi 氏が考案しました。本版はそこに日次の履歴と年齢による配色を加えたものです。"]] }
};
EXPLAINER.en.sections.splice(13, 0, ["RAW", "RAW keeps your selected USD or BTC mode, and you can still switch between them. Both use 625 bins and no smoothing (0.0). Y-max is 99.8 in BTC and 100 in USD. RAW hides the cumulative share and historical BTC price lines, removes the price/profit/loss box, and disables the bottom signal. The white dashed spot line remains and follows the selected date. PIN SCALE remains available: press it to fix the axis at the selected day's tallest bar, or press it again to return to the preset percentile. BTC and USD pins are saved separately. Bins, smoothing, and the Y-max input stay locked while RAW is selected. Press RAW again to restore your previous settings."]);
EXPLAINER.zh.sections.splice(13, 0, ["RAW", "RAW 保留当前选择的 USD 或 BTC 模式，仍可在两者之间切换。两种模式均固定为 625 分箱和平滑 0.0。Y 轴上限在 BTC 中为 99.8，在 USD 中为 100。累计占比线和 BTC 历史价格线不显示，价格及盈亏占比框也不显示，底部信号停用。白色当前价格虚线保留，并随所选日期移动。PIN SCALE 仍可使用：点击可将纵轴固定在所选日期最高柱的高度，再次点击恢复预设百分位。BTC 和 USD 的固定刻度分别保存。RAW 开启时分箱、平滑和 Y 轴上限输入框不可修改，再次点击 RAW 即可恢复之前的设置。"]);
EXPLAINER.ja.sections.splice(13, 0, ["RAW", "RAW は選択中の USD または BTC モードを維持し、両者は引き続き切り替えられます。どちらも 625 ビン、平滑化 0.0 に固定されます。Y軸上限は BTC が 99.8、USD が 100 です。累計シェア線と BTC の過去価格線、価格と含み益・含み損のボックスを非表示にし、ボトムシグナルを無効にします。白い破線の現在価格線は残り、選択した日付に合わせて移動します。PIN SCALE は使用できます。押すと選択日の最も高い棒で軸を固定し、もう一度押すと既定のパーセンタイルに戻ります。BTC と USD の固定値は別々に保存されます。RAW の間はビン数・平滑化・Y軸上限の入力を変更できません。もう一度 RAW を押すと以前の設定に戻ります。"]);
function updateExplainerLang() {
  var ex = EXPLAINER[lang] || EXPLAINER.en;
  var head = document.getElementById("explainTitle");
  if (head) head.textContent = ex.title;
  var box = document.getElementById("explainBody");
  if (!box) return;
  box.textContent = "";
  for (var i = 0; i < ex.sections.length; i++) {
    var s = ex.sections[i];
    var h = document.createElement("h3"); h.textContent = s[0]; box.appendChild(h);
    var d = document.createElement("div"); d.className = "desc"; d.textContent = s[1]; box.appendChild(d);
    if (s[2]) { var f = document.createElement("div"); f.className = "formula"; f.textContent = s[2]; box.appendChild(f); }
  }
}
updateExplainerLang();

// The only interaction on a phone is a tap on the left or right quarter of the screen,
// which steps the date back or forward. Everything else is deliberately inert: the figure
// is meant to read as a picture, so pinch-zoom, panning, Plotly hover and the modebar are
// all switched off rather than left to compete with the tap for the same touch. Quarters
// rather than a thin strip because this has to be hittable with a thumb without looking,
// and the middle half stays dead so a stray tap never moves the date.
if (IS_MOBILE) (function () {
  var EDGE = 0.25;
  var x0 = null, y0 = null, moved = false;
  // Passive throughout: the viewport is already locked, so nothing here needs to cancel a
  // default, and the listeners stay off the scrolling critical path.
  document.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false;
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (x0 === null || !e.touches.length) return;
    // A drag is not a tap. Without this a smudged touch near an edge would still fire.
    var t = e.touches[0];
    if (Math.abs(t.clientX - x0) > 12 || Math.abs(t.clientY - y0) > 12) moved = true;
  }, { passive: true });
  document.addEventListener("touchend", function () {
    if (x0 === null || moved) { x0 = null; return; }
    var w = window.innerWidth;
    if (x0 < w * EDGE) goTo(currentIdx - 1);
    else if (x0 > w * (1 - EDGE)) goTo(currentIdx + 1);
    x0 = null;
  }, { passive: true });
  document.addEventListener("touchcancel", function () { x0 = null; }, { passive: true });
})();
</script>
</body>
</html>
