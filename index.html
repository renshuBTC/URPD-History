<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-qm/eCTDXS3dFBzwiBUEf1Ew8IOQYh7XDrxbk5MQihDQ=' 'sha256-8d9Tu01hDkAtEZbaLFdN+f+Y55yUoAwkQYQU9Dnxrto=' 'sha256-vHcaA9ECZIzPnPZW1yru9oPooq3wuyogpvDnIBXi6BM=' https://cdn.plot.ly/plotly-2.27.0.min.js; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://bitview.space; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
// A phone gets the chart at desktop proportions rather than a reflowed one: the whole
// figure, legend and credits included, scaled down to fit exactly as a downloaded PNG
// would be. Portrait letterboxes it, which is the point, a landscape picture in a
// portrait window asks to be turned; the height is matched to this device's landscape
// aspect so that turning it fills the screen edge to edge.
(function () {
  // Either the device is phone-sized or the window is. The short edge matters because a
  // phone held in landscape is over 820px wide and would otherwise be handed the desktop
  // toolbar, and the answer must not flip when the user rotates; the window width is kept
  // as well so a narrowed desktop window still behaves as it did before.
  var lo = Math.min(screen.width, screen.height), hi = Math.max(screen.width, screen.height);
  // Device only. Keying off the window as well meant a desktop opened under 820px got the
  // phone treatment permanently, because the class is added once and nothing removes it:
  // widening the window afterwards left the toolbar gone for the rest of the session.
  // A screen of 0x0 (some WebViews) is unknown, not small, so it stays on the desktop path.
  // screen dimensions are CSS pixels, so a 1366x768 laptop reports a short edge of 768 and a
  // 1920x1080 panel at 150% scaling reports 720. Size alone put both in phone mode, which hides
  // the whole toolbar with nothing to bring it back. A coarse pointer is what actually
  // distinguishes the device.
  // A phone's short edge is at most about 480 CSS px; a tablet's is 700 or more (an iPad mini is 744). At the old
  // limit of 820 every iPad up to the Air got the phone view, which has no toolbar at all.
  if (!(lo > 0) || lo > 600) return;
  if (!window.matchMedia("(pointer: coarse)").matches) return;
  var VW = 2000;
  var VH = Math.round(VW * (lo / hi));
  window.__PHONE = { w: VW, h: VH };
  var d = document.documentElement;
  d.classList.add("phone");
  d.style.setProperty("--chartH", VH + "px");
  // Nothing here is meant to be zoomed or panned: the figure is sized to fit and the only
  // gesture is the edge tap. Locking the viewport stops a stray pinch stranding the user
  // on a half-scrolled chart, since there is no toolbar on a phone to reset it with.
  document.querySelector('meta[name="viewport"]').setAttribute("content",
    "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover");
  // The figure is laid out at its full 2000px and then scaled as a whole, rather than being
  // given a narrow box to reflow into, so Plotly never learns it is on a phone and the
  // legend, both axis titles and the credit line survive intact. Contain, not fit-to-width:
  // whichever axis runs out first sets the scale, so the whole figure is always on screen.
  function fit() {
    var s = Math.min(window.innerWidth / VW, window.innerHeight / VH);
    if (!(s > 0)) s = 1;   // scale(NaN) is dropped at computed-value time, leaving it unscaled
    d.style.setProperty("--fit", s.toFixed(5));
  }
  fit();
  addEventListener("resize", fit);
  addEventListener("orientationchange", fit);
})();
</script>

<style>

    yMax: yMaxPct, yMaxByMode: yMaxByMode.slice(), yMaxExplicit: yMaxExplicit.slice(),
    threshold: bottomThreshold, priceOverlay: showPriceOverlay };
}
function restoreChartSettings(s) {
  viewIdx = s.viewIdx; coinMode = s.coinMode; NUM_BINS = s.bins; KERNEL_PCT = s.smoothing;
  yMaxPct = s.yMax; yMaxByMode = s.yMaxByMode.slice(); yMaxExplicit = s.yMaxExplicit.slice();
  bottomThreshold = s.threshold; showPriceOverlay = s.priceOverlay;
}
// Make the toolbar show the settings in force (after a change that could not be drawn is rolled back).

  document.getElementById("btnBTC").classList.toggle("active", coinMode);
  document.getElementById("btnUSD").setAttribute("aria-pressed", String(!coinMode));
  document.getElementById("btnBTC").setAttribute("aria-pressed", String(coinMode));

function setInterval1(idx) {

// Fetch whatever raw series the current view needs for a date (all supply, plus the age cohorts) and
// keep them in rawCache so Bins / Smoothing changes re-bin locally instead of re-downloading.
function fetchRaw(dateStr) {
  var key = dateStr + modeKey();
  if (rawInflight[key]) return rawInflight[key];
  var raw = rawTouch(dateStr);
  // The 23 age cohorts partition the same UTXO set as the "all" series. Checked on
  // 2021-07-14: summing them reproduces "all" across all 32,578 prices, with a maximum
  // per-price difference of 0 BTC. Fetching "all" on top of them cost 37% of the payload
  // (705 KB of 1,921 KB), and because the cohort requests were chained behind it, a whole
  // extra round trip before any of them could start. It is summed from the cohorts instead.
  if (!raw.cohorts) raw.cohorts = [];
  // Retain successful siblings and share pending ones when one cohort fails. A retry
  // downloads only the missing cohorts; raw.age/all are published only when complete.
  var p = (raw.age ? Promise.resolve(raw.age) : Promise.all(AGE_BANDS.map(function(band, ci) {
      if (raw.cohorts[ci]) return raw.cohorts[ci];
      if (!isDateString(dateStr)) return Promise.reject(pageError(function() { return t("errNotDate") + dateStr; }));
      var cohortPromise = fetchJSON(BASE + "/api/series/cost-basis/" + band.cohort + "/" + dateStr).then(cleanCohort);
      raw.cohorts[ci] = cohortPromise;
      cohortPromise.then(function(value) { raw.cohorts[ci] = value; }, function() { delete raw.cohorts[ci]; });
      // Empty cohorts return 200 with {}. A 404 is a failure, never an empty band.
      return cohortPromise;
    }))).then(function(res) {
    raw.age = res;
    if (!raw.all) {
      var all = {};
      for (var ci = 0; ci < res.length; ci++) {
        var c = res[ci];
        if (!c) continue;
        for (var pr in c) all[pr] = (all[pr] || 0) + c[pr];
      }
      raw.all = all;
    }
    return raw;
  });
  rawInflight[key] = p;
  p.then(function(){ delete rawInflight[key]; }, function(){ delete rawInflight[key]; });
  return p;
}

// Bin the raw series with the current Bins / Smoothing settings.
function buildData(dateStr, raw) {
  var rawAll = raw.all;
  var spot = getSpotFromCache(dateStr);
  var maxPrice = 0; // the day's highest stamp holding any supply
  for (var pk in rawAll) { var pv = parseFloat(pk); if (pv > maxPrice && rawAll[pk] > 0) maxPrice = pv; }
  // The price axis only grows (see xAxisEnd), so the bins divide the axis so far, not the day's own range. It is
  // never below $1: before BTC first traded above 50 cents every stamp is $0, and a zero width once made every
  // bin index NaN, which silently dropped the whole day's supply.
  var binWidth = xAxisEnd(dateStr, maxPrice, spot) / NUM_BINS;
  var cohorts = [], res = raw.age || [];
  for (var ci = 0; ci < AGE_BANDS.length; ci++) {
    var r = res[ci];
    if (!r) continue;
    var ks = Object.keys(r), sup = 0, rc = 0;
    for (var kk = 0; kk < ks.length; kk++) { var pp = parseFloat(ks[kk]); if (isNaN(pp)) continue; sup += r[ks[kk]]; rc += pp * r[ks[kk]]; }
    cohorts.push({ label: AGE_BANDS[ci].label, color: AGE_BAND_COLORS[ci], agg: aggregate(r, binWidth), supply: sup, rc: rc });
  }
  // The 23 cohorts partition the whole supply (see fetchRaw), so with all of them here the total is their sum,
  // which halves the binning work. Otherwise it is binned directly.
  var aggAll;
  if (cohorts.length === AGE_BANDS.length) {
    aggAll = cohorts[0].agg.map(function(b) { return { price: b.price, supply: 0, invested: 0 }; });
    cohorts.forEach(function(c) { c.agg.forEach(function(b, i) { aggAll[i].supply += b.supply; aggAll[i].invested += b.invested; }); });
  } else {
    aggAll = aggregate(rawAll, binWidth);
  }
  var data = { dateStr: dateStr, spot: spot, aggAll: aggAll, binWidth: binWidth, maxPrice: maxPrice, numBins: NUM_BINS, kernelPct: KERNEL_PCT };
  data.realizedCap = aggAll.reduce(function(s,b){return s+b.invested;}, 0);
  data.totalSupply = aggAll.reduce(function(s,b){return s+b.supply;}, 0);
  data.redPct = computeRedPct(rawAll, spot);
  data.redPctCoin = computeRedPct(rawAll, spot, true);
  data.aggAge = cohorts.length ? cohorts : null;
  return data;
}

function showData(data) {
  var shownSeq = renderSeq;
  return renderChart(data).then(function() {
    if (shownSeq === renderSeq && lastRenderedData === data) document.getElementById("loading").style.display = "none";
  });
}

// Stepping to a new date paid a full network round trip before anything could be drawn,
// while the drawing itself costs about 60 ms: the wait was almost entirely network. Dates
// are walked in a direction, so the next few are predictable. Fetching them while the user
// is still looking at the current one turns the next step into a cache hit, measured at
// 957 ms cold against 115-133 ms once a direction is established.
var PREFETCH_AHEAD = 2;
var prefetchPrev = null, prefetchPending = false;
function schedulePrefetch() {
  if (prefetchPending) return;
  prefetchPending = true;
  var run = function() {
    prefetchPending = false;
    // Both of these are read when the timer fires, not when it was armed. Capturing them at
    // arm time meant that during fast stepping every call inside the 250 ms window returned
    // early, and the one call that did arm the timer left a stale base behind, so the whole
    // burst was spent requesting dates the user had already gone past.
    var base = currentIdx;
    // With nothing to compare against, guess away from whichever end we are sitting on; the
    // app opens on the last date, where guessing forward prefetches nothing at all.
    var dir = (prefetchPrev === null || base === prefetchPrev)
      ? (base >= allDates.length - 1 ? -1 : 1)
      : (base > prefetchPrev ? 1 : -1);
    prefetchPrev = base;
    // The next steps of the selected size: prefetching the neighbouring days while stepping by a month or a year
    // spent 23 requests a date on days the user was about to jump over.
    var k = 0, j = base;
    (function next() {
      if (k++ >= PREFETCH_AHEAD) return;
      j = stepTarget(j, dir);
      if (j < 0 || j >= allDates.length) return;
      if (rawComplete(rawCache[allDates[j]])) { next(); return; }
      // One date at a time. Each is 23 requests, and the date the user is actually looking
      // at must never end up queued behind a speculative one. Failures are swallowed: the
      // real load for that date will repeat the request and report it properly.
      fetchRaw(allDates[j]).then(next, function(){});
    })();
  };
  setTimeout(run, 250);
}
function loadAndRender(propagateErrors) {
  // The toolbar is live from first paint but allDates is empty until three network calls in
  // init() finish. Clicking BTC or the language button in that window fired 23 requests for
  // the date "undefined" and surfaced an HTTP 400.
  if (!allDates.length) return Promise.resolve();
  var dateStr = allDates[currentIdx];
  var mySeq = ++renderSeq;
  schedulePrefetch();
  // Every path, including cache hits, awaits the completed Plotly render, so a caller that
  // needs to know never mistakes a downloaded response, or a rejected draw, for a drawn date.
  return Promise.resolve().then(function() {
    if (mySeq !== renderSeq) return;
    var key = dataKey(dateStr);
    if (cache[key]) return showData(cache[key]);
    var raw = rawCache[dateStr];
    var ready;
    if (rawComplete(raw)) {
      rawTouch(dateStr);
      ready = Promise.resolve(raw);
    } else {
      document.getElementById("loading").style.display = "block";
      ready = fetchRaw(dateStr);
    }
    return ready.then(function(loaded) {
      if (mySeq !== renderSeq) return;
      var data = buildData(dateStr, loaded);
      cacheSet(dataKey(dateStr), data);
      return showData(data);
    });
  }).catch(function(e) {
    if (mySeq !== renderSeq) return; // superseded: a newer render already owns currentIdx
    // Nothing was drawn, so currentIdx has to go back to the date the chart is still showing.
    // Left on the failed date it desynchronises the next step, the n/N counter and
    // rerenderCurrent(), which looks up the cache entry for allDates[currentIdx] and finds
    // none — silently killing Pin scale, Bottom signal and Y-max until you navigate again.
    var previous = lastRenderedData;
    if (previous) {
      var back = allDates.indexOf(previous.dateStr);
      if (back >= 0) currentIdx = back;
    }
    // With nothing on screen yet there is no chart to fall back to: keep the message up and say which day failed.
    showNotice(function() {
      var msg = t("errPrefix") + errorText(e);
      return previous ? msg : msg.replace(/[.\u3002]?$/, L3(". ", "\u3002", "\u3002")) + retryHint();
    }, !previous);
    if (!previous) document.getElementById("dateDisplay").textContent = allDates[currentIdx] + " " + (currentIdx + 1) + "/" + allDates.length;
    document.getElementById("loading").style.display = "none";
    // An older Plotly draw may already be running. Put the rollback behind it so the
    // visible graph and the restored navigation date agree even after that draw finishes.
    var recovery = previous;
    if (previous && (previous.numBins !== NUM_BINS || previous.kernelPct !== KERNEL_PCT)) {
      if (rawComplete(rawCache[previous.dateStr])) {
        recovery = buildData(previous.dateStr, rawCache[previous.dateStr]);
        cacheSet(dataKey(previous.dateStr), recovery);
      } else if (lastRenderedSettings) {
        // A new bin count or smoothing that could not be drawn, with no raw series to re-bin the chart on screen:
        // the settings go back to the ones it was drawn with, and the toolbar says so.
        restoreChartSettings(lastRenderedSettings);
        syncControls();
      }
    }
    var restored = recovery ? renderChart(recovery).catch(function() {}) : Promise.resolve();
    return restored.then(function() { if (propagateErrors) throw e; });
  });
}

var chartRenderSeq = 0, chartRenderPromise = Promise.resolve();
function renderChart(data) {
  var plotSeq = ++chartRenderSeq, navigationSeq = renderSeq;
  function draw() {
    if (plotSeq !== chartRenderSeq || navigationSeq !== renderSeq) return;
    reflowCount = 0;
    return drawChart(data, plotSeq, navigationSeq);
  }
  // Plotly mutates one shared graph. Serialize actual draws and skip obsolete queued
  // work so an older asynchronous render cannot overwrite the newest chart.
  var pending = chartRenderPromise.then(draw, draw);
  chartRenderPromise = pending.catch(function() {});
  return pending;
}

function drawChart(data, plotSeq, navigationSeq) {
  var drawnSettings = captureChartSettings();
  var renderedPeakKey = peakKey(data);
  var dateStr = data.dateStr, spot = data.spot, aggAll = data.aggAll, binWidth = data.binWidth;
  // ---- Bar separators -------------------------------------------------------------------------------
  // Plotly snaps every bar edge to a whole pixel (bargap 0). Each bar is narrowed by exactly one pixel of
  // the bin pitch, so after snapping every gap is exactly 1 px wide whatever the bin count or window width;
  // a fractional gap is what produced the uneven seams before. Below a 3 px pitch (bars under 2 px) the
  // bars are drawn solid. The x-range is pinned to the binned span so the pitch is exact, and the chart is
  // re-drawn on resize so the gap follows the new pitch. The data is untouched: only the drawn width changes.
  var xSpan = aggAll.length * binWidth;
  if (spot > xSpan) xSpan = spot * 1.01;
  var plotW = plotWidthPx();
  var pitch = xSpan > 0 ? plotW * binWidth / xSpan : 0;
  var barW = pitch >= 3 ? binWidth * (pitch - 1) / pitch : binWidth;
  lastPlotW = plotW;
  // Bottom margin: tick labels, then the axis title; the credit line shares the axis-title row (left-aligned,
  // the title is centred) when the plot is wide enough for the two not to meet, otherwise it goes underneath.
  // Measured from the text (monospace: 0.6 em a character, a full em for CJK), since a fixed width stopped
  // being enough the day the credit line grew and the two overlapped at 1600 px.
  // Every name in it links to its X account (creditLink: Plotly draws an <a> in an annotation as a link).
  var BV = creditLink("Bitview.space"), BC = creditLink("Bitcoin Core");
  var creditNames = ["Antoine Le Calvez", "Renato Shirakashi", "James Check", "@_nym21_"].map(creditLink);
  var creditLinked = [L3("Powered by " + BV + " & " + BC + ".", "由 " + BV + " 和 " + BC + " 提供支持。", BV + " と " + BC + " を利用。"),
    L3("Credits: " + creditNames.join(", "), "鸣谢：" + creditNames.join("、"), "クレジット：" + creditNames.join("、"))];
  var creditParts = creditLinked.map(function(part) { return part.replace(/<[^>]*>/g, ""); });   // what is measured
  var creditText = creditParts.join(L3(" ", "", ""));
  var textPx = function(str, size) { var w = 0; for (var ci = 0; ci < str.length; ci++) w += str.charCodeAt(ci) > 0x2e7f ? size : 0.6 * size; return w; };
  // 7% of slack: Chrome on Linux rounds 11 px Source Code Pro up to 7 px a character, and at 1680 px the credit
  // then ran into the axis title.
  var creditRow = textPx(creditText, 11) * 1.07 + 16 <= plotW / 2 - textPx(t("priceUSD"), 13) / 2;
  // Underneath, it has from the plot's left edge to just inside the figure's right one. On a plot too narrow even
  // for that (a portrait tablet) it takes two lines, and only if a line is still too long does its type shrink.
  var creditRoom = plotW + 20, creditWrap = !creditRow && textPx(creditText, 11) * 1.07 > creditRoom;
  var creditShown = creditLinked.join(creditWrap ? "<br>" : L3(" ", "", ""));
  var creditWidest = (creditWrap ? Math.max(textPx(creditParts[0], 11), textPx(creditParts[1], 11)) : textPx(creditText, 11)) * 1.07;
  var creditSize = creditWidest > creditRoom ? Math.max(8, Math.floor(110 * creditRoom / creditWidest) / 10) : 11;
  var bottomMargin = creditRow ? 44 : creditWrap ? 78 : 64;
  var binsText = "$" + (binWidth >= 100 ? Math.round(binWidth).toLocaleString("en-US") : binWidth >= 1 ? binWidth.toFixed(1) : binWidth.toFixed(3)); // a bar's width in dollars
  var realizedCap = data.realizedCap, totalSupply = data.totalSupply, maxPrice = data.maxPrice, redPct = data.redPct;
  var isAge = !!(data.aggAge && data.aggAge.length > 0); // false only if every cohort fetch failed
  var isCoin = coinMode;
  var isBottom = redPct !== null && redPct >= bottomThreshold;

  // The status bar only reports the loaded range; the bottom signal is shown in the spot-price box.

  var dateText = (allDates.indexOf(dateStr) + 1) + "/" + allDates.length;

  var traces = [];
  var hp = t("hoverPrice"), hpt = t("hoverPctTotal");
  // A bar's price in the hover keeps its cents while bars are under a dollar wide (2010-11), where "$1" covered
  // every bar from $0.50 to $1.50.
  var xFmt = binWidth < 1 ? ",.2f" : ",.0f";
  // Bar totals as the left axis reads them (see barValues), and at each price the running share of the day's
  // total: how much of all the supply (BTC) or value (USD) last moved at or below that price. That share used
  // to be drawn as a line on an axis of its own; it now sits in every bar's hover, under the whole bar's total.
  var valuesForAxis = barValues(data, isCoin);
  var chartPrices = aggAll.map(function(b){ return b.price; });
  var totalV = valuesForAxis.reduce(function(s,v){return s+v;},0) || 1, runV = 0;
  var hoverData = valuesForAxis.map(function(v){ runV += v; return [v, 100 * runV / totalV]; });
  var totLbl = isCoin ? t("hoverTotalBTC") : t("hoverTotalUSD");
  var hoverTail = "<br>" + totLbl + (isCoin ? "%{customdata[0]:,.2f} BTC" : "%{customdata[0]:$,.0f}") +
    "<br>" + hpt + "%{customdata[1]:.1f}%<extra></extra>";
  if (isAge) {
    // Each cohort is its own stacked trace, so hovering a bar only told you what that one age band holds. The
    // number people read a URPD for is the whole bar, so every band's hover also gives the whole bar's total
    // and its running share. Plotly reads customdata positionally against x, so one array serves every
    // cohort trace, and sharing the one reference keeps it cheap.
    data.aggAge.forEach(function(c) {
      var vals = smooth(c.agg.map(function(b){ return isCoin ? b.supply : b.invested; }));
      traces.push({x:chartPrices,y:vals,type:"bar",name:c.label,width:Array(chartPrices.length).fill(barW),marker:{color:c.color,line:{width:0}},customdata:hoverData,hovertemplate:hp+"%{x:"+xFmt+"}<br>"+c.label+": "+(isCoin?"%{y:,.2f} BTC":"%{y:$,.0f}")+hoverTail});
    });
  } else {
    traces.push({x:chartPrices,y:valuesForAxis,type:"bar",meta:"all",name:t("allSupply"),width:Array(chartPrices.length).fill(barW),marker:{color:FALLBACK_COLOR,line:{width:0}},customdata:hoverData,hovertemplate:hp+"%{x:"+xFmt+"}"+hoverTail});
  }

  // ---- Left axis -------------------------------------------------------------------------------------
  // It ends exactly at the tallest bar so far (see "Axes that only grow"), so it moves only when a bar goes
  // above it, never comes down, and on any date shows what it showed the first time you were there. In BTC
  // the first bar (from $0 to one bar width) does not count: it holds every coin last moved while bitcoin
  // was worth less than that, 1.85M BTC of it from before bitcoin traded above 50 cents, around ten times any
  // other bar, and counting it would flatten the whole history under one bar. It runs off the top with its
  // height printed there.
  var skipFirst = isCoin;
  var dayTop = axisLevel(valuesForAxis, skipFirst, 100);
  var dayPeak = dayTop; // publish only after the chart has actually been drawn
  var peak = peakStore[renderedPeakKey] || null;
  var yClipped = false, maxVal;
  if (yMaxPct < 100) {
    // A Y-max typed below 100 fits each day on its own: a percentile is a deliberate zoom into the day in view.
    maxVal = axisLevel(valuesForAxis, skipFirst, yMaxPct);
    yClipped = maxVal < dayTop;
  } else {
    maxVal = Math.max(yAxisSoFar(dateStr, isCoin), dayTop);
  }
  // A pin fixes the axis at that day's tallest bar: the scale stops moving altogether, so heights can be
  // compared directly with that day's, and a day taller than the pin runs into the top of the plot instead of
  // rescaling. An explicit Y-max still wins, since clipping the bars by percentile is its own deliberate
  // instruction.
  var peakVal = (peak && !(yClipped && yMaxExplicit[viewIdx])) ? peak[1] : 0;
  if (peakVal > 0) maxVal = peakVal;
  if (!(maxVal > 0)) maxVal = 1; // nothing to show yet (USD before any stamp above $0): a placeholder below any real first bar
  var btnPeakEl = document.getElementById("btnPeak");
  // Twenty equal intervals from 0 to the top, each labelled, the top included (see axisLabels), one gridline each.
  var yTickvals = axisTicks(maxVal), yTicktext = axisLabels(yTickvals, isCoin);
  // ---- Price axis ------------------------------------------------------------------------------------
  // The same twenty steps across the whole span, both ends labelled, kept horizontal (auto-rotated ticks pushed
  // the axis title into the credit line). Its $0 is nudged right of the corner, where it ran into the left axis's.
  var xTickvals = axisTicks(xSpan), xTicktext = axisLabels(xTickvals, false);
  xTicktext[0] = "\u00a0\u00a0" + xTicktext[0];
  // A plot too narrow for twenty-one labels side by side (a portrait tablet, a narrow window) labels every other
  // step, or fewer still, rather than running them together; all twenty-one gridlines stay.
  var xLabelW = xTicktext.reduce(function(m, s) { return Math.max(m, textPx(s, 11) * 1.07); }, 0);
  var xEvery = [1, 2, 4, 5, 10, 20].filter(function(n) { return xLabelW + 8 <= n * plotW / AXIS_STEPS; })[0] || AXIS_STEPS;
  if (xEvery > 1) xTicktext = xTicktext.map(function(s, k) { return k % xEvery ? "" : s; });

  var d = new Date(dateStr + "T00:00:00");
  var titleDate = d.toLocaleDateString(L3("en-GB","zh-CN","ja-JP"), {day:"2-digit",month:"short",year:"numeric"});
  var titleText;
  if (isCoin) {
    titleText = "<b>" + t("titleBTCAge") + titleDate + "</b>";
  } else {
    titleText = "<b>" + t("titleUSDAge") + titleDate + "</b>";
  }
  // 20 px unless that is wider than the plot it is centred over, where it was cut off at both ends; then as large
  // as fits, down to 12 px.
  var titleSize = Math.max(12, Math.min(20, Math.floor(20 * (plotW - 8) / (textPx(titleText.replace(/<[^>]+>/g, ""), 20) * 1.03))));

  var shapes = [];
  var annotations = [
    {xref:"paper",yref:"paper",x:0.5,y:0.5,text:"<span style='color:rgba(255,255,255,0.15);font-size:50px;font-weight:bold'>@RenshuBTC</span>",showarrow:false,font:{family:FONT}},
    {xref:"paper",yref:"paper",x:0,y:0,yanchor:"bottom",yshift:creditRow?-38:creditWrap?-76:-62,text:creditShown,showarrow:false,font:{size:creditSize,color:"rgba(255,255,255,0.55)",family:FONT},xanchor:"left",align:"left"}
  ];

  // Spot line and its label are drawn above everything else so they stay readable while navigating. The line
  // is a 1 px dash, thinner than a bar, so it never hides a tall bar behind it. It is white, and switches to the
  // bottom-signal yellow while the signal is on (colour only, no glow, so it still covers nothing).
  var spotLineColor = isBottom ? GLOW_COLOR : "#ffffff";
  var spotBox = null, spotAnn = null; // where the spot price box sits: plot fractions across, pixels down from the top
  if (spot && spot > 0) {
    shapes.push({type:"line",x0:spot,x1:spot,y0:0,y1:1,xref:"x",yref:"paper",line:{color:spotLineColor,width:1,dash:"dash"},layer:"above"});
  }
  if (spot && spot > 0) {
    // The printed split comes from the unbinned series, not from the drawn bars. A bin that
    // straddles spot was counted wholly on one side and smoothing moved mass across it, which
    // shifted this number by up to 2.2 points and made it disagree with the bottom signal
    // printed directly beneath it — that line tests redPct, which was always exact.
    var lossShare = isCoin ? data.redPctCoin : redPct;
    var spotCumul = lossShare === null ? null : 100 - lossShare;
    var unavailable = L3("N/A", "不适用", "該当なし");
    var profitPct = spotCumul === null ? unavailable : spotCumul.toFixed(1) + "%";
    var lossPct = spotCumul === null ? unavailable : lossShare.toFixed(1) + "%";
    var labelText = hp + spot.toLocaleString("en-US",{maximumFractionDigits: spot < 10 ? 2 : 0}) + "<br><span style='color:" + PROFIT_COLOR + "'>" + (isCoin ? t("btcProfit") : t("usdProfit")) + profitPct + "</span><br><span style='color:" + LOSS_COLOR + "'>" + (isCoin ? t("btcLoss") : t("usdLoss")) + lossPct + "</span>";
    // Bottom signal: a fourth line in bright yellow (the words the old status-bar banner had), and the box border
    // turns the same yellow. Colour only, no glow anywhere.
    if (isBottom) labelText += "<br><span style='color:" + GLOW_COLOR + "'>" + t("bottomSignal") + redPct.toFixed(1) + t("bottomSignalSuffix") + "</span>";
    // The label sits to the right of the spot line unless it would run past the plot edge, in which
    // case it flips to the left of the line (estimate: 13px monospace ~7.9px per character, plus box).
    var plotPx = Math.max(200, plotWidthPx());
    var labelPx = labelText.split("<br>").reduce(function(m, s){ return Math.max(m, textPx(s.replace(/<[^>]+>/g, ""), 13)); }, 0);
    var labelFrac = (labelPx + 24) / plotPx;
    var flipLabel = (spot / xSpan) + labelFrac > 0.99;

  // older date) is drawn, and pressing the key again has to retry rather than do nothing.

document.getElementById("chart").addEventListener("pointerdown", function() {

document.getElementById("chart").addEventListener("click", function(e) {

document.getElementById("controls").addEventListener("click", function(e) {

var explainOpenedByKeys = false;

document.addEventListener("keydown", function(e){

  // Without this every browser shortcut is hijacked: e.key for Ctrl+S is "s", which flipped

  if (e.ctrlKey || e.metaKey || e.altKey) return;

  // its options (jumping between landmarks) instead of stepping the chart, so navigation keys are handled here.
  if (e.target.tagName === "SELECT" && e.target.id !== "landmarks") return;

  else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { e.preventDefault(); goTo(stepTarget(currentIdx, 1)); }
  else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") { e.preventDefault(); setViewMode((viewIdx - 1 + VIEW_MODES.length) % VIEW_MODES.length); }
  else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); setViewMode((viewIdx + 1) % VIEW_MODES.length); }
  else if (e.key === "Home") { e.preventDefault(); goTo(0); }
  else if (e.key === "End") { e.preventDefault(); goTo(allDates.length - 1); }
  else if (e.key === "1") { e.preventDefault(); setInterval1(0); }
  else if (e.key === "2") { e.preventDefault(); setInterval1(1); }
  else if (e.key === "3") { e.preventDefault(); setInterval1(2); }
  else if (e.key === "4") { e.preventDefault(); setInterval1(3); }

});

// First position whose date is on or after d (allDates is sorted), allDates.length if none.
function dateLowerBound(d) {
  var lo = 0, hi = allDates.length;
  while (lo < hi) { var mid = (lo + hi) >> 1; if (allDates[mid] < d) lo = mid + 1; else hi = mid; }
  return lo;
}
// A cycle top or bottom: that day, or the last listed day before it if the list skips it.
document.getElementById("landmarks").addEventListener("change", function(e){
  var d = e.target.value;

  if (allDates.length) {
    var i = dateLowerBound(d), idx = allDates[i] === d ? i : Math.max(0, i - 1);
    if (allDates[idx] !== d) showNotice(t("notFound") + allDates[idx]);
    goTo(idx, true);
  }
  e.target.value = "";
  e.target.blur();
});

async function init() {
  fetchJSON("data/youtube.json").then(setYouTubeLink, function() {});   // on its own: the chart never waits for it
  try {
    document.getElementById("dateDisplay").textContent = t("loadingDates");
    var loaded = await Promise.all([
      fetchJSON(BASE + "/api/series/cost-basis/all/dates"),
      fetchJSON(BASE + "/api/series/price_close/day1").catch(function(e) { console.warn("Price array preload failed:", e); return null; }),
      fetchJSON(BASE + "/api/series/date/day1").catch(function(e) { console.warn("Price date index preload failed, using UTC epoch fallback:", e); return null; }),
      // The axis history (see "Axes that only grow"). Without it every day still draws, on axes fitted to itself.
      fetchJSON("data/scales.json").catch(function(e) { console.warn("Axis history unavailable, axes fit each day:", e); return null; })
    ]);
    setScales(loaded[3]);
    priceArray = loaded[1] && cleanSeries(loaded[1].data || loaded[1], function(v) { return isAmount(v) && v > 0; });
    priceDates = loaded[2] && cleanSeries(loaded[2].data || loaded[2], isDateString);
    if (priceDates) {
      priceIndexByDate = {};
      for (var di = 0; di < priceDates.length; di++) if (priceDates[di]) priceIndexByDate[priceDates[di]] = di;
    }
    // Publish navigable dates only once price initialization has settled. Toolbar actions
    // before this point can change settings, but cannot cache a chart with missing prices.
    allDates = cleanDates(loaded[0]);
    if (!allDates.length) throw pageError(function() { return t("errNoDates"); });
    // The counter's box keeps the width of its longest reading, N/N, so neither it nor the buttons after it move as
    // the day number gains digits: one ch per character of the monospace font, plus 8px padding and a 1px border a side.
    document.getElementById("dateDisplay").style.minWidth = "calc(" + (2 * String(allDates.length).length + 1) + "ch + 18px)";
    currentIdx = allDates.length - 1;
    await loadAndRender();
  } catch (e) {
    document.getElementById("dateDisplay").textContent = t("errPrefix") + errorText(e);
    showNotice(function() { return t("errBRK"); }, true);  // fatal: the app is dead, this must not auto-hide after 6 s
  }
}

// ---- Draggable tracer: grab the dot on the BTC price line and drag it; the URPD follows the date ----
// The dot is a fixed-position element laid over Plotly's marker (Plotly's own drag layer would otherwise
// turn the gesture into a zoom box). While dragging, the overlay window is frozen so the line stays put
// under the cursor; on release it re-centres as usual.
window.tracerDragWindow = null;
(function(){
  var el = document.getElementById("tracer");
  var gd = document.getElementById("chart");
  function axes() { var fl = gd._fullLayout; return fl && fl.xaxis2 && fl.yaxis3 && fl.xaxis2._length ? fl : null; }
  window.placeTracer = function() {
    var fl = axes();
    var data = lastRenderedData; // the dot marks the date the chart is showing
    var spot = data && data.spot;
    if (!fl || !showPriceOverlay || !(spot > 0)) { el.classList.remove("show"); return; }
    var xa = fl.xaxis2, ya = fl.yaxis3;
    var x = xa._offset + xa.d2p(data.dateStr);
    var y = ya._offset + ya.d2p(spot);
    if (!isFinite(x) || !isFinite(y) || x < xa._offset - 8 || x > xa._offset + xa._length + 8) { el.classList.remove("show"); return; }

    // on a phone is a 2000px space drawn through scale(var(--fit)). Absent on desktop, so
    // parseFloat("") is NaN and the factor is exactly 1.
    var fit = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fit")) || 1;
    el.style.left = (r.left + x * fit) + "px";
    el.style.top = (r.top + y * fit) + "px";
    el.classList.add("show");
  };
  window.addEventListener("resize", function(){ setTimeout(window.placeTracer, 80); });
  function nearestDateIndex(ds) {
    var lo = 0, hi = allDates.length - 1;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (allDates[mid] < ds) lo = mid + 1; else hi = mid; }
    if (lo > 0) {
      var t = new Date(ds + "T00:00:00Z").getTime();
      if (Math.abs(new Date(allDates[lo - 1] + "T00:00:00Z").getTime() - t) < Math.abs(new Date(allDates[lo] + "T00:00:00Z").getTime() - t)) lo--;
    }
    return lo;
  }
  function indexAtClientX(cx) {

    var fit = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fit")) || 1;

  });

var EXPLAINER = {
  en: {"title": "How to read this chart", "sections": [["Start here", "Ask every bitcoin in existence one question: what was bitcoin worth the last time you moved? Sort the answers into price buckets and add up the supply in each. That is this chart. A tall bar is a price where a lot of supply last changed position. A gap is a price where almost none did. The formal name for it is URPD, the UTXO Realised Price Distribution."], ["What a UTXO is", "Bitcoin has no account balances. It works like cash in a pocket: you hold separate notes, and to pay 12 dollars with a 20 you hand over the whole note and take 8 back as change. Each note is a UTXO, an Unspent Transaction Output. Your wallet balance is only the sum of the notes you happen to hold, and every bar on this chart is built out of them."], ["Why every coin carries a price", "A UTXO is created inside a block, that block has a timestamp, and that moment has a bitcoin price. So every coin alive today has a price attached to it: the price on the day it last moved. Nothing is surveyed or estimated, the chain records it. That attached price is the coin's realised price, also called its cost basis. It is the closest thing on-chain to what the current holder paid."], ["Reading the axes", "Along the bottom is that attached price in dollars, not today's price. Up the left is how much supply sits in each price bucket. Both axes are marked at twenty equal steps from zero to their very end, with the labels rounded to two significant figures. Neither axis is refitted to each day. Each ends at the furthest the data had reached by the day you are viewing, the highest price and the tallest bar so far, grows only when the data goes past it, and never shrinks. Moving forward you watch the market outgrow the old scale; moving back you see every day exactly as it looked at the time, however you got there. In BTC mode the first bar is left out of this: it holds every coin last moved for less than one bar's width, about 1.85M BTC of it from before bitcoin traded above 50 cents, so it runs off the top with its height printed there."], ["The colours: how old the coins are", "Every bar is stacked out of 23 age bands, set by how long the coin has sat unmoved: under an hour at one end, over fifteen years at the other. Yellow is fresh, deep blue is ancient, and the steps between are logarithmic, so equal colour distance is equal multiples of age. The colours follow one path through a perceptual colour space (OKLCH), spaced so that every step looks the same size, with brightness falling steadily from young to old, so the order still reads in greyscale, and every band keeps at least 3:1 contrast against the dark background. A tall bar in one colour is a single cohort. A tall bar in many colours is a price that generations of holders share."], ["The white line: bitcoin's price", "Bitcoin's own price, as daily closes. It has its own hidden axes: left to right is time here rather than price, running from 275 days before the selected day to 90 days after it, and the height runs linearly from $0 to the highest close shown so far, so the line fills the chart and the same dollar move is always the same height. That scale grows only when the price makes a new high. The orange dot sits on the selected day and past cycle tops and bottoms are marked. Drag the dot to move through history. Click BTC/USD in the legend to hide the line."], ["Hovering a bar", "Hover over a bar to read its price, what its age band holds there, the whole bar's total (Total USD Value Last Moved, or Total BTC Supply Last Moved in BTC mode) and Percent of Total. That last one is a running share: of all the day's supply, or value in USD mode, the part that last moved at or below this price. Where it climbs quickly from bar to bar, supply is dense.", "Percent of Total(P) = Σ W(p ≤ P) / Σ W × 100"], ["The dashed line: today's price", "The spot price on the selected day. Supply to its left last moved cheaper than today, so it is held at a paper profit. Supply to its right is held at a paper loss. The box gives the price and both shares.", "Profit % = Σ W(P) for P ≤ Spot / Σ W(P) × 100"], ["What people look for", "A thick cluster of bars marks a price where a lot of supply settled. Above today's price such a cluster is often read as overhead resistance, on the reasoning that holders who last moved coins there may sell near break-even. Below today's price the same cluster is read as support. A wide gap is a stretch with little supply to slow a move through it. Treat all of it as a map of where supply sits, not a forecast of where price goes."], ["What this chart cannot tell you", "A coin moving on-chain is not always a sale. Exchanges shuffle their own coins, people consolidate their own UTXOs, custodians rotate wallets, and each of those restamps coins at that day's price with no buyer and no seller. The reverse is also true: a trade matched inside an exchange never touches the chain, so both sides keep their old stamp. Coins whose keys are lost keep theirs forever. Read a bar as supply that last moved here, not as proof that someone paid this."], ["Moving through time", "Published versions of this chart usually show only today. This one steps through the whole history, day by day, back to 2009-01-03. 1D/1W/1M/1Y sets the step size and the arrow buttons move one step; Left and Right or A and D do the same from the keyboard. 1 to 4 pick the step size, Home and End jump to the first and last day, and Up and Down or W and S switch between USD and BTC. You can also pick a cycle top or bottom from CYCLE TOP/BTM. If the keys stop responding, click the chart once to take focus off a toolbar field."], ["USD mode and BTC mode", "BTC counts each coin by how much bitcoin it is. USD counts it by what it was worth in dollars at the moment it last moved, so one coin last moved at 100,000 dollars outweighs the same coin last moved at 100. BTC shows where the coins are. USD shows where the money went in.", "S(P) = Σ utxo.value where utxo.price ∈ [P, P + ΔP)\nUSD Value at Last Move(P) = P · S(P)"], ["Pin scale", "The left axis only ever grows, so nearby days usually share a scale already. PIN SCALE freezes it outright at the tallest bar of the day you are viewing, marked with a dashed line, so every other day is drawn against that one height, and taller bars run off the top instead of moving the axis. Press it again to release. Pins are kept separately for each weighting, bin count and smoothing, because a height only means the same thing under the same settings, and they survive a reload."], ["Bottom signal", "When the share of value held at a loss reaches the threshold set in the toolbar, 80 percent by default, a fourth line appears in the spot-price box and the spot line turns yellow. Readings that extreme have historically clustered near cycle lows. That is a pattern in the past, not a rule about the future.", "Signal when Loss% ≥ Threshold"], ["Bins", "The price axis is cut into equal-width buckets from zero to its right-hand end, which is the highest cost basis so far plus a sliver for the smoothing (see Reading the axes). 625 buckets across a 126,000 dollar axis is about 200 dollars each; the dollar width is shown beside the field. Bucket widths change only when the axis grows. Bars are drawn on whole pixels with a one-pixel gap so neighbours stay distinct, and are drawn solid once they would be thinner than two pixels.", "ΔP = price axis end / bins"], ["Smoothing", "The source data is rounded: every coin carries its block's price to the nearest dollar below 100,000 dollars and the nearest ten dollars above, so each recorded price really stands for a small range, and a single large transfer can pile onto one exact figure and throw up a spike that is an artefact of the rounding. Smoothing spreads each recorded price evenly back over the range it was rounded from, then blurs it with a bell curve, the Gaussian, the one blur that never invents a peak or a gap. Its width is a percentage of the price and never less than about four tenths of a bar, and each bar receives exactly its share. 0.24, the default, is how far bitcoin's price typically moves in the few minutes a recorded price can hide, measured over the whole history. 0 gives the raw buckets. Total supply and total value are preserved exactly.", "σ = √((S% × price)² + ΔP²/6)   (S = 0: raw)\nbar = the part of [stamp ± step/2] ∗ N(0, σ) inside the bar"], ["Y-max", "At 100, the default, the left axis ends at the tallest bar so far and only grows (see Reading the axes). A lower value zooms into the day in view instead: the axis ends at that percentile of the day's bar heights, follows the day as you move, and clips what pokes above. An explicit Y-max overrides a pinned scale.", "y-max = tallest bar so far             (at 100)\ny-max = percentileₙ(this day's bars)   (below 100)"], ["Download the video", "The download button (the arrow at the right of the toolbar) downloads the whole history as one video: every day from 31 January 2011, when the first bars appear on the chart, to the latest, with neighbouring days blended so it runs smoothly, 5 minutes at 60 frames a second in 4K (3840 × 2160), about 250 MB. It is drawn in USD with this page's default settings. A GitHub workflow rebuilds it every day, and the day that just ended is usually in it by about 04:00 UTC. Once the daily video is on YouTube, a play button beside the download button opens the latest one there. The file is always an .mp4 video from github.com/renshuBTC/URPD-History, and GitHub keeps a signed record of the build that made it, so anyone can check it is genuine. This site never asks you to install anything, connect a wallet or type a seed phrase; anything that does is not this site."], ["Where the data comes from", "Distributions and prices come from the Bitcoin Research Kit, which derives them from a full Bitcoin Core node, served through bitview.space. URPD was introduced by Renato Shirakashi in April 2020. This version adds the daily history and the age colouring."]]},
  zh: {"title": "如何看懂这张图", "sections": [["先看这里", "向现存的每一枚比特币问同一个问题：你上一次移动时，比特币值多少钱？把答案按价格区间归类，再把各区间的供应量加总，就得到这张图。柱子越高，说明有越多供应最后一次移动发生在那个价位；出现空档，说明几乎没有。它的正式名称是 URPD，即 UTXO 已实现价格分布。"], ["什么是 UTXO", "比特币没有账户余额，它更像口袋里的现金：你手上是一张张钞票，用 20 元付 12 元时，要把整张递出去，再收回 8 元找零。每一张这样的钞票就是一个 UTXO，即未花费交易输出。钱包余额只是你手上这些钞票的总和，而这张图里的每一根柱子都由它们堆叠而成。"], ["为什么每枚币都带着一个价格", "UTXO 诞生在某个区块里，区块带有时间戳，那一刻又对应一个比特币价格。所以今天存在的每一枚币身上都贴着一个价格：它最后一次移动那天的价格。这不是问卷调查，也不是估算，而是链上如实记录的。这个价格就是该币的已实现价格，也叫成本基础，是链上最接近“当前持有者付出了多少”的量。"], ["坐标轴怎么读", "横轴是上面那个贴在币上的价格（美元），不是今天的价格。纵轴是每个价格区间里有多少供应量。两条轴都从零到末端分成二十等份标注，标签取两位有效数字。两条轴都不会按每一天重新缩放：它们停在截至所看那天、数据到达过的最远处，也就是迄今最高的价格和最高的柱子；只有数据越过时才会扩大，而且永远不会缩小。向后推进时，你会看到市场撑大原来的刻度；往回看时，每一天都和当时的样子完全相同，不论你是怎么走到那一天的。BTC 模式下的第一根柱子不参与定轴：它装着所有最后移动价格低于一根柱宽的币，其中约 185 万枚来自比特币价格还不到 0.5 美元的年代，因此会冲出顶部，并在顶端标出它的高度。"], ["颜色：币有多老", "每根柱子由 23 个币龄分层堆成，依据是这枚币静止了多久，一端不到一小时，另一端超过十五年。黄色最新，深蓝最老，中间按对数分级，所以相同的颜色距离对应相同的年龄倍数。颜色沿感知均匀色彩空间（OKLCH）中的一条路径排列，每一级看起来一样大，亮度从新到旧稳定下降，因此在灰度下也能读出顺序；每个分层与深色背景的对比度都不低于 3:1。整根柱子只有一种颜色，说明是单一群体；颜色斑驳，说明这个价位上聚集着好几代持有者。"], ["白线：比特币价格", "比特币自身的价格，按日收盘价绘制。它用的是另一套隐藏坐标：这里的左右方向是时间而不是价格，范围是所选日期之前 275 天到之后 90 天；高度按线性刻度从 0 美元到迄今显示过的最高收盘价，所以这条线填满图表，同样的美元涨跌始终是同样的高度。只有价格创新高时，这个刻度才会扩大。橙色圆点标出所选当天，历史上的周期顶部与底部也已标注。拖动圆点即可在历史中移动。点击图例中的 BTC/USD 可以隐藏这条线。"], ["悬停查看柱子", "把鼠标停在柱子上，可以看到它的价格、该币龄层在那里的数量、整根柱子的合计（最后移动的美元总价值；BTC 模式下为最后移动的 BTC 总供应），以及占总量百分比。最后这一项是累计占比：当天全部供应（USD 模式下为全部价值）中，最后一次在该价格或更低价格移动的部分。相邻柱子之间它上升得越快，那里的供应越密集。", "Percent of Total(P) = Σ W(p ≤ P) / Σ W × 100"], ["虚线：当天价格", "所选当天的现价。它左边的供应最后一次移动时比今天便宜，因此处于账面盈利；右边的供应处于账面亏损。方框中给出价格以及这两个比例。", "Profit % = Σ W(P) for P ≤ Spot / Σ W(P) × 100"], ["大家在看什么", "密集成团的柱子代表大量供应沉淀在那个价位。若它位于今天价格之上，常被解读为上方阻力，理由是当初在那里移动过币的持有者可能在回本附近卖出；若位于下方，同一团柱子则被解读为支撑。宽阔的空档意味着这一段几乎没有供应去减缓价格穿越。这些都应当视为供应分布的地图，而不是价格走向的预测。"], ["这张图不能告诉你什么", "链上的一次移动并不等于一次成交。交易所在内部调拨自有币，用户合并自己的 UTXO，托管方轮换钱包，这些都会以当天价格重新打上标记，却没有买方也没有卖方。反过来同样成立：在交易所内部撮合的成交根本不上链，买卖双方身上的旧标记原封不动。私钥丢失的币则会永远保留它们的标记。请把一根柱子读作“供应最后一次在此移动”，而不是“有人以此价成交”。"], ["在历史中移动", "公开发布的同类图表通常只显示当天。这张图可以逐日回溯整段历史，一直回到 2009-01-03。1D/1W/1M/1Y 设定步长，箭头按钮移动一步，键盘上的左右方向键或 A/D 同样可用。1 到 4 选择步长，Home/End 跳到最早与最新一天，上下方向键或 W/S 在 USD 与 BTC 之间切换。你也可以从“周期顶部/底部”中选择某个周期顶部或底部。若按键失灵，在图表上点一下，把焦点从工具栏输入框移开即可。"], ["美元模式与 BTC 模式", "BTC 模式按币的数量计量。USD 模式按它最后一次移动那一刻的美元价值计量，因此一枚在 10 万美元处最后移动的币，远重于同样一枚在 100 美元处移动的币。BTC 模式显示币在哪里，USD 模式显示钱投在哪里。", "S(P) = Σ utxo.value where utxo.price ∈ [P, P + ΔP)\nUSD Value at Last Move(P) = P · S(P)"], ["固定刻度 (PIN SCALE)", "左轴只会扩大、不会缩小，所以相近日子的柱子通常已经处在同一刻度上。PIN SCALE 则把左轴直接锁定在当前这一天最高的那根柱子，并用虚线标出，之后其他日期都按这一高度绘制，更高的柱子会冲出顶部，而不会改变刻度。再按一次即可解除。固定值按加权方式、分箱数与平滑度分别保存，因为只有在相同设置下柱高才具有相同含义；刷新页面后依然保留。"], ["底部信号", "当处于亏损的价值占比达到工具栏中设定的阈值（默认 80%）时，现价方框中会多出第四行，现价线也转为黄色。历史上如此极端的读数往往集中出现在周期低点附近。这是过去的规律，不是对未来的保证。", "Signal when Loss% ≥ Threshold"], ["分箱 (Bins)", "价格轴被切成等宽区间，从 0 一直到轴的右端，也就是迄今最高的成本基础，再加上平滑所需的一小段（见“坐标轴怎么读”）。在约 12.6 万美元的轴上分成 625 个区间，每格约 200 美元；每格的美元宽度显示在输入框旁边。只有轴扩大时，区间宽度才会改变。柱子对齐到整像素，相邻之间留出一像素间隙以便区分；当柱宽不足两像素时则实心绘制。", "ΔP = price axis end / bins"], ["平滑 (Smoothing)", "源数据经过取整：每枚币记录的是其区块的价格，10 万美元以下取整到 1 美元，以上取整到 10 美元，所以每个记录的价格其实代表一小段价格；一笔大额转账可能全部压在同一个精确数字上，形成一根由取整造成的假尖峰。平滑先把每个记录的价格均匀摊回它被取整之前的那一小段，再用钟形曲线加以模糊。这条曲线是高斯曲线，唯一不会凭空制造峰或缺口的模糊方式；它的宽度是价格的一个百分比，且不小于约十分之四根柱宽，每根柱子精确地分得属于自己的那一份。默认值 0.24，是在整段历史中，比特币价格在一个记录价格所能掩盖的几分钟内通常移动的幅度。设为 0 则显示原始分箱。总供应量与总价值完全保持不变。", "σ = √((S% × price)² + ΔP²/6)   (S = 0: raw)\nbar = the part of [stamp ± step/2] ∗ N(0, σ) inside the bar"], ["Y 轴上限 (Y-max)", "默认值 100 时，左轴停在迄今最高的柱子，只增不减（见“坐标轴怎么读”）。调低则改为放大当前这一天：轴的上限取当天柱高的该百分位数，随日期变化，超出的部分会被截断。显式设定的 Y-max 优先于已固定的刻度。", "y-max = tallest bar so far             (at 100)\ny-max = percentileₙ(this day's bars)   (below 100)"], ["下载视频", "工具栏右侧的下载按钮（向下的箭头）会把整段历史下载为一个视频：从 2011 年 1 月 31 日（图上出现第一批柱子）到最新一天，相邻日期平滑过渡，时长 5 分钟，每秒 60 帧，4K（3840 × 2160），约 250 MB。视频以美元模式和本页的默认设置绘制，由 GitHub 工作流每天重新生成，刚结束的一天通常约在 UTC 04:00 前加入。每日视频上传到 YouTube 后，下载按钮旁会出现一个播放按钮，点击即可在 YouTube 观看最新一期。文件始终是来自 github.com/renshuBTC/URPD-History 的 .mp4 视频，GitHub 保存着生成它的那次构建的签名记录，任何人都可以核实它是否为正版。本站从不要求你安装任何软件、连接钱包或输入助记词；凡是这样要求的，都不是本站。"], ["数据来源", "分布与价格数据来自 Bitcoin Research Kit，由完整的 Bitcoin Core 节点推导而来，经 bitview.space 提供。URPD 由 Renato Shirakashi 于 2020 年 4 月提出，本版本在其基础上加入了逐日历史与币龄着色。"]]},
  ja: {"title": "このチャートの読み方", "sections": [["まずはここから", "いま存在するすべてのビットコインに同じ質問をします。「最後に動いたとき、ビットコインはいくらでしたか」。その答えを価格帯ごとにまとめ、各帯の供給量を合計したものがこのチャートです。棒が高い価格帯は、多くの供給が最後に動いた場所。空白の価格帯は、ほとんど動かなかった場所です。正式には URPD（UTXO 実現価格分布）と呼ばれます。"], ["UTXO とは", "ビットコインに口座残高はありません。仕組みはポケットの中の現金に近く、手元にあるのは一枚ずつの紙幣です。20 ドル札で 12 ドル払うには札ごと渡し、8 ドルをお釣りとして受け取ります。この一枚一枚が UTXO、すなわち未使用トランザクションアウトプットです。ウォレットの残高は手元にある札の合計にすぎず、このチャートの棒はすべてそれを積み上げたものです。"], ["すべてのコインが価格を持つ理由", "UTXO はあるブロックの中で生まれ、そのブロックにはタイムスタンプがあり、その時点にはビットコイン価格があります。つまり今日存在するすべてのコインには価格が刻まれています。最後に動いた日の価格です。アンケートでも推計でもなく、チェーンがそのまま記録しています。この刻まれた価格がそのコインの実現価格、別名コストベーシスで、「現在の保有者がいくら払ったか」にオンチェーンで最も近い値です。"], ["軸の読み方", "横軸はいま説明した「コインに刻まれた価格」（ドル）で、今日の価格ではありません。縦軸は各価格帯にどれだけの供給があるかです。どちらの軸も 0 から端までを 20 等分して目盛りを付け、ラベルは有効数字 2 桁に丸めています。どちらの軸も日ごとに合わせ直すことはしません。表示中の日までにデータが到達した最も遠いところ、つまりそれまでの最高価格と最も高い棒で止まり、データがそこを越えたときだけ広がり、決して縮みません。先へ進めば市場が古い目盛りからはみ出していく様子が見え、戻れば、どうたどり着いても各日が当時とまったく同じ姿で表示されます。BTC モードの最初の棒はこの決定に加えません。最後に動いた価格が棒 1 本分の幅に満たないコインがすべて入っており、そのうち約 185 万 BTC はビットコインが 50 セントを超える前のものです。上端を突き抜けるため、その高さを上端に表示します。"], ["色：コインの古さ", "どの棒も 23 段階の年齢帯を積み重ねたものです。基準はそのコインが動かずにいた期間で、片端は 1 時間未満、もう片端は 15 年超。黄色が新しく、濃い青が古く、その間は対数で刻まれているため、同じ色の隔たりは同じ年齢の倍率にあたります。色は知覚的に均等な色空間（OKLCH）の一本の経路に沿って並び、どの段差も同じ大きさに見えるよう配置され、明るさは新しいものから古いものへ一様に下がるので、グレースケールでも順序が読み取れます。どの帯も暗い背景に対して 3:1 以上のコントラストを保ちます。単色の高い棒は単一の層、色とりどりの高い棒は世代の異なる保有者が重なっている価格です。"], ["白い線：ビットコイン価格", "ビットコイン自身の価格を日足終値で描いたものです。この線だけは別の（非表示の）軸を使っており、左右方向は価格ではなく時間で、選択日の 275 日前から 90 日後までを表します。高さは 0 ドルからそれまでに表示された最高終値までの線形目盛りなので、線はチャートいっぱいに広がり、同じドル幅の値動きは常に同じ高さになります。この目盛りが広がるのは価格が高値を更新したときだけです。オレンジの点が選択日で、過去のサイクル天井と大底も示してあります。点をドラッグすれば履歴をたどれます。凡例の BTC/USD をクリックすると線を隠せます。"], ["棒にカーソルを合わせる", "棒にカーソルを合わせると、その価格、その年齢帯がそこに持つ量、棒全体の合計（最終移動 USD 評価額の合計。BTC モードでは最終移動 BTC 供給量の合計）、そして全体に占める割合が表示されます。最後の値は累計の割合で、その日の供給全体（USD モードでは価値全体）のうち、その価格以下で最後に動いた部分です。棒から棒へ急に増えるところは供給が密集しています。", "Percent of Total(P) = Σ W(p ≤ P) / Σ W × 100"], ["破線：その日の価格", "選択した日の現在値です。その左側の供給は今日より安く最後に動いたので含み益、右側は含み損の状態です。ボックスに価格と両方の割合が出ます。", "Profit % = Σ W(P) for P ≤ Spot / Σ W(P) × 100"], ["何を読み取るのか", "棒が厚く固まっている価格は、多くの供給が滞留した場所です。今日の価格より上にあれば、そこで最後に動かした保有者が損益分岐付近で売るかもしれない、という理由から上値抵抗と読まれることが多く、下にあれば同じ塊が支持と読まれます。広い空白は、値動きを鈍らせる供給が乏しい区間です。いずれも供給の分布図であって、価格の予測ではありません。"], ["このチャートで分からないこと", "オンチェーンの移動が必ず売買とは限りません。取引所が自社のコインを動かし、利用者が自分の UTXO をまとめ、カストディアンがウォレットを入れ替える。そのたびにコインはその日の価格で刻み直されますが、買い手も売り手もいません。逆もまた同じで、取引所の内部で約定した取引はチェーンに触れないため、双方とも古い刻印のままです。鍵を失ったコインは永遠にその刻印を保ちます。棒は「供給が最後にここで動いた」ことを示すもので、「誰かがこの値段で買った」証拠ではありません。"], ["履歴をたどる", "公開されている同種のチャートは通常その日だけを表示します。これは 2009-01-03 まで一日ずつさかのぼれます。1D/1W/1M/1Y が刻み幅、矢印ボタンが 1 刻みの移動で、キーボードの左右または A/D でも同じ操作ができます。1〜4 で刻み幅を選び、Home/End で最初と最後の日へ飛び、上下または W/S で USD と BTC を切り替えます。天井/大底からサイクルの天井・大底を選ぶこともできます。キーが効かなくなったら、チャートを一度クリックしてツールバーの入力欄からフォーカスを外してください。"], ["USD モードと BTC モード", "BTC はコインをビットコインの量で数えます。USD は最後に動いた時点のドル価値で数えるため、10 万ドルで最後に動いた 1 枚は、同じ 1 枚でも 100 ドルで動いたものよりはるかに重くなります。BTC はコインの在処を、USD は資金の入った場所を示します。", "S(P) = Σ utxo.value where utxo.price ∈ [P, P + ΔP)\nUSD Value at Last Move(P) = P · S(P)"], ["スケール固定 (PIN SCALE)", "左軸は広がるだけで縮まないため、近い日どうしはたいてい同じ目盛りで比べられます。PIN SCALE はさらに、表示中の日の最も高い棒で左軸をそのまま固定し、破線で示します。以後どの日もその高さを基準に描かれ、それより高い棒は軸を動かさずに上端を突き抜けます。もう一度押せば解除されます。固定値は重み付け・ビン数・スムージングごとに別々に保存されます。高さが同じ意味を持つのは設定が同じときだけだからです。再読み込みしても残ります。"], ["ボトムシグナル", "含み損の価値の割合がツールバーで設定したしきい値（既定 80%）に達すると、現在値ボックスに 4 行目が現れ、現在値の線が黄色に変わります。これほど極端な値は、歴史的にはサイクルの底の近くに集まってきました。過去の傾向であって、将来の法則ではありません。", "Signal when Loss% ≥ Threshold"], ["ビン (Bins)", "価格軸は 0 から右端まで等幅に区切られます。右端はそれまでの最高コストベーシスに、スムージングの分をわずかに足したところです（「軸の読み方」を参照）。約 12.6 万ドルの軸を 625 分割すれば 1 区間は約 200 ドル。ドル幅は入力欄の横に表示されます。区間の幅が変わるのは軸が広がったときだけです。棒はピクセル単位に揃え、隣とは 1 ピクセル空けて描き分けますが、幅が 2 ピクセルを切る場合は塗りつぶしで描きます。", "ΔP = price axis end / bins"], ["スムージング (Smoothing)", "元データは丸められています。各コインにはブロックの価格が、10 万ドル未満は 1 ドル単位、以上は 10 ドル単位で記録されているため、記録された一つの価格は実際には小さな価格幅を表します。大口の送金ひとつが同じ数字に集中すると、丸めが生んだだけの尖りが現れます。スムージングは記録された各価格を、丸められる前の幅に均等に戻したうえで、ベル型の曲線でぼかします。これはガウス曲線で、山や谷を新たに作り出さない唯一のぼかし方です。幅は価格に対する割合で、棒の幅のおよそ 10 分の 4 を下回らず、各棒には自分の取り分が正確に配分されます。既定値の 0.24 は、記録された一つの価格に隠れうる数分の間にビットコイン価格が通常動く幅を、全履歴にわたって測ったものです。0 にすると生のビンになります。総供給量と総額は厳密に保たれます。", "σ = √((S% × price)² + ΔP²/6)   (S = 0: raw)\nbar = the part of [stamp ± step/2] ∗ N(0, σ) inside the bar"], ["Y軸上限 (Y-max)", "既定の 100 では、左軸はそれまでで最も高い棒で止まり、広がるだけです（「軸の読み方」を参照）。値を下げると、表示中の日を拡大する表示に切り替わります。軸の上限はその日の棒の高さのそのパーセンタイルになり、日付に合わせて変わり、はみ出した分は切り取られます。明示した Y-max は固定スケールより優先されます。", "y-max = tallest bar so far             (at 100)\ny-max = percentileₙ(this day's bars)   (below 100)"], ["動画のダウンロード", "ツールバー右側のダウンロードボタン（下向きの矢印）で全期間を 1 本の動画としてダウンロードできます。最初の棒がチャートに現れる2011年1月31日から最新日まで、隣り合う日をなめらかにつなぎ、5分・毎秒60フレーム・4K（3840 × 2160）、約250MB です。USD モードと本ページの既定の設定で描かれ、GitHub のワークフローが毎日作り直します。終わったばかりの日は通常 UTC 04:00 頃までに追加されます。毎日の動画が YouTube に上がると、ダウンロードボタンの隣に再生ボタンが現れ、YouTube で最新の動画を見られます。ファイルは常に github.com/renshuBTC/URPD-History から配信される .mp4 動画で、それを作ったビルドの署名付き記録を GitHub が保管しているため、誰でも本物かどうかを確認できます。このサイトがソフトのインストール、ウォレットの接続、シードフレーズの入力を求めることは決してありません。求めてくるものは、このサイトではありません。"], ["データの出所", "分布と価格は Bitcoin Research Kit によるもので、フルの Bitcoin Core ノードから導出され、bitview.space 経由で提供されています。URPD は 2020 年 4 月に Renato Shirakashi 氏が考案しました。本版はそこに日次の履歴と年齢による配色を加えたものです。"]]}
};
function updateExplainerLang() {
  var ex = EXPLAINER[lang] || EXPLAINER.en;
  var head = document.getElementById("explainTitle");
  if (head) head.textContent = ex.title;
  var box = document.getElementById("explainBody");
  if (!box) return;
  box.textContent = "";
  for (var i = 0; i < ex.sections.length; i++) {
    var s = ex.sections[i];
    var h = document.createElement("h3"); h.textContent = s[0]; box.appendChild(h);
    var d = document.createElement("div"); d.className = "desc"; d.textContent = s[1]; box.appendChild(d);
    if (s[2]) { var f = document.createElement("div"); f.className = "formula"; f.textContent = s[2]; box.appendChild(f); }
  }
}
updateExplainerLang();

// The only interaction on a phone is a tap on the left or right quarter of the screen,
// which steps the date back or forward. Everything else is deliberately inert: the figure
// is meant to read as a picture, so pinch-zoom, panning, Plotly hover and the modebar are
// all switched off rather than left to compete with the tap for the same touch. Quarters
// rather than a thin strip because this has to be hittable with a thumb without looking,
// and the middle half stays dead so a stray tap never moves the date.
if (IS_MOBILE) (function () {
  var EDGE = 0.25;
  var x0 = null, y0 = null, moved = false;
  // Passive throughout: the viewport is already locked, so nothing here needs to cancel a
  // default, and the listeners stay off the scrolling critical path.
  document.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { x0 = null; return; }
    // The orange dot, the legend, the mode bar and the credit line's links have their own use for a tap; one of
    // them near an edge must not step the date as well.
    var on = e.target && e.target.closest ? e.target.closest("#tracer, .legend, .modebar, a") : null;
    if (on) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false;
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (x0 === null || !e.touches.length) return;
    // A drag is not a tap. Without this a smudged touch near an edge would still fire.
    var t = e.touches[0];
    if (Math.abs(t.clientX - x0) > 12 || Math.abs(t.clientY - y0) > 12) moved = true;
  }, { passive: true });
  document.addEventListener("touchend", function () {
    if (x0 === null || moved) { x0 = null; return; }
    var w = window.innerWidth;
    if (x0 < w * EDGE) goTo(currentIdx - 1);
    else if (x0 > w * (1 - EDGE)) goTo(currentIdx + 1);
    x0 = null;
  }, { passive: true });
  document.addEventListener("touchcancel", function () { x0 = null; }, { passive: true });
})();
</script>
